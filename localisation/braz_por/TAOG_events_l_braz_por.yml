### INS News
  taog_news.1.t: "Fajar Uni Belanda-Indonesia"
  taog_news.1.desc: "Ratu Wilhelmina mengadakan pengumuman di [1058.GetName] kemarin, mengumumkan pembentukan negara Uni Belanda-Indonesia yang tidak terduga. Ketika tanah air berada di bawah pendudukan, pemerintahan [HOL.GetAdjective] dan pemerintahan [INS.GetAdjective] telah sepakat untuk memerintah sebagai satu badan di bawah Kerajaan. Para pejabat kedua negara menggambarkan langkah tersebut sebagai sebuah keharusan dan bukan pilihan, sebuah upaya putus asa untuk menjaga kesatuan dan otoritas Kerajaan di dua benua."
  taog_news.1.a: "Sebuah perkembangan yang sangat menarik."
  taog_news.2.t: "Proklamasi Kemerdekaan Indonesia"
  taog_news.2.desc: "Tokoh revolusioner [INS.GetAdjective], [INS.GetLeader], hari ini berpidato di Jawa memproklamasikan kemerdekaan Republik Indonesia yang baru terbentuk. [HOL.GetNameDef] tidak mengakui kedaulatan republik muda ini, namun milisi Republik telah memegang kendali de-facto atas wilayah-wilayah penting."
  taog_news.2.a: "Peristiwa ini dapat memicu pergeseran besar di panggung global."
  ############
  ### SIAM ###
  ############
  siam.1.t: "[SIA_phraya_phahon.GetName] Terlibat Skandal"
  siam.1.desc: "[SIA_phraya_phahon.GetName] dituduh menjual properti milik pemerintah kepada para pejabat dengan harga di bawah harga pasar, sebuah skandal yang secara signifikan mengurangi legitimasinya di Majelis Rakyat. Tampaknya pengaruh [SIA_phraya_phahon.GetName] akan segera berakhir."
  siam.1.a: "Mungkin ini membuka jalan bagi orang lain?"
  #Spmgsiradet rebellion historical
  siam.2.t: "Upaya ketiga pada kehidupan [SIA_plaek_phibunsongkhram.GetName]"
  siam.2.desc: "Sebuah pesan dari koresponden Reuters di Bangkok mengungkapkan upaya ketiga dalam empat tahun untuk meracuni Perdana Menteri Siam (Tuan, Phibul Songgram)\nMinggu lalu, disebutkan, racun dicampur dengan makanan dan untuk sementara mempengaruhi Tuan Songgram serta istri dan putrinya.\nMenteri Luar Negeri Inggris (Lord Halifax) dalam pesannya kepada Tuan Songgram, mengungkapkan kekhawatiran atas upaya pengecut terhadap kehidupan Perdana Menteri dan kesenangan dalam pelariannya." #https://trove.nla.gov.au/newspaper/article/47990695
  siam.2.a: "Siapa yang bisa melakukan ini?"
  siam.3.t: "Phraya Songsuradet Diasingkan"
  siam.3.desc: "Phraya Songsuradet dituduh sebagai dalang di balik satu atau lebih upaya pembunuhan terhadap [SIA_plaek_phibunsongkhram.GetName], serta merencanakan kudeta terhadap pemerintahannya. Pemerintah berkehendak agar Phraya Songsuradet dilepaskan dari komandonya, pangkat dan gelarnya dicopot, dipaksa pensiun dari militer tanpa pensiun dan pengusiran dari negara tersebut.\nKritik menyatakan bahwa ini adalah pembersihan terselubung, yang dihasut oleh [SIA_plaek_phibunsongkhram.GetName] untuk menyingkirkan saingan utamanya, namun hal ini jelas merupakan fitnah."
  siam.3.a: "Akhir yang menyedihkan."
  siam.4.t: "Simpatisan Songsuradet Ditangkap"
  siam.4.desc: "Pada dini hari, dengan bantuan Polisi Kerajaan Thailand, pemerintah telah menangkap 51 tersangka dan simpatisan tambahan, termasuk Pangeran Rangsit, Phraya Thepahatsadin dan Phraya Udom Pongphensawad. Mereka dituduh berkonspirasi dengan Phraya Songsuradet melawan negara, dengan catatan khusus bahwa Rangsit, seorang anggota keluarga kerajaan akan diadili. Beberapa komentator bertanya-tanya apakah sang pangeran secara khusus ditargetkan untuk mengirim pesan kepada bangsawan yang tersisa di [THIS.GetName], tetap mengantre atau gugur."
  siam.4.a: "Plotnya semakin tebal."
  siam.5.t: "Pemberontakan 18 Mayat"
  siam.5.desc: "Pengadilan khusus dibentuk oleh Phibul untuk mengadili 51 orang yang terlibat dalam pemberontakan, 25 orang di antaranya akan dipenjara seumur hidup, dan 21 orang akan dieksekusi oleh regu tembak. Dari 21 orang tersebut, ada tiga orang yang mendapat pengampunan karena catatan kehormatan mereka, yaitu Pangeran Rangsit dan Phraya Thepahatsadin."
  siam.5.a: "Perselingkuhan itu telah diselesaikan."
  #Songsuradet rebellion alternative
  siam.6.t: "Kebuntuan Songsuradet"
  siam.6.desc: "Phraya Songsuradet dituduh sebagai dalang dalam satu atau lebih upaya pembunuhan terhadap [SIA_plaek_phibunsongkhram.GetName], serta merencanakan kudeta terhadap pemerintahannya. Pemerintah berkehendak agar Songsuradet dilepaskan dari komandonya dan diasingkan.\nNamun, penangkapannya dicegah oleh personel militer yang setia kepada Songsuradet, dan mengecam penangkapan tersebut bermotif politik. Pemerintah dan kelompok militer Songsuradet kini menemui jalan buntu, keduanya menolak untuk mengalah."
  siam.6.a: "Kami tidak akan mundur."
  siam.6.b: "Hal ini menjadi bumerang. Mari kita mundur."
  siam.7.t: "Songsuradet Mencari dukungan Angkatan Laut"
  siam.7.desc: "Ketika ketegangan antara pasukan pemerintah dan kelompok militer Songsuradet terus berlanjut, para penyelidik pemerintah mulai mendengar desas-desus bahwa aliansi antara Angkatan Laut Kerajaan dan Songsuradet telah terbentuk dengan tujuan yang jelas untuk melawan otoritarianisme yang semakin meningkat dari Phibun.\nTidak hanya itu, beberapa pembantu Rumah Tangga Kerajaan telah melaporkan bahwa perwakilan dari Songsuradet bertemu dengan para pangeran berpangkat tinggi, sehingga meningkatkan kekhawatiran bahwa Kerajaan juga akan bersekutu dengan pihak oposisi."
  siam.7.a: "Kami adalah pemerintah, kami tidak akan diperas!"
  siam.7.b: "Ini sudah tidak terkendali. Ayo mundur."
    #alt-hist actual rebellion
   siam.8.t: "Pemberontakan Songsuradet"
   siam.8.desc: "Setelah mendapatkan dukungan yang cukup, baik secara politik maupun militer, klik militer Songsuradet bersama dengan Angkatan Laut telah secara efektif mengambil alih wilayah yang luas di [THIS.GetName]. Pada dini hari, tembakan terdengar di pinggiran kota Bangkok dan seluruh negeri tampaknya siap menghadapi perang saudara skala penuh antara pemerintah dan Songsuradet."
   siam.8.a: "Pemerintah harus bertahan."
  #alt-hist actual rebellion
   siam.9.t: "Akhir dari Pemberontakan Songsuradet"
   siam.9.desc: "Pemberontakan telah hancur dan dengan tertangkapnya Songsuradet, hanya tinggal persidangan yang tersisa, meskipun saat ini hanya sekedar formalitas. Konspirasi tersebut tidak hanya ditemukan di angkatan darat dan angkatan laut, namun juga di kalangan Kerajaan, dimana Pangeran Rangsit diketahui secara terbuka mendukung para pemberontak. Pembersihan mendalam terhadap para pembangkang telah menjadi suatu keharusan, bukan suatu alternatif."
   siam.9.a: "Ini adalah waktu untuk membangun kembali."
   #Attack Indochina
  siam.10.t: "Kemenangan!"
  siam.10.desc: "Musuh sedang bergerak maju, dan kemenangan kita tampaknya sudah pasti. Dengan wilayah yang dikuasai dengan kuat, kekuatan imperialis lama harus gemetar. Bagaimana mereka bisa kalah? Itu adalah tanda pemeliharaan ilahi kita."
  siam.10.a: "Untuk [ROOT.GetName]!"
  siam.10.b: "Sebenarnya ini berjalan cukup baik"
  siam.11.t: "[FROM.GetAdjective] Terobosan Strategis"
  siam.11.desc: "Di luar ekspektasi, militer [FROM.GetAdjective] telah mengungguli pasukan kami dan menguasai wilayah yang diperebutkan. Pendudukan mereka telah melemahkan otoritas kami dan menimbulkan keraguan atas klaim kami atas wilayah tersebut. Melanjutkan konflik berisiko mengikis disiplin dan kepercayaan diri, namun menyerahkan wilayah tersebut akan menjadi pengakuan kegagalan publik."
  siam.11.a: "Kita harus mengurangi kerugian dan menarik diri."
  siam.11.b: "Kami tidak akan mengabaikan klaim kami!"
  siam.12.t: "[FROM.GetName] Menerima Kekalahan"
  siam.12.desc: "Kampanye kami telah berhasil. Perlawanan musuh telah runtuh, dan [FROM.GetName] telah secara resmi melepaskan kendali atas tanah yang disengketakan untuk menghindari kehancuran lebih lanjut. Kemenangan ini meningkatkan kedudukan kita dan mengamankan perbatasan kita—untuk saat ini."
  siam.12.a: "Kekuatan kami tidak dapat disangkal."
  siam.13.t: "[FROM.GetName] Menolak Penyelesaian Apa Pun"
  siam.13.desc: "[FROM.GetName] telah menolak semua proposal yang melibatkan konsesi teritorial, dan mencapnya sebagai hal yang tidak dapat diterima. Kepemimpinan mereka telah menyatakan bahwa hanya kehancuran negara kita yang akan mengakhiri konflik ini."
  siam.13.a: "Jadilah itu."
  siam.14.t: "[FROM.GetNameDefCap] Berkomitmen pada Perang Total"
  siam.14.desc: "[FROM.GetNameDefCap] telah mengabaikan kepura-puraan negosiasi. Niat mereka jelas: penaklukan total dan penyerapan bangsa kita. Perang ini tidak akan ditentukan oleh perjanjian, namun oleh kemenangan total atau kehancuran total."
  siam.14.a: "Tidak ada kompromi, tidak ada penyerahan diri."
  siam.15.t: "[SIA.GetAdjective] Serangan Kios"
  siam.15.desc: "Serangan cepat yang dilakukan oleh pasukan [SIA.GetAdjective] mungkin membuat kita lengah, namun ketika gerak maju mereka semakin terhambat karena tekanan yang semakin besar, kelemahan mereka terlihat jelas. Apa yang dimaksudkan sebagai kampanye kilat telah menjadi cobaan berat bagi militer [SIA.GetAdjective]. Kita bisa memilih untuk bermurah hati dan menawarkan mereka jalan keluar melalui konsesi, namun keputusan ada di tangan kita apakah belas kasihan lebih bermanfaat bagi kepentingan kita daripada kemenangan total."
  siam.15.a: "Tawarkan Konsesi."
  siam.15.b: "Hanya kemenangan total yang bisa diterima."
  siam.16.t: "Serangan Terhenti"
  siam.16.desc: "Serangan kita terhenti, bukan itu masalahnya, masalahnya musuh kita mengetahuinya. Mereka telah mengirimkan ultimatum kepada kita, menyerah sekarang dengan kerugian minimal, atau melanjutkan perang dengan lebih banyak pertumpahan darah. Satu-satunya perbedaan adalah berapa banyak orang mati yang harus dikuburkan."
  siam.16.a: "Damai itu"
  siam.16.b: "Kami tidak akan pernah menyerah!"
  siam.17.t: "[FROM.GetName] menolak untuk menyerah"
  siam.17.desc: "[FROM.GetName] telah menyatakan dengan tegas bahwa mereka lebih memilih melihat seluruh negara mereka terbakar daripada menyerahkan satu bagian pun kepada kami. Perang berlanjut."
  siam.17.a: "Mereka akan mendapatkan keinginan mereka."
  siam.18.t: "[FROM.GetName] berusaha untuk menyerah pada kami!"
  siam.18.desc: "Komunikasi yang disadap dari komando tinggi musuh telah mengkonfirmasi ketakutan terbesar kami, tidak akan ada penyelesaian yang dinegosiasikan, tidak ada konsesi untuk mengakhiri perang ini. Mereka menuntut penyerahan total bangsa kita, dan mengutuk kita untuk hidup di bawah penindasan imperialis. Jika itu adalah tujuan mereka maka kita hanya punya satu jawaban, kita menolak untuk menyerah."
  siam.18.a: "[ROOT.GetNameDefCap] Berdiri!"
  siam.19.t: "[SIA.GetName] Menuntut Pengembalian Wilayah"
  siam.19.desc: "[SIA.GetName], yang didorong oleh tumbuhnya nasionalisme dan kurangnya kekuatan di kawasan, menuntut pengembalian wilayah yang mereka anggap sebagai inti negara mereka. Mereka jelas-jelas berusaha untuk melampaui kekuatan mereka, namun wilayah yang mereka klaim belum tentu layak untuk diperjuangkan mengingat situasi dunia sedang menuju Armageddon."
  siam.19.a: "Itu tidak layak untuk diperjuangkan"
  siam.19.b: "Gila!"
  siam.20.t: "[FROM.GetName] Penyerahan Wilayah"
  siam.20.desc: "[FROM.GetName] telah memutuskan untuk menyerahkan kembali wilayah kami, apakah mereka mengakui kedaulatan kami atas wilayah tersebut atau hanya karena tekanan dari pihak lain tidak relevan, tujuan kami tetap adil."
  siam.20.a: "Hari yang Menyenangkan!"
  siam.21.t: "[FROM.GetName] Menolak Menyerahkan Wilayah"
  siam.21.desc: "[FROM.GetName] telah menolak permintaan kami. Kaum imperialis ini berpegang teguh pada abad yang lalu dengan cakar dan rantai, tidak mampu mengakui pada diri mereka sendiri bahwa waktu yang telah berlalu bagi mereka yang disebut \"negara-negara besar\" telah habis."
  siam.21.a: "Kami akan menyadarkan mereka."
  SIA_sent_bureaucrats_to_us: "Pelatihan PNS bersama kami"
  SIA_tied_their_currency_to_ours: "Mematok mata uang mereka dengan mata uang kita"
  SIA_sent_started_cooperative_with_us: "Memulai pengembangan kerjasama dengan kami"
  siam.22.t: "Kirim [SIA.GetName] Birokrat ke Luar Negeri"
  siam.22.desc: "Para birokrat kita tidak cocok untuk menghadapi perekonomian modern, karena tidak memiliki pelatihan yang diperlukan untuk mendorong pertumbuhan. Untungnya ada banyak negara dengan birokrasi yang modern dan mapan, sehingga kita dapat mengirimkan mereka untuk mendapatkan pengalaman tanpa harus mengimpor peraturan mereka juga."
  siam.22.a: "Kirim ke [ENG.GetName]"
  siam.22.b: "Kirim ke [JAP.GetName]"
  siam.23.t: "Undang-Undang Stabilisasi Baht"
  siam.23.desc: "Baht tidak bisa lepas kendali sementara [ROOT.GetName] mengupayakan ketertiban dalam perdagangan dan keuangan. Para pejabat kami sekarang berpendapat bahwa stabilitas moneter memerlukan jangkar eksternal yang kuat, yang terikat pada mata uang yang memiliki bobot untuk meyakinkan para pedagang, kreditor, dan mitra asing. Pilihan yang ada di hadapan kita bukan semata-mata bersifat teknis. Hal ini akan membentuk arah perdagangan kita, karakter pembangunan kita dan pengaruh asing yang mempengaruhi perekonomian [SIA.GetAdjective]."
  siam.23.a: "Ikat ke Pound-Sterling"
  siam.23.b: "Ikat ke Yen"
  siam.24.t: "Koperasi Pembangunan [SIA.GetAdjective]"
  siam.24.desc: "Koperasi Pembangunan [SIA.GetAdjective] telah memberi negara instrumen baru untuk perbaikan nasional, namun ambisinya masih melebihi modal dalam negeri. Perkeretaapian, perbengkelan, dan pekerjaan kelistrikan membutuhkan pendanaan dari luar jika ingin meningkat dengan kecepatan berapa pun. Kini ada dua jalan yang terbentang di hadapan kita. Investasi [ENG.GetAdjective] menawarkan akses ke pasar yang sudah mapan, perusahaan berpengalaman, dan prestise finansial London. Investasi [JAP.GetAdjective] menjanjikan kemitraan industri yang lebih erat dengan kekuatan besar di Asia yang ingin memperluas pengaruhnya. Kedua hal tersebut dapat mempercepat pembangunan, namun tidak ada satupun yang terjadi tanpa adanya kewajiban."
  siam.24.a: "Carilah investasi dari [ENG.GetName]"
  siam.24.b: "Carilah investasi dari [JAP.GetName]"
  siam.25.t: "Kematian Prajadhipok"
  siam.25.desc: "Raja Prajadhipok sudah mati. Mantan Raja, yang namanya membawa kenangan akan tatanan lama selama bertahun-tahun dalam pengasingan dan pergolakan, kini beralih dari urusan manusia ke dalam sejarah. Bagi sebagian orang, kematiannya menutup babak terakhir perjuangan yang dimulai dengan berakhirnya pemerintahan absolut. Namun tujuan yang ia wujudkan tidak hilang bersamanya. Tahta bertahan, dinasti tetap ada dan pekerjaan memulihkan martabat dan stabilitas [ROOT.GetName] kini harus dilanjutkan atas nama Raja muda Ananda."
  siam.25.a: "Semoga Yang Mulia naik ke surga."
  siam.27.t: "Untuk Menempa Seorang Raja"
  siam.27.desc: "Raja Ananda tetap berada di [SWI.GetName], jauh dari kerajaan dimana dia akan memerintah suatu hari nanti. Namun, jarak tidak menempatkannya di luar pengaruh kita. Guru dapat dipilih, mata pelajaran ditekankan dan kebiasaan didorong, sehingga pikirannya terbentuk menuju masa depan yang kita cita-citakan [ROOT.GetNameDef]. Apakah dia kembali sebagai tentara, sarjana, atau sesuatu yang lebih, sebagian besar bergantung pada apa yang harus dia pelajari sekarang.\n\nUntuk apa sebenarnya Raja itu, jika bukan perluasan negara?"
  siam.27.a: "Bimbing dia menuju pencarian ilmiah."
  siam.27.b: "Instruksikan dia dalam urusan militer."
  siam.27.c: "Arahkan dia ke administrasi dan pasokan."
  siam.27.d: "Didik dia dalam industri dan pembangunan."
  siam.28.t: "Penobatan Raja Ananda"
  siam.28.desc: "Tahun-tahun yang panjang dalam pemerintahan sekarang hampir berakhir. Di Bangkok, di hadapan para pangeran, biksu, menteri, dan pejabat negara, Ananda naik takhta atas haknya sendiri dan menerima penghormatan yang pantas diberikan kepada raja Chakri. Upacara-upacara tersebut memberitakan kesinambungan ketika terjadi pergolakan dan ketertiban suci ketika terjadi perselisihan. Bagi kerajaan, penobatan ini bukan hanya sebuah kontes tetapi sebuah deklarasi bahwa Mahkota bertahan, bahwa wilayah kekuasaannya tidak dirusak oleh pengasingan dan konflik sipil dan bahwa pemerintahan baru kini dimulai pada [ROOT.GetNameDef]."
  siam.28.a: "Hidup Raja."
  siam.29.t: "Studi Tangki Konvensional"
  siam.29.desc: "Tank konvensional masih menjadi raja di medan perang, jadi kita harus belajar dari yang terbaik untuk menciptakan korps tank yang kuat."
  siam.29.a: "Kami akan belajar dari Jerman"
  siam.29.b: "Kami akan belajar dari Amerika"
  siam.29.c: "Kami akan belajar dari Inggris"
  siam.31.t: "Pengadaan Kapal Selam"
  siam.31.desc: "Perluasan angkatan laut memerlukan persenjataan kapal selam, dan kita harus memutuskan di mana sumber kapal kita. Baik [ENG.GetNameDef] maupun [JAP.GetNameDef] telah mengajukan penawaran — namun pilihan tersebut membawa implikasi di luar galangan kapal."
  siam.31.a: "Perahu [ENG.GetAdjective] akan melayani kita dengan baik."
  siam.31.b: "Kami akan membangun lengan kapal selam kami dengan desain [JAP.GetAdjective]."
  siam.32.t: "Pengadaan Kapal Pertahanan Pesisir"
  siam.32.desc: "Perairan pesisir kita memerlukan kapal pertahanan yang mumpuni, dan kita harus memilih pemasok kita. [ENG.GetNameDefCap] dan [JAP.GetNameDef] keduanya siap melaksanakannya — keputusan ini akan menentukan armada kita dan hubungan luar negeri kita."
  siam.32.a: "Kami akan mengandalkan kapal [ENG.GetAdjective] untuk pertahanan pesisir kami."
  siam.32.b: "Kami akan mengandalkan kapal [JAP.GetAdjective] untuk armada pesisir kami."
  siam.33.t: "Penjualan Bangkok Dock Co."
  siam.33.desc: "Penjualan Perusahaan Dermaga Bangkok telah selesai, dan hasilnya sekarang disimpan di kas. Pemerintah harus memutuskan ke mana dana tersebut sebaiknya diarahkan – apakah untuk meringankan beban keuangan masyarakat, untuk mempercepat ambisi teknis negara, atau untuk meningkatkan kepercayaan terhadap masa depan negara."
  siam.33.a: "Mengurangi beban pajak pada rakyat kita."
  siam.33.b: "Arahkan dana tersebut untuk penelitian angkatan laut."
  siam.33.c: "Gunakan rejeki nomplok untuk meyakinkan bangsa."
  siam.34.t: "[FROM.GetAdjective] Permintaan di Negara Kita"
  siam.34.desc: "Pasukan [FROM.GetAdjective] kini menekan [ROOT.GetNameDef], dan para diplomat mereka berbicara dengan penuh percaya diri seperti orang-orang yang percaya bahwa masalah tersebut sudah selesai. Mereka menawarkan kepada kita bahasa ketertiban dan stabilitas yang lazim, namun yang sebenarnya mereka cari adalah kepatuhan. Kita mungkin akan tunduk dan mempertahankan negara dalam bentuk yang lebih kecil, bergabung dengan faksi mereka dengan harapan dapat mempertahankan kebebasan bertindak, atau menjawab tekanan ini dengan perlawanan terbuka dan mengusir penjajah dari wilayah kita."
  siam.34.a: "Kami akan bergabung dengan faksi mereka dan mempertahankan kekuasaan kami."
  siam.34.b: "Suruh mereka keluar dari pantai kita."
  siam.35.t: "[JAP.GetNameDefCap] Menuntut Kami Mencetak Lebih Banyak Uang"
  siam.35.desc: "[JAP.GetNameDefCap] telah memperjelas ekspektasinya: kita harus meningkatkan jumlah uang beredar untuk memenuhi permintaan ekonomi mereka. Beban akan ditanggung rakyat kita sendiri melalui kenaikan harga, sementara industri [JAP.GetAdjective] akan merasakan manfaatnya. Kita mempunyai sedikit ruang untuk menolak."
  siam.35.a: "Mematuhi tuntutan [JAP.GetNameDef]."
  siam.36.t: "[SIA.GetNameDefCap] Menuntut Pelunasan Hutang"
  siam.36.desc: "[SIA.GetNameDefCap] telah secara resmi meminta kami membayar kembali biaya yang timbul akibat pengaturan pencetakan uang yang kami paksakan untuk mereka lakukan. Pengaturan ini sangat membantu kami, namun tagihannya kini telah jatuh tempo."
  siam.36.a: "Hormati hutangnya dan mulailah pembayarannya."
  siam.37.t: "[JAP.GetNameDefCap] Setuju untuk Membayar Hutang Kami"
  siam.37.desc: "Setelah tuntutan kami, [JAP.GetNameDef] telah setuju untuk mulai membayar kembali biaya ekonomi dari pengaturan pencetakan uang. Kompensasi tersebut tidak akan sepenuhnya menghilangkan beban yang ditanggung masyarakat kami, namun akan memberikan sedikit keringanan pada keuangan negara."
  siam.37.a: "Penyelesaian yang adil. Perekonomian kita akan pulih."
  siam.38.t: "[SIA.GetName] Mencari Syarat"
  siam.38.desc: "Pemerintah [SIA.GetAdjective] telah datang ke hadapan kami dengan mengajukan banding untuk persyaratan tersebut. Menteri-menterinya sekarang mengakui apa yang telah ditunjukkan oleh senjata kita, bahwa [ROOT.GetNameDef] yang mengambil inisiatif dalam perjuangan ini. Kita mungkin menerima penyerahan mereka dan membuat mereka patuh, mengikat mereka ke dalam faksi kita sehingga pemerintahan mereka dapat mendukung tujuan kita yang lebih luas, atau menolak semua kompromi dan melanjutkan kampanye sampai Siam sepenuhnya dikuasai."
  siam.38.a: "Terima penyerahan mereka."
  siam.38.b: "Tidak. Kami akan menyelesaikan ini dengan paksa."
  siam.39.t: "Pemerintah [FROM.GetAdjective] Menerima Penyerahan Kami"
  siam.39.desc: "[FROM.GetLeader] telah memilih untuk menerima kiriman kami. Untuk saat ini, [ROOT.GetNameDef] terhindar dari kehancuran lebih lanjut, meski bukan penghinaan. Tentara diperintahkan untuk mundur dan pemerintah tetap berkuasa hanya jika kekuatan yang lebih kuat menderita. Kita melestarikan negara, namun mengorbankan harga diri dan kebebasan bertindak."
  siam.39.a: "Kami menanggung apa yang harus kami lakukan."
  siam.40.t: "Pemerintah [FROM.GetAdjective] Menolak Tawaran Kami"
  siam.40.desc: "[FROM.GetLeader] telah menolak setiap tawaran yang dikirim dari Bangkok. Tidak ada penyerahan yang dinilai cukup dan tidak ada kompromi yang dapat diterima. Musuh bermaksud untuk menyelesaikan masalah ini hanya melalui penaklukan total. Sekarang tidak ada yang tersisa untuk [ROOT.GetNameDef] selain perlawanan. Jika mereka tidak mau meninggalkan negara kita dengan persetujuan, mereka harus diusir dengan kekerasan."
  siam.40.a: "Lalu kita bertarung."
  siam.41.t: "[FROM.GetNameDefCap] Mengirim Pejabat untuk Mempelajari Metode Kami"
  siam.41.desc: "Delegasi pejabat [FROM.GetAdjective] telah tiba untuk mengamati dan mempelajari praktik administrasi dan penelitian kami. [FROM.GetNameDefCap] tampaknya berniat memodernisasi birokrasinya dengan memanfaatkan keahlian asing, dan telah memilih [ROOT.GetNameDef] sebagai modelnya. Kunjungan ini merupakan pengakuan tersirat atas metode yang kami gunakan, dan merupakan peluang untuk membangun niat baik dengan pemerintah lain."
  siam.41.a: "Kami menyambut delegasi mereka."
  siam.42.t: "[FROM.GetNameDefCap] Mematok Mata Uangnya ke Mata Uang Kita"
  siam.42.desc: "[FROM.GetNameDefCap] telah secara resmi memilih untuk mengaitkan mata uangnya dengan mata uang kita. Keputusan ini mendekatkan [FROM.GetNameDef] ke dalam orbit ekonomi kita dan menandakan tingkat kepercayaan terhadap stabilitas lembaga keuangan kita. Perdagangan antar negara harus lebih dapat diprediksi, dan pedagang [FROM.GetAdjective] akan lebih mudah berbisnis dengan negara kita."
  siam.42.a: "Perkembangan yang disambut baik untuk hubungan dagang kita."
  siam.43.t: "[FROM.GetNameDefCap] Meminta Investasi Pembangunan"
  siam.43.desc: "[FROM.GetNameDefCap] telah menyampaikan undangan kepada para insinyur dan spesialis kami untuk membantu pembangunan bangsanya. Koperasi ini menawarkan industri kita pijakan di kawasan ini dan memperkuat hubungan ekonomi antara pemerintah kita. Ini adalah usulan yang sederhana, namun dapat memberikan hasil yang besar seiring berjalannya waktu."
  siam.43.a: "Kami dengan senang hati membantu."
  siam.44.t: "[FROM.GetNameDefCap] Melakukan Pemesanan Kapal Selam"
  siam.44.desc: "[FROM.GetNameDefCap] telah memesan kapal selam yang dibuat sesuai desain kami. Penjualan ini merupakan bentuk kepercayaan yang berarti terhadap industri angkatan laut kita dan memperluas pengaruh [FROM.GetAdjective] ke perairan Asia Tenggara."
  siam.44.a: "Pesanan selamat datang untuk galangan kapal kami."
  SIA_purchased_submarines_from_us: "Membeli kapal selam dari kami"
  siam.45.t: "[FROM.GetNameDefCap] Mengusulkan Penggabungan Aliansi"
  siam.45.desc: "Delegasi dari [FROM.GetName] telah tiba dengan membawa proposal dari [FROM.GetLeader]. Mereka berargumentasi bahwa aliansi-aliansi kita yang terpisah sekarang mempunyai tujuan yang sama dan membagi kekuatan manusia, material dan pengaruh diplomatik di antara komando-komando yang bersaing.\n\nDengan menggabungkan kekuatan kita dengan mereka, kita akan menciptakan sebuah blok yang lebih kuat yang mampu mengkoordinasikan strategi di bidang yang lebih luas. Perjanjian seperti itu akan memperkuat tujuan bersama, meskipun hal ini juga mengharuskan kita untuk menerima pengaruh [FROM.GetAdjective] terhadap arah masa depan aliansi."
  siam.45.a: "Front persatuan diperlukan."
  siam.45.b: "Aliansi kita tetap menjadi milik kita sendiri."
  siam.46.t: "[FROM.GetNameDefCap] Menerima Penggabungan"
  siam.46.desc: "[FROM.GetLeader] telah menerima proposal kami untuk menggabungkan aliansi kami menjadi satu koalisi. Apa yang dulunya merupakan jalur komando dan saluran diplomatik yang terpisah, kini digabung menjadi satu struktur, sehingga memungkinkan pemerintah kita untuk mengoordinasikan rencana perang, pengaturan pasokan, dan kebijakan luar negeri dengan lebih jelas.\n\nPengaturan ini bukannya tanpa komplikasi, namun perlunya persatuan telah diutamakan."
  siam.46.a: "Bersama-sama, kita berdiri lebih kuat."
  siam.47.t: "[FROM.GetNameDefCap] Menolak Penggabungan"
  siam.47.desc: "[FROM.GetLeader] telah menolak proposal kami untuk menggabungkan aliansi kami. Pemerintah mereka mengklaim bahwa kerja sama dapat berlanjut jika ada kepentingan yang selaras, namun mereka tidak akan menempatkan aliansi mereka dalam koalisi yang lebih luas yang dipimpin dari [ROOT.Capital.GetCapitalVictoryPointName].\n\nUntuk saat ini, perpecahan antar blok masih tetap ada. Kita harus mengejar tujuan kita tanpa mengambil komitmen penuh dari tujuan tersebut."
  siam.47.a: "Lalu kita lanjutkan sendiri."
  siam.48.t: "[SIA.GetName] Meminta [JAP.GetAdjective] Bantuan"
  siam.48.desc: "[SIA.GetNameDefCap] telah secara resmi meminta bantuan militer melawan pasukan yang menyerang negara mereka. Sebagai imbalannya, pemerintah [SIA.GetAdjective] siap memberikan perusahaan [JAP.GetAdjective] akses istimewa terhadap sumber daya strategis, infrastruktur, dan hak komersial.\n\nMendukung [SIA.GetName] akan memperluas pengaruh kami di Asia Tenggara dan mengamankan material berharga bagi Kekaisaran, meskipun hal ini juga dapat melibatkan kami lebih dalam dalam konflik regional."
  siam.48.a: "Terima lamaran mereka."
  siam.48.b: "[JAP.GetName] tidak dapat menyisihkan sumber daya."
  siam.49.t: "[JAP.GetName] Menerima Banding Kami"
  siam.49.desc: "[JAP.GetNameDefCap] telah setuju untuk mendukung [ROOT.GetNameDef] dalam perjuangannya. [JAP.GetAdjective] penasihat, perlengkapan dan perbekalan akan segera mulai berdatangan, sementara konsesi ekonomi telah diberikan kepada [JAP.GetAdjective] perusahaan sesuai dengan perjanjian.\n\nMeskipun kabinet merayakan kelangsungan hidup bangsa, banyak yang diam-diam bertanya-tanya berapa banyak kemerdekaan yang telah ditukar dengan bantuan ini."
  siam.49.a: "Kami telah mendapatkan sekutu."
  SIA_japan_aid_request.4.t: "[JAP.GetName] Menolak Banding Kami"
  SIA_japan_aid_request.4.desc: "Pemerintah [JAP.GetNameDef] telah menolak permintaan bantuan militer kami. Tokyo mengklaim bahwa Kekaisaran tidak dapat mengerahkan tenaga dan material untuk perjuangan kita saat ini.\n\nTanpa bantuan asing, [ROOT.GetNameDef] kini harus mengandalkan kekuatannya sendiri untuk bertahan dari invasi."
  SIA_japan_aid_request.4.a: "Lalu kita berdiri sendiri."
  siam_adc.1.t: "[FROM.GetNameDefCap] Menuntut Pembebasan [?var:SIA_adc_demand_country_to_be_released.GetNameDef]"
  siam_adc.1.desc: "Sebuah catatan resmi telah tiba dari [FROM.GetNameDef], di mana [FROM.GetLeader] mengutuk pendudukan kami yang terus berlanjut di negara-negara Asia sebagai penghinaan yang tidak dapat ditoleransi terhadap hak mereka untuk menentukan nasib sendiri. Pesan tersebut menyatakan bahwa Asia bukanlah sebuah hadiah yang dapat dibagi-bagi atau diatur demi kesenangan asing, dan menuntut agar kita segera menarik pasukan kita dan memulihkan pemerintahan independen di [?var:SIA_adc_demand_country_to_be_released.GetNameDef].\n\nTuntutan tersebut tidak memberikan ruang untuk kesalahpahaman. [FROM.GetNameDefCap] mengharapkan kepatuhan, dan setiap penolakan dari pihak kita harus diingat sebagai penghinaan yang disengaja terhadap bangsa mereka."
  siam_adc.1.a: "Kami akan membebaskan mereka."
  siam_adc.1.b: "Mereka akan tetap berada di bawah pendudukan."
  siam_adc.2.t: "[FROM.GetNameDefCap] Tawaran untuk Mengembalikan Kemerdekaan Kita"
  siam_adc.2.desc: "Setelah [FROM.GetAdjective] menerima tuntutan [SIA.GetNameDef] mengenai masa depan [ROOT.GetNameDef], [FROM.GetLeader] kini mengajukan pertanyaan terakhir kepada kita. Otoritas pendudukan siap untuk menarik diri dan mengakui pemerintahan [ROOT.GetAdjective] yang berdaulat, jika kita memilih untuk berdiri sendiri sekali lagi.\n\nKemerdekaan menawarkan martabat dan kebebasan bertindak, namun hal ini juga membuat kita harus membangun kembali negara tanpa jaminan [FROM.GetNameDef]. Tetap berada di bawah perlindungan mereka adalah tindakan yang lebih sederhana, namun dapat menghindarkan negara dari kekacauan lebih lanjut di masa yang tidak menentu ini."
  siam_adc.2.a: "Kami akan berdiri sebagai bangsa yang bebas."
  siam_adc.2.b: "Kami akan tetap berada di bawah perlindungan [FROM.GetAdjective]."
  siam_adc.3.t: "[?var:SIA_tag_that_was_released_due_to_sia_pressure.GetName] Menerima Kemerdekaan"
  siam_adc.3.desc: "Pemerintah [?var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] telah memilih kemerdekaan. Dengan berakhirnya pemerintahan pendudukan, [var:SIA_tag_that_was_released_due_to_sia_pressure.GetNameDef] bersiap untuk melanjutkan posisinya di antara negara-negara berdaulat di dunia."
  siam_adc.3.a: "Bagaimana masa depan mereka?"
  siam_air.1.t: "Tokyo Mengirim Instruktur"
  siam_air.1.desc: "Misi teknis Jepang telah tiba dengan instruktur, manual, dan tawaran pesawat. Para penerbang kita harus memutuskan di mana bantuan mereka akan memberikan manfaat yang paling besar."
  siam_air.1.a: "Instruksi petarung"
  siam_air.1.b: "Instruksi serangan"
  siam_air.1.c: "Paket yang hati-hati dan netral"
  siam_air.2.t: "Seberapa Jauh Mendorong Penerbang"
  siam_air.2.desc: "Penerbangan di hutan tidak bisa dimaafkan, dan pilot ramah lingkungan harus membayarnya dengan pesawat yang rusak. Apakah kita akan terus maju dan membiarkan mereka yang selamat menjadi veteran, atau membiarkan mereka yang tidak berpengalaman sampai kondisinya membaik?"
  siam_air.2.a: "Terima kerugiannya"
  siam_air.2.b: "Menghentikan pilot hijau"
  siam_adc.4.t: "[FROM.GetNameDefCap] Menurunnya Kemerdekaan"
  siam_adc.4.desc: "Meskipun ada peluang untuk memperoleh kebebasan, pemerintahan [FROM.GetNameDef] telah menolak kemerdekaan. Para menteri berpendapat bahwa negara belum siap menanggung beban kedaulatan penuh dan, untuk saat ini, lebih memilih untuk mempertahankan status quo."
  siam_adc.4.a: "Kemudian pengaturannya berlanjut."
  siam_adc.5.t: "[FROM.GetNameDefCap] Menolak Tuntutan kami"
  siam_adc.5.desc: "[FROM.GetName] telah memperjelas bahwa tuntutan kami sangat menggelikan. Mereka menunjuk pada kurangnya kekuatan militer kita sebagai bukti bahwa kita tidak berada dalam posisi untuk menentang status quo."
  siam_adc.5.a: "Lalu kami akan menunjukkannya kepada mereka."
  siam_dem_event_count: "Militer sedang merencanakan kampanye untuk mencoreng, kita tunggu saja"
  siam_dem.2.t: "Objek Angkatan Darat"
  siam_dem.2.desc: "Pada pertemuan pribadi para menteri dan perwira senior, seorang perwakilan militer menyampaikan kritik keras terhadap usulan Berkas Kuning. Ia berpendapat bahwa para penulisnya terlalu bebas berbicara mengenai arah negara, redistribusi dan kewajiban sosial, namun kurang memperhatikan disiplin, harta benda dan beban yang akan ditanggung oleh korps perwira dan pedesaan. Dalam pandangannya, [ROOT.GetNameDef] tidak dapat dibuat ulang melalui teori-teori yang disusun di atas kertas sementara dunia semakin berbahaya dari waktu ke waktu."
  siam_dem.2.a: "Tentara telah menyatakan kasusnya"
  siam_dem.3.t: "Teguran Umum"
  siam_dem.3.desc: "Perselisihan telah meninggalkan ruang panitia. Sebuah surat kabar yang secara luas dianggap sebagai perwakilan militer telah mencetak kecaman penuh terhadap Berkas Kuning, menampilkannya sebagai program asing yang dikemas dalam bahasa patriotik. Para editornya memperingatkan bahwa usulan tersebut menempatkan keluhan kelas di atas persatuan nasional, melemahkan kepercayaan terhadap lembaga-lembaga yang sudah mapan dan mendorong ekspektasi berbahaya di kalangan pekerja dan petani. Pada sore hari, artikel tersebut diulang-ulang di barak, kantor, dan kedai teh, dan apa yang tadinya menjadi perdebatan internal kini menjadi kontroversi publik."
  siam_dem.3.a: "Kritik menyebar"
  siam_dem.4.t: "Phibun Mengecam Berkas itu"
  siam_dem.4.desc: "Phibun telah memasuki pertengkaran secara terbuka dan dengan kekuatan yang tidak salah lagi. Berbicara di hadapan para pendukung dan pejabat, ia mengecam Berkas Kuning yang pada dasarnya bersifat komunis, apa pun bahasa yang disukai para pembelanya. Ia menyatakan bahwa program apa pun yang meninggikan negara di atas properti, menjanjikan transformasi sosial secara menyeluruh, dan memicu agitasi di kalangan kelas bawah membawa racun merah ke dalam [ROOT.GetNameDef] dengan nama lain."
  siam_dem.4.a: "Dia tidak meninggalkan keraguan"
  siam_dem.5.t: "Suatu Pemerintahan Harus Dibentuk"
  siam_dem.5.desc: "Rezim lama telah hancur dan Seri Thai menang. Namun kemenangan bukanlah kemenangan pemerintah, dan koalisi yang bersatu melawan Phibun masih belum sepakat mengenai apa yang akan terjadi setelahnya. Tiga nama terucap dalam koridor kekuasaan: Pridi Banomyong, hati nurani perlawanan; Khuang Aphaiwong, seorang pria yang cukup lembut dan tidak menyinggung siapa pun; dan Jenderal Phin Choonhavan, yang para perwiranya mengharapkan imbalannya. Siapa yang kita bangkitkan sekarang akan membentuk perdamaian di masa depan."
  siam_dem.5.a: "Pridi Banomyong akan memimpin. Perlawanan telah membuahkan hasil."
  siam_dem.5.b: "Khuang Aphaiwong, wajah yang bisa diterima semua faksi."
  siam_dem.5.c: "Jenderal Phin Choonhavan. Tentara akan mendapat tempatnya."
  ###################
  #### AUSTRALIA ####
  ###################
  AST_election_events.1.t.a: "UAP Menang!"
  AST_election_events.1.t.b: "Buruh Menang!"
  AST_election_events.1.desc.a: "Suara dihitung; Partai Persatuan Australia telah memenangkan pemilu.\n\nUAP akan menjalani masa pembentukan pemerintahan yang singkat, sebelum menghabiskan tiga tahun berikutnya untuk membuktikan bahwa kepercayaan warga negara berhak ditempatkan di pundak perwakilannya."
  AST_election_events.1.desc.b: "Suara dihitung; Partai Buruh Australia telah memenangkan pemilu.\n\nBuruh akan menjalani masa pembentukan pemerintahan yang singkat, sebelum menghabiskan tiga tahun berikutnya untuk membuktikan bahwa kepercayaan warga negara memang benar berada di pundak para wakilnya."
  AST_election_events.1.a: "Masyarakat sudah angkat bicara."
  AST_election_events.2.t: "Setengah jalan menuju Pemilihan Federal"
  AST_election_events.2.desc: "$AST_democratic_party_long$ telah memimpin [AST.GetName] sejak tahun 1931, membimbing negara keluar dari Depresi Besar dan menjauh dari sentimen anti-demokrasi. Melalui kepemimpinan yang stabil, kecenderungan konservatif, dan kesetiaan kepada Inggris, UAP telah memperkuat dukungannya dan semakin mungkin untuk kembali menjabat. Namun ada pihak lain yang masih mempunyai suara dalam masalah ini.\n\nMasih dalam masa pemulihan dari mosi tidak percaya yang menggulingkannya dari kekuasaan pada tahun 1931, $AST_labor_party_long$ mulai mendapatkan kembali momentumnya. Dengan dibungkamnya suara-suara komunis, kelas pekerja kini mencari petunjuk lain. Dalam misinya untuk mewakili setiap warga negara, ALP telah mengadopsi perspektif berbeda mengenai imperialisme dan kesetiaan Australia kepada Kekaisaran. Kebutuhan dalam negeri harus didahulukan, dan kepentingan asing tidak lagi menjadi prioritas.\n\nMasih ada satu setengah tahun lagi hingga pemilihan federal berikutnya. Jika UAP ingin meraih kemenangan lagi, para pemimpinnya harus mempercepat reformasi untuk mempertahankan dukungan publik. Jika tidak, kampanye ALP mungkin akan mengembalikan posisinya kembali."
  AST_election_events.2.a: "UAP akan memberlakukan reformasi terakhirnya."
  AST_election_events.2.b: "Tur kampanye ke seluruh Australia akan menggalang dukungan bagi ALP."
  AST_election_events.3.t: "$AST_election_season_cat$"
  AST_election_events.3.desc: "$AST_election_season_cat_desc$"
  AST_election_events.3.a: "Itu dimulai."
  AST_diplomatic_events.1.t: "Pakta Non-Agresi Australia"
  AST_diplomatic_events.1.desc: "Sebagai bagian dari upaya diplomatiknya baru-baru ini, pemerintah Australia berupaya untuk menandatangani perjanjian non-agresi dengan beberapa negara terpilih di Asia; kita adalah salah satunya. Apakah upaya untuk menghindari perang ini memperlihatkan para pejabat Australia tidak peduli dengan kenyataan, atau jika hal ini menggambarkan mereka sebagai orang yang tidak bersalah, tanggapan kita sebagian akan menentukan.\n\nHaruskah kita menandatangani pakta non-agresi dengan [AST.GetName]?"
  AST_diplomatic_events.1.a: "Tanpa pertanyaan - tidak."
  AST_diplomatic_events.1.b: "Memang benar, kami akan melakukannya."
  AST_diplomatic_events.2.t: "Perlawanan Pakta Pasifik"
  AST_diplomatic_events.2.desc: "Delegasi yang dikirim ke [FROM.GetNameDef] telah menyampaikan tanggapan negara terhadap proposal pakta non-agresi kami. Kami tahu bahwa inisiatif ini memiliki jangkauan yang luas, sehingga penolakan [FROM.GetLeader] bukanlah hal yang mengejutkan."
  AST_diplomatic_events.2.a: "Setidaknya itu adalah upaya yang terhormat."
  AST_diplomatic_events.3.t: "Hidup Pakta Pasifik"
  AST_diplomatic_events.3.desc: "Delegasi yang dikirim ke [FROM.GetNameDef] telah menyampaikan tanggapan negara terhadap proposal pakta non-agresi kami. Yang paling menggembirakan, [FROM.GetLeader] menghargai inisiatif kami dan setuju untuk menandatanganinya."
  AST_diplomatic_events.3.a: "Luar biasa!"
  AST_diplomatic_events.4.t: "Australia Meminta Singapura"
  AST_diplomatic_events.4.desc: "[AST.GetNameDefCap] telah lama mempertanyakan keandalan Strategi Singapura; menurut para pejabat Australia, kemampuan kita untuk membantu mereka jika terjadi perang Pasifik masih belum pasti. Mengalihkan tanggung jawab angkatan laut Pasifik ke [AST.GetName] akan mengurangi beban di pundak Inggris, namun hal ini juga akan menempatkan beban yang sama ke pundak Australia.\n\nDapatkah kita percaya bahwa peningkatan kendali Australia akan menempatkan subyek dan wilayah Pasifik kita pada posisi yang lebih kuat dibandingkan jika Singapura tetap bersama kita?"
  AST_diplomatic_events.4.a: "Ya, kami bisa."
  AST_diplomatic_events.4.b: "Singapura akan tetap menjadi milik kita."
  AST_diplomatic_events.5.t: "Inggris Menyetujui Permintaan Kami"
  AST_diplomatic_events.5.desc: "Inggris setuju untuk menyerahkan Singapura kepada otoritas Australia. Hal ini pada akhirnya akan mengakhiri Strategi Singapura yang sudah ketinggalan zaman dan menempatkan kita pada kendali pertahanan kita sendiri."
  AST_diplomatic_events.5.a: "Strateginya ditulis ulang!"
  AST_diplomatic_events.5.a.tt: "§YSingapura§!:\nDikuasai oleh §YAustralia§!.\nDimiliki oleh §YAustralia§!.\n§YChristmas Island§!:\nDikuasakan oleh §YAustralia§!.\nDimiliki oleh §YAustralia§!.\n§YKepulauan Cocos§!:\nDikendalikan oleh §YAustralia§!.\nDimiliki oleh §YAustralia§!."
  AST_diplomatic_events.6.t: "Inggris Menolak Permintaan Kami"
  AST_diplomatic_events.6.desc: "Inggris menolak menyerahkan Singapura kepada otoritas Australia. Status quo akan tetap ada."
  AST_diplomatic_events.6.a: "Strategi Singapura harus dipertahankan."
  AST_diplomatic_events.7.t: "[AST.GetName] Meminta Bantuan Kami"
  AST_diplomatic_events.7.desc: "[AST.GetNameDefCap] ingin menerima peralatan dari sekutu untuk upaya perangnya, dan meminta bantuan kami dalam mengelola pengiriman yang diperlukan. Bisakah kita menyisihkan konvoi agar [AST.GetName] dapat memanfaatkannya?"
  AST_diplomatic_events.7.a: "Kita bisa."
  AST_diplomatic_events.7.b: "Kita tidak bisa"
  AST_diplomatic_events.8.t: "[USA.GetName] Menyetujui Permintaan Kami"
  AST_diplomatic_events.8.desc: "[USA.GetNameDefCap] telah setuju untuk menyisihkan sejumlah konvoi untuk membantu upaya pasokan [AST.GetName]."
  AST_diplomatic_events.8.a: "Mereka akan sangat berguna!"
  AST_diplomatic_events.9.t: "[USA.GetName] Menolak Permintaan Kami"
  AST_diplomatic_events.9.desc: "[USA.GetNameDefCap] tidak memiliki konvoi cadangan untuk upaya pasokan [AST.GetName]."
  AST_diplomatic_events.9.a: "Kita harus mengelola sendiri pengirimannya."
  AST_diplomatic_events.10.t: "Aliansi Masa Perang"
  AST_diplomatic_events.10.desc: "[AST.GetNameDefCap] sangat menghargai [USA.GetNameDef] sekutu dan sekarang meminta agar aliansi tersebut diformalkan dalam koalisi masa perang internasional bersama. Dengan menggabungkan kekuatan, kedua negara dapat saling membantu dalam konflik saat ini dan masa depan."
  AST_diplomatic_events.10.a: "Kita harus setuju."
  AST_diplomatic_events.10.b: "[USA.GetNameDefCap] akan berdiri lebih kuat tanpa mereka."
  AST_diplomatic_events.11.t: "Aliansi Masa Perang"
  AST_diplomatic_events.11.desc: "[USA.GetNameDefCap] telah setuju untuk bergabung. Sebagai anggota [AST.GetFactionName], [AST.GetName] dan [USA.GetName] akan saling membantu dalam konflik saat ini dan masa depan."
  AST_diplomatic_events.11.a: "Musuh kita akan takut pada kita."
  AST_diplomatic_events.12.t: "Aliansi Masa Perang yang Ditolak"
  AST_diplomatic_events.12.desc: "[USA.GetNameDefCap] telah menolak proposal kami untuk bergabung. [AST.GetNameDefCap] dan [USA.GetName] akan tetap terpecah dalam upaya perang kita masing-masing."
  AST_diplomatic_events.12.a: "Kita harus berdiri tanpa mereka."
  AST_diplomatic_events.13.t: "Klausul 6"
  AST_diplomatic_events.13.desc: "Selama proses menyatukan koloni-koloni Australia menjadi sebuah federasi, Selandia Baru akhirnya memutuskan untuk tidak ambil bagian. Namun sejak saat itu, Konstitusi Australia terus mendefinisikan kami sebagai salah satu negara bagian Persemakmuran yang potensial, dan mengizinkan kami untuk diterima.\n\n[AST.GetName] sekarang menyatakan bahwa situasi dunia saat ini menuntut persatuan, meminta agar [NZL.GetName] diserahkan kepada otoritas Australia. Haruskah kita mengadakan referendum mengenai masalah ini?"
  AST_diplomatic_events.13.a: "Kami akan melakukannya."
  AST_diplomatic_events.13.a.tt: "Referendum akan diadakan, yang berpotensi mengakibatkan §Raneksasi§! dari §Y[NZL.GetName]§!"
  AST_diplomatic_events.13.b: "Sama sekali tidak!"
  AST_diplomatic_events.14.t: "[NZL.GetNameDefCap] Menjadi Negara Bagian Australia"
  AST_diplomatic_events.14.desc: "Setelah referendum yang diadakan baru-baru ini, [NZL.GetNameDef] telah memutuskan untuk menggunakan Klausul 6 Konstitusi Australia. Warga Selandia Baru telah sepakat bahwa tanah mereka lebih aman di bawah pemerintahan Australia, dan oleh karena itu setuju untuk bergabung dengan [AST.GetNameDef]."
  AST_diplomatic_events.14.a: "Australia berkembang."
  AST_diplomatic_events.15.t: "Masyarakat Selandia Baru Menolak"
  AST_diplomatic_events.15.desc: "Setelah referendum yang diadakan baru-baru ini, [NZL.GetNameDef] telah memutuskan untuk tidak menggunakan Klausul 6 Konstitusi Australia. [NZL.GetNameDefCap] akan tetap menjadi bangsa sendiri."
  AST_diplomatic_events.15.a: "Australia akan tetap seperti sekarang."
  AST_diplomatic_events.16.t: "[NZL.GetNameDefCap] Pejabat Menolak"
  AST_diplomatic_events.16.desc: "Meskipun ada tekanan dari Australia, [NZL.GetNameDef] telah memutuskan untuk tidak mengadakan referendum untuk menerapkan Klausul 6 Konstitusi Australia. [NZL.GetNameDefCap] akan tetap menjadi bangsa sendiri."
  AST_diplomatic_events.16.a: "Australia tetap seperti sekarang."
  AST_diplomatic_events.17.t: "Kemitraan Australia"
  AST_diplomatic_events.17.desc: "Musuh datang dari utara, dan hanya masalah waktu sebelum musuh tiba di depan pintu kita, atau setidaknya begitulah klaim para pejabat Australia. [AST.GetNameDefCap] mengusulkan agar kita bersatu untuk membentuk satu penghalang, sebaiknya dengan menempatkan [INS.GetName] di bawah otoritas Australia, namun paling tidak dengan memberikan akses militer."
  AST_diplomatic_events.17.a: "Setuju untuk ditempatkan di bawah otoritas Australia."
  AST_diplomatic_events.17.a.tt: "§Y[INS.GetNameDefCap]§! akan menjadi §Yboneka§! dari §Y[AST.GetNameDefCap]§!."
  AST_diplomatic_events.17.b: "Berikan akses militer."
  AST_diplomatic_events.17.b.tt: "§Y[INS.GetNameDefCap]§! akan memberlakukan §YAkses Militer§! dengan §Y[AST.GetNameDefCap]§!."
  AST_diplomatic_events.17.c: "Kami tidak akan menyetujui keduanya."
  AST_diplomatic_events.18.t: "[INS.GetNameDefCap] Menyetujui Permintaan Australia"
  AST_diplomatic_events.18.desc: "[INS.GetName] telah menyetujui permintaan kami; Kerja sama kita akan berdampak besar pada kemampuan pertahanan kedua negara."
  AST_diplomatic_events.18.a: "Fantastis!"
  AST_diplomatic_events.19.t: "[INS.GetNameDefCap] Menolak"
  AST_diplomatic_events.19.desc: "[INS.GetName] telah menolak permintaan kami; negara kita harus menjaga pertahanannya sendiri."
  AST_diplomatic_events.19.a: "[AST.GetNameDefCap] akan mengatasi konflik tanpa mereka."
  AST_diplomatic_events.20.t: "Panggilan ke Kabinet Perang Inggris"
  AST_diplomatic_events.20.desc: "[GET_AST_BWC_COUNT][ENG.GetNameDefCap] memanggil Perdana Menteri Australia ke Kabinet Perang Inggris. Situasi dunia yang mengerikan, mendorong Inggris untuk mencari strategi bersama dan kerja sama militer dengan sekutunya.\n\nNamun, Australia memiliki kekhawatirannya sendiri. Bisakah kita meluangkan waktu Perdana Menteri untuk menyenangkan Inggris?"
  AST_diplomatic_events.20.a: "[AST.GetLeader] akan berangkat ke Inggris."
  AST_diplomatic_events.20.b: "Dia dibutuhkan di sini."
  AST_bwc_count_2: "Untuk kedua kalinya, [ENG.GetLeader] meminta kehadiran [AST.GetLeader], menyatakan bahwa kerja sama erat kita akan menentukan hasil perjuangan kita bersama."
  AST_bwc_count_3: "Sekali lagi, [AST.GetLeader] diminta menyeberangi lautan untuk menjaga kerja sama Persemakmuran. Akan tetapi, permintaan-permintaan seperti itu tidak diharapkan akan lebih banyak lagi, asalkan kita memperjelas apakah kepentingan kita juga terletak pada upaya bersama atau dalam mengurus urusan kita sendiri."
  AST_bwc_accept_effect_tt: "§YEfek dengan menerima panggilan 3 kali:§!"
  AST_bwc_accept_tt: "Menerima panggilan sebanyak §Y[?var:AST_bwc_accept]§!/§Y3§! kali"
  AST_diplomatic_events.22.t: "Kontribusi Sukses untuk Kabinet Perang Inggris"
  AST_diplomatic_events.22.desc: "Selama setahun terakhir, Perdana Menteri Australia rutin menghadiri Kabinet Perang Inggris. Meskipun [AST.GetNameDef] sendiri harus menanggung akibatnya, negara kita kini telah tumbuh lebih kuat melalui kerja sama militer Inggris."
  AST_diplomatic_events.22.a: "Pada akhirnya biaya yang dikeluarkan tidak sia-sia."
  AST_diplomatic_events.23.t: "[ENG.GetLeader] Tidak Lagi Mencari Pengaruh Perang Australia"
  AST_diplomatic_events.23.desc: "[ENG.GetNameDefCap] telah memanggil Perdana Menteri Australia ke Kabinet Perang Inggris beberapa kali, tetapi setelah penolakan berulang kali [ENG.GetLeader] tidak lagi melihat alasan untuk terus melakukannya."
  AST_diplomatic_events.23.a: "Hal ini dapat dimengerti."
  AST_diplomatic_events.24.t: "Perubahan Kepemimpinan"
  AST_diplomatic_events.24.desc: "Perdana Menteri Australia mempunyai pengaruh besar dalam upaya perang Persemakmuran Inggris. Selama kunjungan rutinnya ke London, Robert Menzies telah mendapatkan kepercayaan dari para menteri Inggris sementara kepercayaan mereka terhadap Perdana Menteri mereka sendiri telah memudar. Para menteri kini telah menekan pemimpin [ENG.GetNameDef] untuk mengundurkan diri, dan agar Menzies menggantikannya.\n\nBahkan jika [AST.GetName] kehilangan Perdana Menterinya, mereka mendapatkan kesetiaan abadi dari penguasa mereka, yang dijaga oleh rekan senegaranya dari Australia yang sekarang berada di kendali Inggris. Negara di bawahnya menginginkan otoritas yang lebih besar, dan Robert Menzies adalah orang pertama yang mencantumkan namanya pada otoritas tersebut."
  AST_diplomatic_events.24.a: "Angin sedang berubah."
  AST_diplomatic_events.25.t: "Di Bawah Pemerintahan Canberra"
  AST_diplomatic_events.25.desc: "Meningkatnya ketegangan di antara negara-negara Pasifik sangatlah mengkhawatirkan, dan dengan Inggris yang terlibat dalam konflik yang terjadi di wilayah tersebut, kemampuan kita untuk menyelamatkan rakyat kita tampaknya tidak masuk akal; atau begitulah klaim [AST.GetName].\n\nMereka berupaya merekonstruksi Persemakmuran Inggris sehingga negara-negara di Samudera Pasifik dan Hindia dikelola langsung dari Canberra. Akankah kita setuju?"
  AST_diplomatic_events.25.a: "Kami akan; kawasan Pasifik akan diperkuat di bawah kendali terpusat."
  AST_diplomatic_events.25.b: "Tentu saja tidak!"
  AST_diplomatic_events.26.t: "Persemakmuran Pasifik"
  AST_diplomatic_events.26.desc: "[ENG.GetNameDefCap] setuju; kawasan Pasifik akan diperkuat di bawah kendali terpusat. Wilayah Britania di Pasifik telah ditempatkan di bawah kekuasaan kami."
  AST_diplomatic_events.26.a: "Negara-negara Pasifik bergabung."
  AST_diplomatic_events.27.t: "Inggris Menolak Permintaan Kami"
  AST_diplomatic_events.27.desc: "[ENG.GetNameDefCap] tidak setuju; kawasan Pasifik tidak akan diperkuat di bawah kendali terpusat. Wilayah Pasifik akan tetap menjadi wilayah kekuasaan Inggris kami."
  AST_diplomatic_events.27.a: "Namun demikian, Australia akan bertahan."
  AST_diplomatic_events.28.t: "[ENG.GetLeader] Menutup Telepon"
  AST_diplomatic_events.28.desc: "Perselisihan kabel antara Perdana Menteri dengan [ENG.GetLeader] hanya memberikan sedikit dukungan bagi Australia, namun menambah kebencian Inggris terhadap [AST.GetLeader] karena menekan kepentingan Australia."
  AST_diplomatic_events.28.a: "Australia harus menjaga pertahanannya sendiri."
  AST_diplomatic_events.29.t: "Inggris untuk Membantu Kami"
  AST_diplomatic_events.29.desc: "Menyusul tekanan Australia terhadap [ENG.GetNameDef] untuk memicu konflik dengan [JAP.GetName], Inggris setuju untuk mendukung upaya pembangunan pertahanan kami."
  AST_diplomatic_events.29.a: "Bantuan tersebut disambut baik, namun tidak akan mencegah perang Jepang."
  AST_diplomatic_events.30.t: "Australia Meminta Hak Sumberdaya"
  AST_diplomatic_events.30.desc: "Agresor ekspansionis mengincar Indochina bukan hanya karena wilayahnya sendiri, tapi juga sumber daya yang dimilikinya. Jika kekayaan berakhir di tangan musuh, mereka hanya akan memperpanjang perang, sementara mereka yang berada di Australia dapat membantu mengakhirinya; atau begitulah klaim pemerintah Australia.\n\nHaruskah kita setuju untuk memberikan mereka hak atas sumber daya di wilayah kita?"
  AST_diplomatic_events.30.a: "Kami akan melakukannya."
  AST_diplomatic_events.30.b: "Sumber daya juga tidak dapat diambil oleh [AST.GetName]."
  AST_diplomatic_events.31.t: "[FROM.GetNameDefCap] Memberikan [AST.GetName] Hak Sumber Daya"
  AST_diplomatic_events.31.desc: "Agresor ekspansionis mengincar Indochina bukan hanya karena wilayahnya sendiri, tapi juga sumber daya yang dimilikinya. Jika kekayaan berakhir di tangan musuh, mereka hanya akan memperpanjang perang, sementara mereka yang berada di Australia dapat membantu mengakhirinya; atau begitulah klaim pemerintah Australia.\n\n[ROOT.OVERLORD.GetNameDefCap] telah menyetujui permintaan tersebut."
  AST_diplomatic_events.31.a: "Itu di luar kendali kami."
  AST_diplomatic_events.32.t: "[FROM.GetNameDefCap] Memberikan Hak Sumber Daya"
  AST_diplomatic_events.32.desc: "[FROM.GetNameDefCap] setuju bahwa sumber daya Indochina akan lebih baik jika digunakan di tangan Australia, dan telah memberi kami hak atas sumber daya."
  AST_diplomatic_events.32.a: "Mereka akan sangat berguna."
  AST_diplomatic_events.33.t: "[FROM.GetNameDefCap] Menolak Memberikan Hak Sumber Daya"
  AST_diplomatic_events.33.desc: "[FROM.GetNameDefCap] tidak setuju bahwa sumber daya Indochina akan lebih baik jika digunakan di tangan Australia, dan menolak memberikan hak sumber daya kepada kami."
  AST_diplomatic_events.33.a: "Kami berharap mereka tidak berakhir di tangan musuh."
  AST_diplomatic_events.34.t: "[AST.GetNameDefCap] Permintaan untuk Membagi Wilayah Pasifik"
  AST_diplomatic_events.34.desc: "[AST.GetNameDefCap] menyarankan sebuah perjanjian; salah satu cara untuk menyelesaikan potensi konflik antara kedua negara sebelum konflik tersebut terjadi. Dengan membagi wilayah Pasifik di antara kita, kita dapat merencanakan ekspansi kita di masa depan tanpa takut akan campur tangan pihak lain."
  AST_diplomatic_events.34.a: "Sebuah perjanjian tampaknya masuk akal."
  AST_diplomatic_events.34.b: "[JAP.GetNameDefCap] akan diperluas sesuai keinginan."
  AST_diplomatic_events.35.t: "Pasifik Telah Terpecah"
  AST_diplomatic_events.35.desc: "[AST.GetNameDefCap] dan [JAP.GetNameDefCap] telah menyepakati wilayah Pasifik mana yang dapat dimasuki masing-masing negara. Mudah-mudahan, hal ini akan mencegah potensi konflik di masa depan antara kedua kekuatan kita."
  AST_diplomatic_events.35.a: "Sudah diselesaikan!"
  AST_diplomatic_events.36.t: "Pasifik Akan Terpecah"
  AST_diplomatic_events.36.desc: "[JAP.GetNameDefCap] tidak akan setuju untuk membagi wilayah Pasifik antara kedua negara kita; pemerintah Jepang akan melakukan ekspansi sesuai keinginannya."
  AST_diplomatic_events.36.a: "Begitu juga dengan Australia."
  AST_diplomatic_events.37.t: "Pemindahan Kekuasaan"
  AST_diplomatic_events.37.desc: "Untuk alasan yang tidak diketahui, [AST.GetName] telah memutuskan untuk mengalihkan kendali atas tanah kami kepada [JAP.GetNameDef]. Sesuatu yang tidak menyenangkan sedang terjadi di balik layar, dan hanya masalah waktu sebelum dunia mengetahuinya."
  AST_diplomatic_events.37.a: "Jelasnya, kami tidak mempunyai suara dalam masalah ini."
  AST_diplomatic_events.38.t: "Pakta Nauru"
  AST_diplomatic_events.38.desc: "Akibat Perang Dunia Pertama, beberapa wilayah Jerman di Pasifik berada di bawah kendali Australia, namun sekarang mungkin ada cara untuk mengembalikan salah satu wilayah tersebut: pulau Nauru.\n\n[AST.GetFascistParty] memegang nilai-nilai yang sejalan dengan kepentingan kita, salah satunya adalah pemisahan total [AST.GetName] dari [ENG.GetNameDef]. Karena terbatasnya pengaruh gerakan ini saat ini, para perwakilannya mencari dukungan dari kami untuk mempercepat pertumbuhannya, dan setelah berkuasa penuh, mereka bersikeras untuk mengembalikan kendali atas pulau Nauru – dengan syarat kami menjamin mereka ketika mencari kemerdekaan."
  AST_diplomatic_events.38.a: "Wilayah kami akan kembali!"
  AST_diplomatic_events.38.b: "Kita tidak bisa berkomitmen pada janji kosong."
  AST_diplomatic_events.39.t: "[GER.GetNameDefCap] Menyetujui Pakta Nauru"
  AST_diplomatic_events.39.desc: "[GER.GetNameDefCap] dan [AST.GetFascistParty] telah menyepakati tujuan bersama: [AST.GetName] akan mencapai kemandirian. Karena pengaruh politik [AST.GetFascistParty] saat ini terbatas, [GER.GetNameDef] akan berkontribusi dengan hibah untuk mempercepat pertumbuhannya, dan setelah pengaruh kami tidak lagi terbatas, perjanjian akan dilaksanakan sepenuhnya."
  AST_diplomatic_events.39.a: "Luar biasa!"
  AST_diplomatic_events.40.t: "Pakta Nauru Hancur"
  AST_diplomatic_events.40.desc: "Tidak dapat berkomitmen pada janji yang belum dapat dipenuhi, [GER.GetNameDef] menolak mendukung kebangkitan kita. Pakta Nauru berakhir bahkan sebelum dimulai, dan ambisi [AST.GetFascistParty] akan tetap berada di pundak kita sepenuhnya."
  AST_diplomatic_events.40.a: "[AST.GetFascistParty] akan dilanjutkan tanpa dukungan Jerman."
  AST_diplomatic_events.41.t: "Kembalinya Nauru ke Tangan Jerman"
  AST_diplomatic_events.41.desc: "Kini, dengan kekuasaan penuhnya, [AST.GetFascistParty] menepati janjinya dan memenuhi janjinya. Nauru dikembalikan ke [GER.GetNameDef], dan kami akan menjamin kemerdekaan Australia."
  AST_diplomatic_events.41.a: "Jadi kita akan melakukannya."
  AST_diplomatic_events.42.t: "[AST.GetFascistParty] Mengingkari Janjinya"
  AST_diplomatic_events.42.desc: "Janji mempunyai satu kelemahan fatal; mereka bisa rusak. Saat ini, di tampuk kekuasaan, para pemimpin [AST.GetFascistParty] telah memutuskan bahwa Nauru bukan hanya milik mereka yang harus mereka pertahankan, namun pulau-pulau Pasifik lainnya juga harus mereka rebut.\n\nWilayah lama kita di Pasifik akan tetap menjadi milik kita seperti sebelum Pakta Nauru ditandatangani, dan jika kita menginginkannya dengan cara lain, maka harus ada perang."
  AST_diplomatic_events.42.a: "Masa depan akan menentukan konsekuensinya."
  AST_diplomatic_events.43.t: "[AST.GetNameDefCap] Permintaan Asia Tenggara"
  AST_diplomatic_events.43.desc: "[AST.GetName] berpendapat bahwa melalui ekspansi ke utara, kita dapat meningkatkan pengaruh bersama terhadap diplomasi dan konflik di Asia Tenggara. Meskipun bukan merupakan tuntutan langsung, [AST.GetLeader] menunjukkan bahwa penolakan tidak akan diterima."
  AST_diplomatic_events.43.a: "Dengan perhatian kita di tempat lain, ini akan menjadi yang terbaik."
  AST_diplomatic_events.43.b: "Bagaimanapun, penolakan adalah apa yang akan mereka terima."
  AST_diplomatic_events.44.t: "Transfer Asia Tenggara"
  AST_diplomatic_events.44.desc: "[ENG.GetNameDefCap] dengan bijak telah menyetujui penyerahan wilayah Asia Tenggara mereka kepada kami. Seiring dengan meluasnya perbatasan Australia, pengaruh kita juga ikut meningkat, sehingga hanya tinggal menunggu waktu saja sebelum dunia menjadi tiram kita."
  AST_diplomatic_events.44.a: "Masa depan terlihat cerah."
  AST_diplomatic_events.45.t: "Asia Tenggara Tetap Seperti Apa Adanya"
  AST_diplomatic_events.45.desc: "[ENG.GetNameDefCap] telah menolak penyerahan wilayah Asia Tenggara mereka kepada kami. Meskipun demikian, daya tarik untuk mengendalikan kawasan ini tetap terlihat jelas bagi kami, dan meskipun hal tersebut bukan merupakan keinginan kami, namun hal tersebut mungkin akan menjadi milik kami."
  AST_diplomatic_events.45.a: "Ya, mungkin saja."
  #AST_diplomatic_events.46.t was removed
  AST_diplomatic_events.47.t: "Berbagi Beban"
  AST_diplomatic_events.47.desc: "Meskipun baru-baru ini berpisah dari Persemakmuran Inggris, [AST.GetName] menawarkan kerja sama militer. [AST.GetName] mengklaim bahwa pembagian beban akan menguntungkan [ENG.GetNameDefCap], mengingat betapa tipisnya beban yang ada di seluruh dunia."
  AST_diplomatic_events.47.a: "Kami akan setuju."
  AST_diplomatic_events.47.b: "Kami akan menjaga diri kami sendiri."
  AST_diplomatic_events.48.t: "Pakta Inggris-Australia"
  AST_diplomatic_events.48.desc: "[ENG.GetNameDefCap] telah setuju untuk menandatangani pakta non-agresi, yang meletakkan dasar bagi kerja sama militer."
  AST_diplomatic_events.48.a: "Ini menandai babak baru dalam hubungan kami."
  AST_diplomatic_events.49.t: "Pakta yang Tidak Ditandatangani"
  AST_diplomatic_events.49.desc: "[ENG.GetNameDefCap] telah menolak menandatangani pakta non-agresi. Oleh karena itu, upaya kami untuk membangun kerja sama militer antara kedua negara telah gagal, dan kami harus melanjutkan kemajuan kami sendiri."
  AST_diplomatic_events.49.a: "Itu memang harus kita lakukan."
  AST_diplomatic_events.50.t: "Garnisun Pasifik Australia"
  AST_diplomatic_events.50.desc: "Meskipun perlindungan Asia Tenggara dan Pasifik berada dalam kepentingan Inggris, kawasan ini jauh dari Kepulauan Inggris; jadi [FROM.GetName] sudah mengerti. Sebagai imbalan atas dukungan kami dalam hal pasokan, mereka menawarkan untuk mengambil alih komando pertahanan wilayah tersebut, sehingga memungkinkan kami untuk mengarahkan perhatian kami ke tempat lain."
  AST_diplomatic_events.50.a: "Bantuan [FROM.GetName] akan disambut baik."
  AST_diplomatic_events.50.b: "Wilayah ini letaknya cukup dekat."
  AST_diplomatic_events.51.t: "Garnisun Pasifik [ENG.GetNameDefCap]"
  AST_diplomatic_events.51.desc: "[FROM.GetNameDefCap] setuju; perairan Asia Tenggara harus kami lindungi. Sebagai imbalan atas kontribusi bahan bakar Inggris, [ROOT.GetName] akan mengerahkan upayanya untuk meningkatkan dominasi angkatan laut di perairan tetangga kita."
  AST_diplomatic_events.51.a: "Perairan itu akan menjadi milik kita."
  AST_diplomatic_events.52.t: "Garnisun Pasifik Milik Australia"
  AST_diplomatic_events.52.desc: "[FROM.GetNameDefCap] tidak setuju; mereka tidak membutuhkan bantuan untuk mempertahankan perairan Asia Tenggara. Namun, dengan atau tanpa dukungan Inggris, [ROOT.GetName] akan berupaya meningkatkan dominasi angkatan laut di perairan tetangga."
  AST_diplomatic_events.52.a: "Perairan itu akan menjadi milik kita."
  AST_diplomatic_events.53.t: "Vichy Keluar dari Afrika"
  AST_diplomatic_events.53.desc: "[AST.GetName] mencurigai bahwa jatuhnya atau kerja sama Vichy Perancis adalah salah satu tujuan utama [ENG.GetNameDef], dan oleh karena itu menawarkan untuk bergabung dan mengejar koloni Perancis di Afrika sampai Vichy ditundukkan. Meskipun ada agenda yang tidak diketahui di balik usulan tersebut, tidak ada keraguan bahwa peningkatan kehadiran sekutu di wilayah tersebut akan menguntungkan kita.\n\nJika kita memberikan izin, [AST.GetName] akan memulai diskusi dengan Vichy Perancis, mengupayakan pemindahan koloni mereka secara damai dan pembentukan garnisun Australia."
  AST_diplomatic_events.53.a: "Kami akan menyambut dukungan mereka."
  AST_diplomatic_events.53.b: "Risiko [AST.GetName] memanfaatkannya terhadap kita terlalu besar."
  AST_diplomatic_events.54.t: "Untuk Membantu Mereka"
  AST_diplomatic_events.54.desc: "[ENG.GetNameDefCap] setuju: peningkatan kehadiran sekutu di Afrika akan menguntungkan Persemakmuran.\n\nKami akan memulai diskusi dengan Vichy Prancis, mengupayakan pemindahan koloni mereka secara damai dan pembentukan garnisun Australia."
  AST_diplomatic_events.54.a: "Itu akan kita lakukan."
  AST_diplomatic_events.55.t: "Dengan Izin atau Tidak"
  AST_diplomatic_events.55.desc: "[ENG.GetNameDefCap] menolak bantuan Australia di Afrika dan akan menangani sendiri masalah Vichy Prancis. Namun demikian, ambisi kita tidak mudah dialihkan.\n\nKontrol Australia atas wilayah Vichy Perancis di Afrika akan membuat kita setara dengan Persemakmuran Inggris dan bukan bawahannya. Kita harus mengejar mereka terlepas dari keinginan [ENG.GetNameDef], meskipun harus dilakukan dengan kekerasan."
  AST_diplomatic_events.55.a: "Kami akan memperluas."
  AST_diplomatic_events.56.t: "[AST.GetName] Menuntut Wilayah Afrika"
  AST_diplomatic_events.56.desc: "Atas nama [ENG.GetNameDef], [AST.GetName] datang mengetuk pintu kami, menuntut penyerahan wilayah Afrika.\n\n[ENG.GetNameDefCap] bertekad untuk memperluas kendalinya di Afrika, dan jika kami tidak tunduk pada pendudukan Australia, mereka akan kembali ke depan pintu kami dengan membawa senjata."
  AST_diplomatic_events.56.a: "Untuk menghindari konflik, wilayah harus dialihkan."
  AST_diplomatic_events.56.b: "Kalau begitu, mereka harus kembali dengan bersenjata."
  AST_diplomatic_events.57.t: "Vichy Mentransfer Wilayah Afrika"
  AST_diplomatic_events.57.desc: "Prancis Vichy telah setuju untuk mentransfer wilayah Afrika yang diminta dan mengizinkan garnisun Australia untuk menguasai wilayah tersebut."
  AST_diplomatic_events.57.a: "Ekspansi lebih lanjut ke Afrika akan terus berlanjut!"
  AST_diplomatic_events.58.t: "Vichy Menyangkal Wilayah [AST.GetName]"
  AST_diplomatic_events.58.desc: "Vichy Perancis menolak penyerahan wilayah Afrika kepada kami. Namun, ini bukanlah sebuah permintaan, melainkan sebuah tuntutan.\n\nKami akan mengejar wilayah yang mereka tolak dari kami, meskipun itu harus dilakukan dengan kekerasan."
  AST_diplomatic_events.58.a: "Damai atau tidak, [AST.GetName] akan berkembang."
  #AST_diplomatic_events.59 was removed
  #AST_diplomatic_events.60 was removed
  #AST_diplomatic_events.61 was removed
  AST_diplomatic_events.62.t: "Pakta Anti-Inggris?"
  AST_diplomatic_events.62.desc: "Diplomat dari [AST.GetName] datang kepada kami dengan tawaran untuk membuat pakta Anti-Inggris. Hal ini memerlukan bantuan mereka dalam merebut kembali Irlandia utara dari Inggris, tanpa kita harus campur tangan secara langsung.\nSebagai imbalannya, jika mereka berhasil, kita akan bergabung dengan Fraksi mereka dan membantu mereka dalam perang di masa depan melawan Inggris jika hal itu terjadi.\nMeskipun penyatuan dengan wilayah utara sangat menarik, kita harus mempertimbangkan dengan hati-hati apakah kita berada dalam posisi untuk memusuhi tetangga kita yang lebih kuat dengan cara seperti itu, dan yang lebih penting, apakah kita bisa keluar sebagai pemenang dalam kasus ini konflik - jangan sampai seluruh Irlandia kembali menjadi koloni Inggris belaka."
  AST_diplomatic_events.62.a: "Unifikasi tidak bisa menunggu! Tanda tangani perjanjiannya!"
  AST_diplomatic_events.62.b: "Itu terlalu berbahaya."
  AST_diplomatic_events.63.t: "Irlandia menolak!"
  AST_diplomatic_events.63.desc: "Irlandia telah menolak penandatanganan Pakta Anti-Inggris."
  AST_diplomatic_events.63.a: "Maka Irlandia akan tetap terpecah."
  AST_diplomatic_events.64.t: "Irlandia menerima!"
  AST_diplomatic_events.64.desc: "Irlandia telah menerima penandatanganan Pakta Anti-Inggris."
  AST_diplomatic_events.64.a: "Selanjutnya, ke Belfast!."
  AST_diplomatic_events.65.t: "[FROM.GetName] Memberikan Dukungan"  ### Support for the Chinese Communists - Sends event from AST to PRC offering support
  AST_diplomatic_events.65.desc: "Tumbuhnya pengaruh [FROM.GetCommunistParty] di [FROM.GetNameDef] kini membuahkan hasil ketika perwakilannya telah melintasi Tiongkok untuk memberi tahu kita tentang pasukan sukarelawan [FROM.GetAdjective] yang melakukan mobilisasi untuk mendukung pasukan kita. Selain itu, para relawan ini juga membawa perlengkapan cadangan untuk membantu memperlengkapi pasukan kita sendiri."
  AST_diplomatic_events.65.a: "Awal yang baik untuk kerjasama dengan kawan-kawan [FROM.GetAdjective] kita"
  #AST_diplomatic_events.65.b: "They should focus on their own revolution"
  AST_diplomatic_events.66.t: "[FROM.GetName] Terima kasih atas dukungan kami" ### Support for the Chinese Communists - They accept
  AST_diplomatic_events.66.desc: "Perwakilan [FROM.GetLeader] telah menyampaikan rasa terima kasihnya atas dukungan relawan kami dan atas materi perang yang diberikan. Pengalaman [FROM.GetAdjective] yang luas dalam perang saudara tentunya berarti sumber daya ini akan digunakan secara efektif."
  AST_diplomatic_events.66.a: "Sebuah langkah awal yang bagus"
  AST_diplomatic_events.67.t: "[FROM.GetName] Terima kasih atas dukungan kami" ### Support for the Chinese Communists - They accept
  AST_diplomatic_events.67.desc: "Perwakilan [FROM.GetLeader] telah menyampaikan rasa terima kasihnya atas dukungan relawan kami dan atas materi perang yang diberikan. Pengalaman [FROM.GetAdjective] yang luas dalam perang saudara tentunya berarti sumber daya ini akan digunakan secara efektif."
  AST_diplomatic_events.67.a: "Sebuah langkah awal yang bagus"
  AST_diplomatic_events.68.t: "Tuntutan Australia"
  AST_diplomatic_events.68.desc: "Australia tidak ingin menghadapi musuh besarnya sendirian — [JAP.GetNameDef]. Mereka mendesak kita untuk mengambil langkah pertama dan menyelesaikan konflik yang mungkin terjadi sesegera mungkin."
  AST_diplomatic_events.68.a: "Bagaimana keadaannya telah berubah."
  AST_diplomatic_events.69.t: "Terikat Sekali Lagi"
  AST_diplomatic_events.69.desc: "Ikatan antara [ENG.GetNameDef] dan [AST.GetName] sedang diuji, namun [AST.GetName] berkomitmen untuk membinanya kembali ke kekuatan penuh. [AST.GetName] memiliki koneksi dan sekutu dalam pemerintahan Inggris sedemikian rupa sehingga para pemimpinnya tidak bisa menolaknya; bangsa-bangsa akan bergabung dalam faksi yang sama sekali lagi, dan sekali lagi, Kepulauan dan daratan di bawahnya akan bekerja sama."
  AST_diplomatic_events.69.a: "Jadi itu akan terjadi."
  AST_diplomatic_events.71.t: "Australia Meminta Kepulauan Pasifik"
  AST_diplomatic_events.71.desc: "[AST.GetName] telah menuntut kendali atas pulau-pulau Pasifik kita, dengan mengklaim bahwa Pasifik bagian barat bukan wilayah kekuasaan [USA.GetNameDef]. Pulau-pulau tersebut mungkin merupakan harga kecil yang harus dibayar untuk meredakan permusuhan Australia, namun tetap saja merupakan harga yang harus dibayar. Akankah kita mengambil risiko memprovokasi kebangkitan kekuatan fasis, meskipun kita sudah sibuk?"
  AST_diplomatic_events.71.a: "Tidak, kami tidak akan melakukannya."
  AST_diplomatic_events.71.b: "Kepulauan Pasifik akan tetap menjadi milik kita."
  AST_diplomatic_events.72.t: "Pengalihan Kepulauan Pasifik [USA.GetNameDef]"
  AST_diplomatic_events.72.desc: "Dengan kondisi yang sudah penuh, pulau-pulau di Pasifik terbukti merupakan harga kecil yang harus dibayar [USA.GetNameDef] guna meredakan permusuhan Australia. Kepulauan Pasifik mereka kini menjadi milik kita."
  AST_diplomatic_events.72.a: "Luar biasa."
  AST_diplomatic_events.73.t: "[USA.GetNameDefCap] Menolak"
  AST_diplomatic_events.73.desc: "[USA.GetNameDefCap] telah menolak menyerahkan pulau-pulau Pasifik mereka kepada kami. Terlepas dari tuntutan kami dan pengaruh kami yang semakin besar di Pasifik, Washington tetap tidak mau melepaskan kendalinya atas kepulauan tersebut."
  AST_diplomatic_events.73.a: "Pulau-pulau tersebut mungkin belum menjadi milik kita."
  AST_diplomatic_events.74.t: "Permintaan Australia untuk Transfer Filipina"
  AST_diplomatic_events.74.desc: "Dalam ambisinya untuk memperluas wilayahnya, [AST.GetName] menuntut kendali atas [PHI.GetNameDef]. Jika kami menolak, [AST.GetName] mengancam perang, menganggap tidak terpikirkan bahwa [USA.GetNameDef] mempertahankan wilayah dalam lingkup pengaruh [AST.GetName]."
  AST_diplomatic_events.74.a: "Kita tidak bisa mengambil risiko perang; memenuhi tuntutan mereka."
  AST_diplomatic_events.74.b: "Filipina akan tetap menjadi milik kita!"
  AST_diplomatic_events.75.t: "Pemindahan [PHI.GetNameDef]"
  AST_diplomatic_events.75.desc: "Jelas bahwa kebangkitan [AST.GetName] sebagai kekuatan fasis mulai membawa manfaat tertentu, ketika negara-negara sangat takut akan kemarahan kita. [USA.GetNameDefCap] telah menyetujui; [PHI.GetNameDef] adalah milik kita."
  AST_diplomatic_events.75.a: "Sebuah tatanan baru muncul."
  AST_diplomatic_events.76.t: "[USA.GetNameDefCap] Menolak"
  AST_diplomatic_events.76.desc: "[USA.GetNameDefCap] telah menolak untuk menyerahkan [PHI.GetNameDef] kepada kami. Terlepas dari tuntutan kami dan pengaruh kami yang semakin besar di Pasifik, Washington tetap tidak mau melepaskan kendalinya atas wilayah tersebut."
  AST_diplomatic_events.76.a: "Ini berarti perang."
  AST_diplomatic_events.78.t: "[AST.GetName] Meminta Jaminan Terhadap Raksasa"
  AST_diplomatic_events.78.desc: "[AST.GetNameDefCap] berbagi tujuan mereka yang berani dengan kita:\n\n'[USA.GetNameDefCap] bayangan membayangi kita, mengancam akan ikut campur kapan pun tindakan kita tidak sejalan dengan kepentingannya. Dengan adanya kekuatan global yang begitu besar dalam campur tangan dalam urusan Australia dan Jepang, Asia Timur tidak akan pernah benar-benar menjadi milik kita. Maka, [AST.GetName] akan berperang.'\n\nPerdana Menteri [AST.GetLeader] menyatakan niatnya dengan sangat jelas: [AST.GetName] bermaksud untuk menghadapi [USA.GetNameDef], dan meminta bantuan kita jika Amerika terbukti terlalu kuat untuk dikalahkan sendirian."
  AST_diplomatic_events.78.a: "Jamin mereka, kami akan melakukannya."
  AST_diplomatic_events.78.b: "[JAP.GetNameDefCap] mempunyai urusan sendiri yang harus diurus."
  AST_diplomatic_events.79.t: "[JAP.GetNameDefCap] Jaminan [AST.GetName]"
  AST_diplomatic_events.79.desc: "Jelas, tidak hanya bagi kami, bahwa campur tangan [USA.GetNameDef] dalam diplomasi Asia dan Oseania tidak diinginkan dan tidak dapat diterima. [JAP.GetNameDefCap] telah setuju untuk menjamin bangsa kita, sehingga memungkinkan kita untuk mempunyai standar yang tinggi terhadap musuh-musuh kita, mengetahui bahwa sekutu akan datang membantu kita jika Amerika terbukti terlalu kuat untuk dikalahkan sendirian."
  AST_diplomatic_events.79.a: "Untuk berperang kita berbaris."
  AST_diplomatic_events.80.t: "[JAP.GetNameDefCap] Menolak Menjamin Kami"
  AST_diplomatic_events.80.desc: "Campur tangan [USA.GetNameDefCap] dalam diplomasi Asia dan Oseania tidak diinginkan dan tidak dapat diterima, namun hal ini tampaknya hanya jelas bagi kami. [JAP.GetNameDefCap] menolak memberikan jaminan kepada kita, memaksa kita untuk menghadapi musuh tanpa mereka."
  AST_diplomatic_events.80.a: "Dan kita akan melakukannya."
  AST_diplomatic_events.81.t: "Simbol Persatuan yang Menawan"
  AST_diplomatic_events.81.desc: "Ketertarikan Perdana Menteri Inggris terhadap hewan hampir tidak luput dari perhatian siapa pun, karena koleksinya cukup mengesankan. Penambahan apa pun ke dalam keluarga makhluknya yang beragam pasti akan dihargai, namun terlebih lagi, yang eksotik.\n\n[ENG.GetLeader] sendiri telah menyatakan minatnya pada platipus Australia, dan meskipun ekspornya saat ini dilarang karena risiko kesehatan yang ditimbulkan oleh pengangkutan tersebut terhadap makhluk kecil tersebut, mungkin ada baiknya membuat pengecualian.\n\nHaruskah kita mengabulkan keinginan Perdana Menteri, sebagai simbol persatuan?"
  AST_diplomatic_events.81.a: "[ENG.GetLeader] akan memiliki platipusnya."
  AST_diplomatic_events.81.b: "Larangan ekspor tidak akan dicabut, bahkan bagi Perdana Menteri sekalipun."
  AST_diplomatic_events.82.t: "Laporan Sedih dari [ENG.GetLeader]"
  AST_diplomatic_events.82.desc: "Angkutan platipus yang berangkat dari pelabuhan Melbourne enam minggu lalu, dengan membawa platipus lengkap, telah tiba di [ENG.GetNameDef]. Namun, kedatangan kapal tersebut bukanlah hal yang menggembirakan, karena hewan tersebut diketahui telah mati. [ENG.GetLeader] menyesali hewan peliharaannya yang hilang, yang bahkan dia beri nama sesuai namanya sambil menunggu kedatangannya, namun mengklaim bahwa musuhlah yang harus disalahkan atas kematiannya. Rupanya, ledakan serangan kapal selam membuat platipus ketakutan sampai mati.\n\nNamun, buku catatan petugas platipus menunjukkan kemungkinan penyebab kematian lainnya: suhu air dan udara platipus jauh melampaui tingkat yang dapat diterima.\n\nTerlepas dari itu, [ENG.GetLeader] Platipus sudah mati, dan Perdana Menteri Inggris akan tetap tidak memiliki platipus."
  AST_diplomatic_events.82.a: "Berita menyedihkan memang."
  AST_diplomatic_events.83.t: "Selandia Baru Bergabung Dengan [AST.GetNameDef]"
  AST_diplomatic_events.83.desc: "Setelah referendum yang diadakan baru-baru ini, [NZL.GetNameDef] telah memutuskan untuk menerapkan Klausul 6 Konstitusi Australia.\n\nSelama proses menyatukan koloni-koloni Australia menjadi sebuah federasi pada tahun 1901, Selandia Baru akhirnya memutuskan untuk tidak ambil bagian. Namun sejak saat itu, Konstitusi Australia terus mendefinisikan Selandia Baru sebagai salah satu negara bagian yang potensial, dan mengizinkan penerimaan tanah tersebut.\n\nWarga Selandia Baru kini telah sepakat bahwa tanah mereka lebih aman di bawah pemerintahan Australia, dan oleh karena itu setuju untuk bergabung dengan [AST.GetNameDef]."
  AST_diplomatic_events.83.a: "Tidak banyak yang bisa kami lakukan."
  AST_diplomatic_events.84.t: "[AST.GetNameDefCap] Meminta Wilayah"
  AST_diplomatic_events.84.desc: "Meningkatnya ketegangan di Pasifik sungguh mengkhawatirkan, sementara kapasitas kita untuk mempertahankan wilayah yang terkena dampak tampaknya terbatas; atau begitulah klaim [AST.GetNameDef].\n\nMereka berusaha memperluas wilayah mereka untuk mempertahankan seluruh Asia Tenggara, dan oleh karena itu meminta pengalihan tanah tertentu. Akankah kita setuju?"
  AST_diplomatic_events.84.a: "Tanah tersebut akan dialihkan ke tangan Australia."
  AST_diplomatic_events.84.b: "Kami tidak akan menyetujui hal seperti itu."
  AST_diplomatic_events.85.t: "[FROM.GetNameDefCap] Menyetujui Permintaan Kami"
  AST_diplomatic_events.85.desc: "Meningkatnya ketegangan di Pasifik sungguh mengkhawatirkan, terutama karena kapasitas beberapa negara untuk mempertahankan wilayah mereka tampak terbatas; dan [FROM.GetNameDef] setuju. Mereka akan segera mentransfer wilayah yang kami minta."
  AST_diplomatic_events.85.a: "Mereka memilih dengan bijak!"
  AST_diplomatic_events.86.t: "[FROM.GetNameDefCap] Menolak Permintaan Kami"
  AST_diplomatic_events.86.desc: "Meningkatnya ketegangan di Pasifik sungguh mengkhawatirkan, terutama karena kemampuan beberapa negara untuk mempertahankan wilayahnya tampak terbatas. Meskipun demikian, [FROM.GetNameDef] telah menolak untuk mentransfer wilayah yang kami minta."
  AST_diplomatic_events.86.a: "Tidak banyak yang bisa kami lakukan."
  AST_political_events.1.t: "Panggilan untuk Referendum"
  AST_political_events.1.desc: "Ada dua bidang di mana kita, sebagai pemerintah, berusaha untuk meningkatkan kontrol federal: Penerbangan, dan Pemasaran.\n\nMengenai Penerbangan, tujuannya adalah untuk mengubah Konstitusi untuk memberikan kepada Parlemen Persemakmuran wewenang untuk membuat undang-undang mengenai navigasi udara dan pesawat terbang.\n\nAmandemen Pemasaran adalah untuk mengizinkan kerjasama antara Persemakmuran dan Amerika di bidang pemasaran, yang saat ini secara konstitusional mustahil.\n\nYang mana yang harus kita sebut referendum?"
  AST_political_events.1.a: "Penerbangan, untuk mengatur navigasi udara sepanjang [AST.GetName]."
  AST_political_events.1.a.tt: "Setelah reformasi disahkan:\nTambahkan §YLulus Reformasi Penerbangan§!, yang memberikan:\nKecepatan Penelitian Udara: §G+15%§!\n§YPangkalan Udara§! kecepatan konstruksi: §G+5.00%§!"
  AST_political_events.1.b: "Pemasaran, untuk mengoordinasikan skema pemasaran pertanian nasional."
  AST_political_events.1.b.tt: "Setelah reformasi disahkan:\nTambahkan §YLulus Reformasi Pemasaran§!, yang memberikan:\nPabrik Barang Konsumsi faktor: §Y-10.0%§!"
  AST_political_events.2.t: "Referendum yang Sukses"
  AST_political_events.2.desc.a: "Masyarakat telah setuju untuk membiarkan reformasi penerbangan kita diberlakukan. Karena penerbangan belum ada ketika Konstitusi Australia ditulis, maka sudah sepatutnya pemerintah pada akhirnya mengambil alih wewenang atas navigasi dan regulasi udara. Demi keselamatan dan efisiensi, undang-undang penerbangan nasional yang seragam kini harus dipatuhi."
  AST_political_events.2.desc.b: "Masyarakat telah setuju untuk membiarkan reformasi pemasaran kami diberlakukan. Dengan kekuasaan untuk mengatur produk pertanian dan pemasarannya, pemerintah kini akan mampu menstabilkan pasar dan meningkatkan kerja sama antar negara. Pendapatan petani akan semakin stabil, demikian pula perekonomian nasional."
  AST_political_events.2.a: "Kontrol federal akan diperluas!"
  AST_political_events.4.t: "Perdana Menteri Mengalah"
  AST_political_events.4.desc: "Para pemimpin [AST.GetName] telah lama bekerja keras di bawah tekanan persiapan perang, dan akhirnya, penyakit ini memakan korban terbesarnya; Perdana Menteri meninggal karena serangan jantung.\n\nMengingat keadaan dunia saat ini, kepemimpinannya akan sangat dirindukan. Namun demikian, Australia harus melanjutkan dengan pemimpin baru yang memegang kendali: [AST.GetLeader]."
  AST_political_events.4.a: "Sebuah tragedi nasional."
  AST_political_events.5.t: "Pemerintah Australia Menjadi Keras"
  AST_political_events.5.desc: "Sekelompok suara yang menentang dan kontroversial telah terbentuk: Gerakan Australia Pertama. Pemerintah khawatir bahwa niat mereka mungkin tidak sepenuhnya demokratis dan memilih untuk menempatkan kelompok tersebut, serta anggotanya, di bawah pengawasan. Campur tangan pihak Demokrat akan mengurangi kemampuan kita dalam berorganisasi dan menghambat perekrutan anggota baru."
  AST_political_events.5.a: "Hanya waktu yang dapat membuktikan sifat sebenarnya dari gerakan ini."
  AST_political_events.6.t: "Peringatan Seratus Tahun 1938"
  AST_political_events.6.desc: "Sebelumnya pada hari ini, ketika peringatan satu abad tahun 1938 berlangsung dan kontes 'Australia's March to Nationhood' berlangsung di jalan-jalan utama Sydney, sebuah protes diadakan di Australia Hall.\n\nAktivis dan kelompok hak asasi manusia Aborigin berkumpul untuk meminta perhatian pada fakta bahwa peringatan 150 tahun tersebut tidak hanya menandai dimulainya penjajahan Inggris, namun juga diskriminasi konstitusional terhadap masyarakat Aborigin. Para aktivis menuntut undang-undang baru untuk pendidikan dan perawatan masyarakat Aborigin, serta kebijakan baru yang memungkinkan peningkatan status masyarakat adat menjadi warga negara penuh."
  AST_political_events.6.a: "Tindakan harus diambil."
  AST_political_events.7.t: "Tekanan Kekaisaran"
  AST_political_events.7.desc: "Menyusul kejadian baru-baru ini, tidak dapat disangkal lagi bahwa politik Australia sedang mengalami pergeseran. [ENG.GetNameDefCap] telah mengambil tindakan untuk memastikan secara diplomatis bahwa [AST.GetName] tetap berada di jalur yang sesuai untuk negara di bawah payung Persemakmuran, dengan harapan bahwa dorongan damai mereka ke arah yang benar akan cukup untuk menjaga kesetiaan Dominion mereka."
  AST_political_events.7.a: "Terlepas dari upaya Inggris, [AST.GetName] akan memutuskan jalannya sendiri."
  AST_political_events.8.t: "Perang Akan Datang"
  AST_political_events.8.desc: "$AST_war_is_coming_cat_desc$"
  AST_political_events.8.a: "Kita harus bersiap."
  AST_political_events.9.t: "Sengketa Dalfram"
  AST_political_events.9.desc: "Apa yang awalnya merupakan perselisihan mengenai pemuatan pig iron telah memicu sesuatu yang jauh lebih besar. Para pekerja di seluruh Australia meninggalkan pekerjaannya sebagai bentuk solidaritas, menentang pemerintah dan industri. Ketika pemogokan meluas dan ketegangan meningkat, krisis meningkat dan menuntut pengunduran diri para penguasa. Oleh karena itu, karena gagal mengendalikan situasi, pemerintah melakukan hal tersebut, membiarkan posisi partai yang berkuasa terbuka untuk diklaim oleh [AST.GetCommunistParty]."
  AST_political_events.9.a: "Dan kami akan mengklaimnya."
  AST_political_events.10.t: "Pertempuran Brisbane"
  AST_political_events.10.desc: "Tadi malam, pasukan berhelm baja dikerahkan untuk meredam kerusuhan jalanan di Brisbane. Seorang tentara ditembak mati, dan enam tentara lainnya terluka dalam gangguan yang berlangsung selama tiga jam tersebut.\n\nKerumunan berjumlah hampir 1.000 orang, termasuk sejumlah besar prajurit dan pelaut, berkumpul di luar kantin di sudut Jalan Creek dan Adelaide, baik untuk ikut serta, atau menonton, perkelahian yang terjadi. Mobil pemadam kebakaran tiba dengan sirene yang melengking untuk memisahkan kerumunan, namun begitu mereka pergi, keributan kembali terjadi. Massa yang berteriak-teriak menyerbu pintu masuk kantin dan memecahkan jendela-jendela gedung, dan polisi militer harus mengayunkan tongkat mereka untuk membubarkan massa sekali lagi.\n\nSetelah satu jam kerusuhan, terjadilah tembakan yang mengakibatkan beberapa orang terluka dan satu orang tewas. Bala bantuan polisi militer tiba untuk membubarkan kerusuhan untuk selamanya, didukung oleh seluruh polisi sipil cadangan dan pasukan berhelm baja."
  AST_political_events.10.a: "Perilaku yang tidak dapat diterima!"
  AST_political_events.11.t: "Membalik Halaman"
  AST_political_events.11.desc: "Setelah dua abad dikuasai Inggris, [AST.GetName] bebas. Tidak dibatasi dalam hal kebijakan dan reformasi, banyak pengambil keputusan bersemangat untuk mengemukakan ide-ide mereka; salah satu usulan tersebut telah menimbulkan kontroversi publik.\n\nUsulan tersebut menyangkut bendera [AST.GetAdjective]: haruskah diganti untuk melambangkan partisi kita yang baru-baru ini?"
  AST_political_events.11.a: "Bendera baru akan dikibarkan."
  AST_political_events.11.b: "Sejarah [AST.GetName] tidak boleh dihapus; bendera kami akan tetap ada."
  #AST_political_events.12 is hidden
  AST_political_events.13.t: "Pengawal Baru Bangkit Lagi"
  AST_political_events.13.desc: "$AST_new_guard_spirit_desc$"
  AST_political_events.13.a: "Hanya waktu yang akan membuktikan seberapa sukses mereka kali ini."
  AST_political_events.14.t: "Tunjuk Presiden Dewan Mahkota"
  AST_political_events.14.desc: "Dewan Mahkota yang baru dibentuk akan membantu negara dengan meninjau undang-undang dan memberikan nasihat mengenai kebijakan, keadaan darurat dan masalah konstitusional. Semua negarawan yang ditunjuk dalam majelis tersebut akan memberikan nasihat kepada kepala negara dan pemerintah, namun seorang Presiden akan memimpin semuanya. Pengaruh Presiden terhadap urusan Dewan tidak dapat dianggap remeh, oleh karena itu, penunjukan harus dilakukan dengan sangat hati-hati.\n\nSiapa yang akan ditunjuk sebagai Presiden Dewan Mahkota?"
  AST_political_events.14.a: "Loyalis dan penghubung industri Inggris, Adela Pankhurst Walsh"
  AST_political_events.14.b: "Mantan perdana menteri dan sangat patriotik, Billy Hughes."
  AST_political_events.14.c: "Kepala negaranya sendiri, Alexander Hore-Ruthven."
  AST_canberra_air_disaster_events.1.t: "Bencana Udara Canberra"
  AST_canberra_air_disaster_events.1.desc: "Sebelumnya hari ini, sebuah pesawat Lockheed Hudson jatuh di luar Canberra. Di antara sepuluh orang di dalamnya adalah Panglima Angkatan Darat dan stafnya, yang sedang menjawab panggilan rapat Kabinet. Mereka dan awak pesawat semuanya tewas secara tragis.\n\nPenyebab kecelakaan itu masih menjadi misteri; cuacanya menawarkan kondisi penerbangan yang ideal, dan penerbangan tersebut dikemudikan oleh perwira RAAF yang berpengalaman, Letnan Penerbangan Robert Hitchcock.\n\nApa pun penyebabnya, ini adalah hari yang suram bagi seluruh bangsa – tidak terkecuali bagi keluarga dan teman-teman para korban – dan Australia kini menaruh perhatian pada para pemimpinnya. Bagaimana tanggapan mereka?"
  AST_canberra_air_disaster_events.1.a: "Sebuah peristiwa yang sangat tragis."
  AST_canberra_air_disaster_events.1.a.tt: "Membuka keputusan §Y'Cabinet Trust'§! dan §Ymisi§! untuk menyelamatkan atau menghapus pemerintahan yang sedang menjabat."
  AST_canberra_air_disaster_events.2.t: "[AST.GetRulingParty] Menang"
  AST_canberra_air_disaster_events.2.desc: "Pemerintahan yang berkuasa telah berhasil memimpin Australia melewati kekacauan nasional setelah Bencana Udara Canberra. Bagaikan cahaya penuntun, [AST.GetRulingParty] telah membuktikan keandalan dan kekuatannya di masa-masa sulit, yang pada akhirnya meningkatkan dukungan masyarakat di seluruh negeri."
  AST_canberra_air_disaster_events.2.a: "Masa depan ada di depan."
  AST_canberra_air_disaster_events.3.t: "Sebuah Mosi Tidak Percaya Diri"
  AST_canberra_air_disaster_events.3.desc: "Setelah mosi tidak percaya berhasil, pemerintahan yang berkuasa akhirnya digantikan dan dengan enggan menyerahkan kendali kepada penerusnya. Setelah masa ketidakstabilan politik dan ketidakpercayaan masyarakat, Australia siap untuk awal yang baru."
  AST_canberra_air_disaster_events.3.a: "Kepemimpinan baru dalam bantuan Australia."
  AST_canberra_air_disaster_events.4.t: "Perubahan Kepemimpinan"
  AST_canberra_air_disaster_events.4.desc: "Setelah masa ketidakstabilan politik dan ketidakpercayaan publik, [AST.GetRulingParty] menggantikan kepemimpinannya. Suara mayoritas memaksa Perdana Menteri untuk mundur, dan memungkinkan penggantinya naik podium."
  AST_canberra_air_disaster_events.4.a: "Mudah-mudahan ini akan membuka jalan bagi Australia."
  AST_canberra_air_disaster_events.5.t: "Tuduhan Australia"
  AST_canberra_air_disaster_events.5.desc: "Dalam konferensi pers, [AST.GetName] melontarkan tuduhan kepada kami, mengklaim bahwa kami bertanggung jawab atas kecelakaan pesawat baru-baru ini di wilayah Australia, yang mengakibatkan kematian beberapa pejabat politik.\n\nTuduhan tersebut sepenuhnya salah, tentu saja, hanya membuat sikap tidak hormat tersebut semakin jahat."
  AST_canberra_air_disaster_events.5.a: "Klaim tersebut salah, kita tidak perlu bertindak."
  AST_canberra_air_disaster_events.5.b: "Hal ini tidak boleh dibiarkan begitu saja."
  AST_canberra_air_disaster_events.6.t: "[JAP.GetNameDefCap] Membalas"
  AST_canberra_air_disaster_events.6.desc: "[JAP.GetNameDefCap] tidak menganggap enteng tuduhan kami, menganggapnya sebagai tindakan agresi pertama. [JAP.GetLeader] telah meningkatkan konflik lebih lanjut, dengan menyatakan bahwa negaranya mempunyai hak penuh untuk menyerang tanah kami."
  AST_canberra_air_disaster_events.6.a: "Kami tidak akan meningkatkan ketegangan lagi."
  AST_canberra_air_disaster_events.6.b: "Hal ini tidak bisa dibiarkan begitu saja."
  AST_canberra_air_disaster_events.7.t: "Hore-Ruthven Tetap Bertanggung Jawab"
  AST_canberra_air_disaster_events.7.desc.a: "Intervensi [ENG.GetNameDefCap], dengan tangan yang mantap dan bimbingan yang tegas, telah meyakinkan Gubernur Jenderal [AST.GetAdjective], Alexander Hore-Ruthven, bahwa [AST.GetName] masih tidak dapat dipercayakan ke tangan pemimpin demokratis mana pun.\n\nPartai-partai demokratis telah menunjukkan ketidakmampuan mereka untuk memimpin [AST.GetName] melalui krisis nasional, dan ketidakmampuan tersebut tidak dapat ditoleransi, terutama mengingat keadaan negara yang tidak stabil. [AST.GetName] dan dunia keduanya; [ENG.GetNameDef] khawatir jika kendali Hore-Ruthven berakhir, sentimen fasis yang baru-baru ini muncul di negara kita mungkin akan mampu menutup cengkeraman mereka sepenuhnya di tenggorokan [AST.GetName].\n\n[AST.GetName] membutuhkan kepemimpinan yang tegas dan persatuan, yang akan disediakan oleh Hore-Ruthven hingga pemberitahuan lebih lanjut."
  AST_canberra_air_disaster_events.7.desc.b: "Garda Baru dan simpatisan monarki telah meyakinkan Gubernur Jenderal [AST.GetAdjective], Alexander Hore-Ruthven, bahwa [AST.GetName] masih tidak dapat dipercayakan ke tangan pemimpin demokratis mana pun.\n\nPartai-partai demokratis telah menunjukkan ketidakmampuan mereka untuk memimpin [AST.GetName] melalui krisis nasional, dan ketidakmampuan tersebut tidak dapat ditoleransi, terutama mengingat keadaan dunia yang tidak stabil. [AST.GetName] membutuhkan kepemimpinan yang tegas dan persatuan, yang akan diberikan oleh Hore-Ruthven hingga pemberitahuan lebih lanjut."
  AST_canberra_air_disaster_events.7.a: "Tentu saja ada perubahan."
  INS_limited_war_events.1.t: "Hancurkan Malaya!"
  INS_limited_war_events.1.desc: "Garis pertahanan musuh telah jebol dan prajurit kita merangsek maju tanpa rintangan. Di seberang Selat Malaka, negara boneka Inggris runtuh di bawah amarah rakyat. Boneka-boneka London itu mengira bayonet mereka mampu membendung roda sejarah. Mereka keliru besar."
  INS_limited_war_events.1.a: "Merdeka!"
  INS_limited_war_events.1.b: "Hari yang gilang-gemilang bagi Republik."
  INS_limited_war_events.2.t: "Serangan Balik [FROM.GetAdjective]"
  INS_limited_war_events.2.desc: "Apa yang semula dijanjikan sebagai serangan kilat terhadap rezim boneka kini berbalik menjadi kepahitan. Pasukan [FROM.GetAdjective], yang diperkuat oleh tuan imperialis mereka, telah mendesak prajurit kita dari tanah sengketa dan kini bercokol di sana sebagai penjajah. Setiap hari warta radio menyiarkan kecongkakan mereka. Terus menyerang mengundang kehinaan lebih lanjut, namun mundur berarti mengakui kekalahan di hadapan segenap nusantara."
  INS_limited_war_events.2.a: "Tarik mundur pasukan. Selamatkan apa yang masih bisa diselamatkan."
  INS_limited_war_events.2.b: "Kita tidak akan tunduk pada kaum boneka!"
  INS_limited_war_events.3.t: "[FROM.GetName] Tunduk kepada Republik"
  INS_limited_war_events.3.desc: "Kabar datang dari Kuala Lumpur. Pemerintahan boneka, yang ditinggalkan pada saat yang menentukan oleh para penguasanya di London, telah menerima persyaratan kami daripada membiarkan kota-kotanya terbakar. Tanah yang disengketakan adalah milik kami. Pembelajaran ini tidak akan hilang di negara-negara klien lainnya di kawasan ini."
  INS_limited_war_events.3.a: "Indonesia bangkit perkasa."
  INS_limited_war_events.4.t: "[FROM.GetName] Menolak Syarat Kita"
  INS_limited_war_events.4.desc: "[FROM.GetName] telah mengembalikan tawaran kami ke hadapan kami. Para menteri boneka, membaca naskah yang ditulis di Whitehall, menyatakan bahwa tidak ada satu inci pun tanah yang boleh diserahkan dan bahwa Republik sendiri harus ditundukkan sebelum senjata berhenti."
  INS_limited_war_events.4.a: "Kalau begitu, biarkan meriam yang berbicara."
  INS_limited_war_events.5.t: "[FROM.GetNameDef] Menyerukan Penghancuran Kita"
  INS_limited_war_events.5.desc: "[FROM.GetNameDefCap] telah membuang kepura-puraan terakhir dari perang terukur. Siaran mereka sekarang berbicara secara terbuka tentang perpecahan Republik dan pembagian pulau-pulau di antara para penguasa kolonial lama. Tidak akan ada akhir yang tenang dalam perselingkuhan ini. Entah Indonesia berada pada posisi terakhir, atau tidak sama sekali."
  INS_limited_war_events.5.a: "Kita tegak atau gugur bersama."
  INS_limited_war_events.6.t: "Merangseknya Pasukan [FROM.GetAdjective] Tertahan"
  INS_limited_war_events.6.desc: "Dorongan [FROM.GetAdjective] membuat kami tidak siap dan selama satu musim kami mengkhawatirkan kemungkinan terburuk. Namun dorongan mereka telah menemui jalan buntu. Orang-orang mereka lelah, antrean mereka panjang, dan gertakan dari London semakin tipis seiring dengan setiap komunike. Republik mungkin masih bermurah hati dan menawarkan kepada para boneka sebuah cara untuk mundur dari masalah ini, meskipun banyak yang akan mengatakan bahwa kemenangan bersih akan lebih bermanfaat dibandingkan kemenangan terukur."
  INS_limited_war_events.6.a: "Tawarkan mereka syarat perdamaian."
  INS_limited_war_events.6.b: "Tiada ampun bagi kaum boneka."
  INS_limited_war_events.7.t: "Serangan Kita Terhenti Total"
  INS_limited_war_events.7.desc: "Serangan kita telah macet, dan celakanya musuh menyadari hal itu. Sebuah tuntutan datang dari seberang Selat. Letakkan senjata sekarang dan terima syarat mereka, atau saksikan daftar korban gugur membengkak demi hasil akhir yang sama. Pilihan yang mereka sodorkan hanyalah seberapa megah upacara pemakaman kita nanti."
  INS_limited_war_events.7.a: "Lebih baik damai yang pahit daripada perang yang menghancurkan."
  INS_limited_war_events.7.b: "Republik tidak pernah kenal kata menyerah."
  INS_limited_war_events.8.t: "[FROM.GetName] Menolak Bertekuk Lutut"
  INS_limited_war_events.8.desc: "[FROM.GetName] telah menjawab tawaran kami dengan menantang. Para menteri mereka menyatakan bahwa mereka akan segera membakar setiap kampung dari Penang hingga Johor daripada memberikan satu konsesi pun kepada Republik. Jadi perang terus berlanjut."
  INS_limited_war_events.8.a: "Jika demikian, terjadilah."
  INS_limited_war_events.9.t: "[FROM.GetName] Berniat Menghancurkan Republik!"
  INS_limited_war_events.9.desc: "Penyadapan nirkabel dari komando musuh telah mengkonfirmasi kondisi terburuknya. Tidak akan ada penyelesaian, tidak akan ada perdamaian terukur, tidak akan ada jalan kembali ke garis yang kita pertahankan sebelumnya. Para boneka dan tuan mereka di London menuntut penyerahan total Republik ini, agar Indonesia dihancurkan dan pulau-pulaunya dikembalikan ke tangan imperialis yang telah kita robek. Terhadap hal ini hanya ada satu jawaban."
  INS_limited_war_events.9.a: "Indonesia tetap berdiri tegak!"
### INS - Martial Law Events
  INS_martial_law_events.1.t: "[INS.GetNameDefCap] ingin mempererat hubungan dagang dengan kita"
  INS_martial_law_events.1.desc: "Presiden [INS.GetName] telah menghubungi kita untuk menyampaikan harapan memperkokoh hubungan dagang, serta agar [INS.GetName] memegang peranan lebih besar dalam Lingkungan Kemakmuran Bersama. Presiden [INS.GetName], [INS.GetLeader], menawarkan kesepakatan menggiurkan di mana karet dan komoditas lainnya akan dijual kepada kita bebas bea dan pajak, dengan pengendalian pasar guna memastikan harga tetap murah."
  INS_martial_law_events.1.a: "Tentu saja!"
  INS_martial_law_events.1.b: "Kita tidak tertarik."
  INS_martial_law_events.2.t: "[FROM.GetName] menyetujui perjanjian dagang"
  INS_martial_law_events.2.desc: "[ROOT.GetLeader] telah kembali dari pertemuannya dengan pemerintah [JAP.GetAdjective] di [JAP.GetCapitalVictoryPointName] hari ini membawa kabar gembira; Perjanjian dagang yang diusulkan di [JAP.GetCapitalVictoryPointName] telah disepakati oleh semua pihak dan akan segera diberlakukan."
  INS_martial_law_events.2.a: "Ini akan sangat menguntungkan perekonomian kedua negara!"
  INS_martial_law_events.3.t: "[FROM.GetName] menolak perjanjian dagang"
  INS_martial_law_events.3.desc: "[ROOT.GetLeader] telah kembali dari pertemuannya dengan pemerintah [JAP.GetAdjective] di [JAP.GetCapitalVictoryPointName] hari ini membawa kabar buruk bahwa perundingan menemui jalan buntu setelah kedua belah pihak menolak mengalah dalam pokok pembicaraan tertentu, sehingga tiada perjanjian dagang yang disahkan."
  INS_martial_law_events.3.a: "Sungguh disayangkan."
  INS_martial_law_events.4.t: "[FROM.GetName] meminta kita mengakui klaim Melayu mereka"
  INS_martial_law_events.4.desc: "Seorang utusan dari [FROM.GetNameDef] telah menyampaikan permohonan resmi kepada pemerintah kita. Presiden [FROM.GetLeader], yang telah memproklamasikan penyatuan dunia Melayu sebagai sasaran utama pemerintahannya, meminta agar kita mengakui klaim [INS.GetAdjective] atas seluruh tanah beretnis Melayu, membentang dari Sri Lanka hingga Filipina."
  INS_martial_law_events.4.a: "Kita akan mengakui hak mereka atas tanah historis mereka."
  INS_martial_law_events.4.b: "Ini bukan urusan kita."
  INS_martial_law_events.5.t: "[FROM.GetName] mengakui klaim kita"
  INS_martial_law_events.5.desc: "Pemerintah [FROM.GetName] secara resmi telah mengakui klaim kita atas tanah-tanah Melayu. Dengan restu dari sekutu kita yang paling digdaya, penyatuan dunia Melayu kini tampak jauh lebih nyata untuk diwujudkan."
  INS_martial_law_events.5.a: "Bersatu!"
  INS_martial_law_events.6.t: "[FROM.GetName] menolak mengakui klaim kita"
  INS_martial_law_events.6.desc: "Pemerintah [FROM.GetName] menolak mengakui klaim kita atas dunia Melayu. Tampaknya mereka yang mengaku sekutu kita lebih suka membiarkan bangsa-bangsa serumpun Melayu terpecah belah daripada melihat kita tumbuh kuat. Kita akan mengingat penghinaan ini saat waktunya tiba."
  INS_martial_law_events.6.a: "Ini hanyalah batu sandungan kecil; kita akan bertahan, kita akan menang!"
  INS_martial_law_events.7.t: "[FROM.GetName] menuntut kendali atas Melayu Utara"
  INS_martial_law_events.7.desc: "[FROM.GetName] telah mengirimkan permohonan resmi agar kita menepati pengakuan atas klaim Melayu mereka dengan mengatur penyerahan wilayah Melayu Utara kepada [FROM.GetName], yang saat ini dikuasai oleh [SIA.GetName]. Langkah ini mungkin akan membuat gusar kepemimpinan [SIA.GetAdjective], namun akan sangat memperkokoh ikatan persahabatan kita dengan [INS.GetName]."
  INS_martial_law_events.7.a: "Kita harus menghormati perjanjian."
  INS_martial_law_events.7.b: "Tidak sepadan menciptakan perselisihan di dalam faksi."
  INS_martial_law_events.8.t: "[FROM.GetName] menolak permohonan kita"
  INS_martial_law_events.8.desc: "Kendati mereka sebelumnya mengakui klaim kita secara resmi, pemerintah [JAP.GetAdjective] menolak memediasi penyerahan Melayu Utara, dengan [JAP.GetLeader] berkeras bahwa mereka tidak dapat menanggung risiko perpecahan di dalam faksi. Nyata sudah bahwa janji mereka hampa dan kata-kata mereka tiada artinya di hadapan keadaan genting."
  INS_martial_law_events.8.a: "Mereka menunjukkan ketidakmampuan untuk menepati komitmen."
  INS_martial_law_events.9.t: "[FROM.GetName] meminta kita menyerahkan Melayu Utara kepada [INS.GetNameDef]"
  INS_martial_law_events.9.desc: "[FROM.GetName] telah memberitahu kita bahwa [INS.GetName] menuntut agar kita menyerahkan Melayu Utara kepada [INS.GetName] sebagai bagian dari klaim mereka atas seluruh tanah bangsa Melayu. Pemerintah [JAP.GetAdjective] secara resmi mendukung klaim [INS.GetAdjective], dan penasihat militer [JAP.GetAdjective] memperingatkan kita bisa menghadapi konflik bersenjata jika menolak."
  INS_martial_law_events.9.a: "Bukan berarti kita punya pilihan lain."
  INS_martial_law_events.9.b: "Kita tidak akan tunduk pada imperialisme!"
  INS_martial_law_events.9.a.tt: "§W§RKita berisiko dipandang lemah, yang dapat memicu tuntutan konsesi baru di masa depan.§!§!"
  INS_martial_law_events.10.t: "[JAP.GetName] dan [FROM.GetName] menyetujui penyerahan"
  INS_martial_law_events.10.desc: "[JAP.GetName] telah setuju untuk menengahi pemindahan Melayu Utara, dan telah mengirimkan utusan untuk berunding di [SIA.GetCapitalVictoryPointName], bersama dengan utusan [INS.GetAdjective]. Kesepakatan telah dicapai antara ketiga pihak, yang menyimpulkan bahwa Melayu Utara, akan segera berlaku, merupakan wilayah [INS.GetAdjective]."
  INS_martial_law_events.10.a: "Luar biasa!"
  INS_martial_law_events.11.t: "[FROM.GetName] menolak penyerahan"
  INS_martial_law_events.11.desc: "[SIA.GetLeader] menolak menghadiri perundingan, menegaskan bahwa ia tidak berniat menyerahkan Melayu Utara apa pun konsekuensinya. Ketika kami mengingatkan beratnya konsekuensi keputusan ini, [SIA.GetLeader] bergeming dan mengabaikan gertakan kita, menolak tunduk pada tuntutan apa pun. Hal ini menyisakan sedikit pilihan bagi kita."
  INS_martial_law_events.11.a: "Kalau begitu, terjadilah perang."
  INS_martial_law_events.12.t: "[FROM.GetName] memberitahu bahwa [SIA.GetName] menolak tunduk"
  INS_martial_law_events.12.desc: "Utusan dari [FROM.GetName] telah tiba di [ROOT.GetCapitalVictoryPointName] membawa kabar buruk bahwa pihak [SIA.GetAdjective] menolak mentah-mentah segala penyerahan maupun perundingan, dan [JAP.GetNameDef] telah secara resmi mendepak [SIA.GetNameDef] keluar dari faksi."
  INS_martial_law_events.12.a: "Kalau begitu, perang jalan keluarnya."
  INS_martial_law_events.13.t: "[FROM.GetName] meminta pertuanan atas [SIA.GetName]"
  INS_martial_law_events.13.desc: "[FROM.GetName] telah menyampaikan keinginan mereka untuk memegang pertuanan atas [SIA.GetName], menyusul pandangan [FROM.GetLeader] bahwa [SIA.GetName] adalah bangsa lemah yang tak mampu membela dirinya sendiri, yang terbukti gamblang dari ketundukan kilat mereka atas urusan Melayu Utara. Jasa besar yang diberikan [INS.GetName] bagi faksi sangatlah nyata, dan tampaknya kita berisiko kehilangan mereka sebagai sekutu jika kita mengabaikan permintaan ini."
  INS_martial_law_events.13.a: "Mereka pantas mendapatkannya."
  INS_martial_law_events.13.b: "Sama sekali tidak."
  INS_martial_law_events.14.t: "[FROM.GetName] menyetujui penyerahan"
  INS_martial_law_events.14.desc: "Pemerintah [FROM.GetName] telah sepakat untuk menempatkan [SIA.GetNameDef] di bawah wewenang kita, berlaku segera."
  INS_martial_law_events.14.a: "Bagus sekali."
  INS_martial_law_events.15.t: "[FROM.GetName] menolak penyerahan"
  INS_martial_law_events.15.desc: "Pemerintah [FROM.GetName] menolak menyerahkan pertuanan atas [SIA.GetName] kepada kita, kendati ketidakmampuan mereka membela diri telah terbukti nyata."
  INS_martial_law_events.15.a: "Sayang sekali."
  INS_martial_law_events.16.t: "Kepemimpinan Baru untuk [ROOT.GetName]"
  INS_martial_law_events.16.desc: "Dengan restrukturisasi pemerintahan kita menjadi Persatuan Provinsi-Provinsi Indonesia, sistem presidensial terdahulu yang mengawasi dewan terpilih demokratis akan digantikan dengan sistem presidensial federal yang baru. Kita harus memilih Presiden baru."
  INS_martial_law_events.16.a: "Ini hanyalah penataan ulang internal, pertahankan kepemimpinan yang ada."
  INS_martial_law_events.16.b: "Hatta yang akan mengambil alih tampuk kepemimpinan."
  INS_martial_law_events.16.c: "Kartosoewirjo adalah pilihan yang sangat populer!"
  INS_martial_law_events.16.d: "Pemerintahan militer yang dibutuhkan untuk saat ini."
  # INS_martial_law_events.17.t: "The Dismantling of [ROOT.GetNameDef]"
