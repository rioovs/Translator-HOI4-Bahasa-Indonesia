### INS - Political Events
  INS_political_events.1.t: "Gubernur Jenderal Baru untuk [INS.GetNameDef]"
  INS_political_events.1.desc: "Masa jabatan lima tahun [INS.GetLeader] mendekati akhir, sehingga kita harus menentukan pemimpin yang tepat untuk menggantikannya. Ratu Wilhelmina telah merekomendasikan Alidius Tjarda van Starkenborgh Stachouwer, yang telah menunjukkan kapabilitas luar biasa sebagai Duta Besar Luar Biasa dan Kuasa Usaha."
  INS_political_events.1.a: "Sesuai kehendak Ratu."
  INS_political_events.1.b: "[INS.GetLeader] telah berkinerja baik, beliau harus menjabat satu periode lagi."
  INS_political_events.2.t: "[FROM.GetName] menuntut kepemilikan atas [721.GetName]"
  INS_political_events.2.desc: "Pemerintahan Republik yang baru di bekas Hindia telah memproklamasikan seluruh kepulauan nusantara sebagai wilayah kedaulatan mereka. [FROM.GetLeader] telah mengirimkan tuntutan resmi kepada kita untuk menyerahkan [721.GetName], mengancam tindakan militer jika ditolak."
  INS_political_events.2.a: "Baiklah, tidak sepadan memicu insiden bersenjata."
  INS_political_events.2.b: "Sama sekali tidak!"
  INS_political_events.3.t: "[FROM.GetName] setuju menyerahkan [721.GetName]"
  INS_political_events.3.desc: "Sesuai dugaan, [FROM.GetLeader] telah menyetujui tuntutan kita dan mulai menarik mundur pasukannya keluar dari [721.GetName]. Pasukan TKR telah memasuki wilayah tersebut bersama beberapa utusan pemerintah. [INS.GetLeader] sendiri menyampaikan pidato di Dili memproklamasikan pembebasan dari cengkeraman pengaruh kolonial."
  INS_political_events.3.a: "Luar biasa!"
  INS_political_events.4.t: "[FROM.GetName] menolak menyerahkan [721.GetName]"
  INS_political_events.4.desc: "Perundingan dengan [FROM.GetName] tidak membuahkan hasil baik. [FROM.GetLeader] menolak menyerahkan [721.GetName] dengan alasan apa pun, mengakhiri pertemuan secara sepihak."
  INS_political_events.4.a: "Kalau begitu, perang jalan keluarnya."
  INS_political_events.5.t: "Pemilihan Umum Indonesia"
  INS_political_events.5.desc: "Hari ini menandai tonggak sejarah bersejarah bagi bangsa Indonesia. Dengan revolusi yang secara resmi berakhir, Perdana Menteri [INS.GetLeader] mengumumkan bahwa Indonesia akan menggelar pemilihan umum bebas dan demokratis pertamanya. Hasil pemilu ini akan membawa dampak abadi bagi masa depan Indonesia."
  INS_political_events.5.a: "Sutan Sjahrir telah membimbing negeri ini sampai ke titik ini, beliau yang akan memimpin kita melangkah lebih jauh!"
  INS_political_events.5.b: "Amir Sjarifuddin adalah kompromi yang adil antara kaum Sosialis dan Nasionalis."
  INS_political_events.5.c: "Mohammad Hatta memulai revolusi, dan beliaulah yang akan menuntaskannya."
  INS_political_events.6.t: "Persiapan kita membuahkan hasil"
  INS_political_events.6.desc: "Dengan revolusi yang telah berkobar, gerilyawan kita yang telah menyusup ke dalam aparatur administrasi Hindia tidak perlu lagi bergerak secara rahasia, dan akan mulai melancarkan misi sabotase sebelum pihak Belanda sempat bereaksi."
  INS_political_events.6.a: "Kita harus terus bergerak cepat."
  INS_political_events.7.t: "Petisi Soetardjo"
  INS_political_events.7.desc: "Petisi Volksraad yang diprakarsai oleh Soetardjo—menuntut diselenggarakannya konferensi meja bundar antara perwakilan Belanda dan Indonesia guna membahas aspirasi otonomi Indonesia—telah menyelesaikan perdebatan internal, dan petisi tersebut kini diajukan ke meja Gubernur Jenderal untuk dimintai persetujuan. Kendati banyak penasihat berkeras mempertahankan status quo dan menuntut agar petisi tersebut diveto, tak dapat disangkal bahwa pergerakan nasionalis kian hari kian kuat dan teradikalisasi. Jika kita terus menolak setiap permohonan damai demi otonomi, kaum nasionalis mungkin akan beralih ke jalan kekerasan."
  INS_political_events.7.a: "Kita harus membuka perundingan demi menghindari perang saudara yang tak terelakkan."
  INS_political_events.7.b: "Status quo harus tetap dipertahankan."
  INS_political_events.7.c: "Mungkin ada benarnya pandangan kaum nasionalis itu?"
  INS_political_events.8.t: "Pendudukan [?event_target:INS_invasion_event_invader.GetAdjective] Sudah di Ambang Pintu"
  INS_political_events.8.desc: "Tentara dari [?event_target:INS_invasion_event_invader.GetName] telah mendarat di [?event_target:INS_invasion_event_invaded_state.GetName], dan serdadu kita di sana, yang kalah jauh dalam jumlah, telah diperintahkan untuk melakukan evakuasi militer penuh dari [?event_target:INS_invasion_event_invaded_state.GetName]. Pasukan [?event_target:INS_invasion_event_invader.GetAdjective] terus merangsek maju di Hindia, dan peluang kita menghindari pendudukan tampak suram."
  INS_political_events.8.a: "Kami akan menangkap kaum nasionalis dan mempertahankan rumah kami sampai mati!"
  INS_political_events.9.t: "Bangsa Indonesia Memproklamasikan Kemerdekaan"
  INS_political_events.9.desc: "Ketika [JAP.GetNameDef] mulai menarik mundur pasukannya dari Hindia Timur, kita mengirim serdadu ke Batavia untuk menegakkan kembali pemerintahan kolonial. Namun, pasukan kita mendapati bahwa lanskap politik di Hindia telah berubah drastis sejak masa pendudukan. Sebelum serdadu kita bahkan sempat mencapai Batavia, [INS.GetLeader] telah menandatangani naskah proklamasi kemerdekaan, memproklamasikan Republik Indonesia sebagai negara merdeka, dengan dukungan massa rakyat yang luar biasa masif."
  INS_political_events.9.a: "Kerahkan tank-tank tempur!"
  INS_political_events.9.b: "Ini sia-sia, pertempuran lanjutan bukanlah yang kita butuhkan. Kita harus berfokus membangun kembali tanah air."
  INS_political_events.11.t: "[HOL.GetNameDefCap] mengakui kedaulatan Indonesia"
  INS_political_events.11.desc: "Setelah memproklamasikan kemerdekaan, laskar milisi kita segera bersiaga mempertahankan wilayah dari invasi Belanda yang telah kita antisipasi. Namun, di luar dugaan banyak pihak, [HOL.GetLeader] mengumumkan bahwa ia tidak akan memerintahkan invasi, melainkan memilih memprioritaskan pemulihan tanah air Belanda dan menghindari pertumpahan darah lebih lanjut."
  INS_political_events.11.a: "Mengejutkan, tapi ini kabar yang sangat menggembirakan."
  INS_political_events.12.t: "Pertemuan dengan Tokoh Nasionalis Indonesia"
  INS_political_events.12.desc: "Pasukan kita telah mendarat di [?event_target:INS_invasion_event_invaded_state.GetName] dan kemenangan di medan tempur Indonesia kian nyata. Kita harus menetapkan langkah bagaimana mengelola pendudukan Indonesia. Meskipun pendudukan langsung menjamin akses sumber daya yang kita dambakan, biayanya teramat mahal dan rumit. Kita telah berunding dengan Soekarno, salah satu pemimpin revolusioner terkemuka, dan menyusun rancangan pembentukan pemerintahan boneka Indonesia, yang secara resmi dipimpin sebagian oleh Soekarno, namun tetap di bawah komando mutlak kita. Ini akan menenangkan rakyat sipil Indonesia, dan jauh lebih murah daripada pendudukan total."
  INS_political_events.12.a: "Kita lanjutkan perundingan dengan Soekarno."
  INS_political_events.12.b: "Kita tidak sudi bekerja sama dengan kaum pemberontak."
  INS_political_events.13.t: "Pendudukan [?event_target:INS_invasion_event_invader.GetAdjective] Sudah di Depan Mata"
  INS_political_events.13.desc: "Tentara dari [?event_target:INS_invasion_event_invader.GetName] telah tiba di [?event_target:INS_invasion_event_invaded_state.GetName], dan tentara kita di daerah tersebut, karena kalah jumlah, telah diperintahkan untuk melakukan evakuasi militer penuh di [?event_target:INS_invasion_event_invaded_state.GetName]. Pasukan [?event_target:INS_invasion_event_invader.GetAdjective] terus bergerak maju di Hindia Belanda dan peluang kita untuk menghindari pendudukan tampak suram. Selain itu, mata-mata kami melaporkan bahwa [?event_target:INS_invasion_event_invader.GetLeader] terlihat sedang bernegosiasi dengan Sukarno dan para pemimpin nasionalis lainnya, yang bertujuan untuk menciptakan negara boneka Indonesia yang dipimpin oleh Sukarno di bawah Lingkungan Kemakmuran Bersama."
  INS_political_events.13.a: "Kami akan menangkap kaum nasionalis dan mempertahankan rumah kami sampai mati!"
  INS_political_events.13.b: "Ini berbahaya, namun mungkinkah ini kesempatan nyata kita untuk merdeka?"
  INS_peta_explain_tt: "Kita akan dapat memanfaatkan kekacauan pendudukan untuk memproklamasikan kemerdekaan penuh jika [JAP.GetName] terdesak mundur."
  INS_peta_explain_tt_jap: "§R[INS.GetName] mungkin tetap setia pada kita, namun jika kita mulai kehilangan kendali teritorial, mereka bisa memanfaatkan situasi dan menyatakan kemerdekaan§!."
  INS_political_events.14.t: "Pemimpin Nasionalis Ditangkap"
  INS_political_events.14.desc: "Soekarno, beserta beberapa tokoh revolusioner papan atas Indonesia lainnya, telah diringkus oleh polisi militer Belanda sebelum kita sempat membentuk rezim boneka."
  INS_political_events.14.a: "Sayang sekali, padahal beliau bisa menjadi sekutu yang sangat berharga."
  INS_political_events.15.t: "Pembela Tanah Air"
  INS_political_events.15.desc: "Perundingan dengan Soekarno telah tuntas, dan pembentukan rezim boneka di Indonesia tengah berjalan. Soekarno telah mengerahkan jejaring pengaruhnya dibantu keberadaan militer kita guna melumpuhkan pemerintahan kolonial Belanda serta menegakkan kendali de-facto atas seluruh nusantara."
  INS_political_events.15.a: "Kita bukan hanya mengamankan sumber daya murah, melainkan juga memperoleh sekutu yang berharga."
  INS_political_events.16.t: "Pendudukan [?event_target:INS_invasion_event_invader.GetAdjective] atas Hindia"
  INS_political_events.16.desc: "Pasukan [?event_target:INS_invasion_event_invader.GetAdjective] di Hindia telah berkolaborasi dengan kaum nasionalis Indonesia untuk menggoyahkan administrasi kolonial kita, dan kini telah menduduki Hindia seutuhnya. Bendera triwarna Belanda telah diturunkan dan digantikan sang saka Merah Putih, sementara penduduk pribumi Hindia tampak menyambut kedatangan pendudukan [?event_target:INS_invasion_event_invader.GetAdjective]. Situasi ini sungguh menjadi malapetaka bagi imperium kolonial kita."
  INS_political_events.16.a: "Mereka memenangkan pertempuran ini, namun mereka belum memenangkan peperangan."
  INS_political_events.17.t: "[INS.GetName] memproklamasikan kemerdekaan"
  INS_political_events.17.desc: "Warta telah sampai ke Markas Besar Kekaisaran dari Batavia. Soekarno dan kelompoknya, yang dahulu kita angkat sendiri untuk memimpin kepulauan itu atas nama Kaisar, telah memproklamasikan berdirinya Republik [FROM.GetAdjective] sebagai reaksi atas kekalahan wilayah kita yang beruntun, yakin bahwa kekuatan kita terpecah dan tak mampu menindak mereka."
  INS_political_events.17.a: "Sialnya, dugaan mereka barangkali benar."
  INS_political_events.18.t: "Tan Malaka Kembali ke Indonesia"
  INS_political_events.18.desc: "Tan Malaka, salah satu tokoh komunis paling berpengaruh dan legendaris di Indonesia, akhirnya kembali setelah bertahun-tahun hidup dalam pelarian politik di luar negeri. Kepulangannya menyulut gelombang antusiasme di kalangan sayap kiri dan sel-sel revolusioner, yang memandangnya sebagai sosok idealis yang tak kenal kompromi."
  INS_political_events.18.a: "Beri beliau posisi penting di dalam pemerintahan."
  INS_political_events.19.t: "Kematian Tan Malaka"
  INS_political_events.19.desc: "Warta menggemparkan datang dari garis depan: Tan Malaka telah tewas tertembak dalam insiden penuh misteri. Tokoh revolusioner yang gigih menentang diplomasi lunak ini kini telah tiada, meninggalkan perdebatan sengit mengenai siapa dalang di balik kematian tragisnya."
  INS_political_events.19.a: "Sebuah kehilangan besar bagi perjuangan revolusi."
### INS - Industrial Events
  INS_industrial_events.4.t: "Realokasi Anggaran di [FROM.FROM.GetName]"
  INS_industrial_events.4.desc: "Dengan menutup sebagian perkebunan karet di [FROM.FROM.GetName], kita berhasil mengalokasikan modal besar untuk diversifikasi ekonomi."
  INS_industrial_events.4.a: "Kita bangun sumur minyak bumi di [FROM.FROM.GetName]"
  INS_industrial_events.4.b: "Kita buka pabrik peleburan aluminium di [FROM.FROM.GetName]"
  INS_industrial_events.4.c: "Kita lakukan eksplorasi cadangan mineral yang masih kita kurangi"
  INS_industrial_events.4.d: "Kita buka tambang batu bara di [FROM.FROM.GetName]"
  INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
  INS_industrial_events_5_t_colonial: "Nasib De Javasche Bank"
  INS_industrial_events_5_t_independent: "Nasib Bank Indonesia"
  INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
  INS_industrial_events_5_desc_colonial: "Cadangan devisa De Javasche Bank telah jatuh ke titik terendah dalam satu dekade. Guilder membeli lebih sedikit setiap bulannya, dan pemilik perkebunan menuntut pembayaran dalam mata uang asing. Para penasihat keuangan kami sepakat bahwa Bank Dunia sendiri tidak dapat membalikkan penurunan ini, namun mereka sangat tidak sepakat mengenai solusinya."
  INS_industrial_events_5_desc_independent: "Bank Indonesia melaporkan bahwa nilai Rupiah terdepresiasi hampir seperlima akibat inflasi masa perang dan peredaran mata uang NICA di kota-kota yang diduduki."
  INS_industrial_events.5.a: "Lakukan intervensi devisa dan terbitkan Oeang Republik Indonesia (ORI)!"
  INS_industrial_events.5.b: "Terapkan pengetatan anggaran negara."
  INS_industrial_events.5.c: "Kita akan mematok Gulden Hindia ke Dolar AS."
  INS_industrial_events.6.t: "Persetujuan yang Lebih Menguntungkan"
  INS_industrial_events.6.desc: "Biro Kina (Kina Bureau) telah menerima persyaratan kita. Dengan malaria yang melanda separuh wilayah tropis dan tiadanya pengganti kina yang sepadan, mereka tidak punya banyak pilihan. Perjanjian baru ini menjamin bagi kita bagian keuntungan yang jauh lebih besar dari setiap gram kina yang diekspor dari pesisir kita. Pertanyaannya sekarang adalah ke mana keuntungan tak terduga ini harus diarahkan."
  INS_industrial_events.6.a: "Investasikan di kota-kota kita."
  INS_industrial_events.6.b: "Kembangkan pulau-pulau luar."
  INS_industrial_events.6.c: "Perkuat industri militer kita."
  # Rubber shipment dispatched
  INS_industrial_events.28.t: "Pengiriman Karet Diberangkatkan"
  INS_industrial_events.28.desc: "Konvoi telah memuat karet terakhir dan berlayar ke laut. Pembeli kami akan mendapatkan apa yang mereka bayarkan, dan pembukuan kami akan mencerminkan kompensasi yang disepakati pada waktunya. Selama dua tahun ke depan, biaya transaksi ini akan tetap berada di neraca kita, sebuah pengingat akan tuntutan Depresi terhadap kita."
  INS_industrial_events.28.a: "Dipahami."
  INS_industrial_events.28.b: "Atur pengiriman berikutnya."
  # Oil shipment dispatched
  INS_industrial_events.36.t: "Pengiriman Minyak Bumi Diberangkatkan"
  INS_industrial_events.36.desc: "Kapal-kapal tanker tersebut telah meninggalkan kilang kami, yang pelabuhannya menuju pelabuhan pembeli. Kompensasinya sudah disepakati dan akan diterima seluruhnya, meski beban penjualannya akan membebani perekonomian kita selama dua tahun ke depan. Itulah istilah-istilah yang dunia tawarkan kepada kita di tahun-tahun sulit ini."
  INS_industrial_events.36.a: "Dipahami."
  INS_industrial_events.36.b: "Atur pengiriman berikutnya."
### INS - Volksraad
  INS_volksraad_events.2.t: "[HOL.GetLeader] telah memveto petisi Volksraad."
  INS_volksraad_events.2.desc: "Meskipun petisi tersebut telah disetujui oleh [INS.GetLeader], petisi itu diveto setelah ditinjau oleh [HOL.GetLeader], sehingga kita tidak dapat melanjutkan penerapannya saat ini."
  INS_volksraad_events.2.a: "Mungkin kita dapat mencoba lagi di masa depan dengan petisi yang diratifikasi."
  # Generic/Reused
  INS_volksraad_events.10.t: "Mosi di Volksraad untuk mengizinkan bahasa Indonesia di Sekolah"
  INS_volksraad_events.10.desc: "[INS.GetLeader] telah menyetujui petisi Volksraad untuk mendorong pembukaan sekolah dan perguruan tinggi berbahasa Indonesia di [INS.GetNameDef], dan petisi tersebut telah dikirimkan kepada [HOL.GetLeader] untuk mendapatkan persetujuan akhir."
  INS_volksraad_events.10.a: "Volksraad menjalankan fungsinya sebagaimana mestinya."
  INS_volksraad_events.10.b: "Sama sekali tidak boleh. Veto petisi itu!"
  INS_volksraad_events.11.t: "Pendidikan berbahasa Indonesia akan didirikan."
  INS_volksraad_events.11.desc: "Petisi tersebut telah ditandatangani oleh [HOL.GetLeader], dan kini secara resmi diwajibkan. Pelaksanaan petisi akan segera dimulai setelah rincian akhir diputuskan."
  INS_volksraad_events.11.a: "Volksraad menjalankan fungsinya sebagaimana mestinya."
  # Individual laws
  INS_volksraad_events.20.t: "Mosi di Volksraad untuk mengizinkan bahasa Indonesia di Pemerintahan"
  INS_volksraad_events.20.desc: "Jabatan pemerintahan di Hindia, termasuk Volksraad, semuanya mewajibkan kefasihan berbahasa Belanda, yang membuat banyak anggota Volksraad, terutama perwakilan masyarakat pribumi, mempertanyakan keabsahan demokrasinya. Mereka telah menyusun mosi yang menegaskan bahwa jabatan pemerintahan harus dapat diisi oleh penutur bahasa Indonesia jika memungkinkan."
  INS_volksraad_events.21.t: "Bahasa Indonesia kini diizinkan di Pemerintahan!"
  INS_volksraad_events.21.desc: "Petisi tersebut telah ditandatangani oleh [HOL.GetLeader], dan kini secara resmi diwajibkan. Pelaksanaan petisi akan segera dimulai setelah rincian akhir diputuskan."
  INS_volksraad_events.30.t: "Mosi di Volksraad untuk menghapuskan Sistem Kuota Pendidikan"
  INS_volksraad_events.30.desc: "[INS.GetLeader] telah menyetujui petisi Volksraad untuk menghapuskan sistem kuota pendidikan di [INS.GetNameDef], guna mengakhiri perdebatan berkepanjangan di dalam Volksraad mengenai penerapan dan keadilannya. Petisi telah dikirimkan kepada [HOL.GetLeader] untuk persetujuan akhir."
  INS_volksraad_events.31.t: "Sistem Kuota Pendidikan telah dihapuskan."
  INS_volksraad_events.31.desc: "Petisi tersebut telah ditandatangani oleh [HOL.GetLeader], dan kini secara resmi diwajibkan. Pelaksanaan petisi akan segera dimulai setelah rincian akhir diputuskan."
  INS_volksraad_events.40.t: "Mosi di Volksraad untuk mengurangi pajak ekspor Karet"
  INS_volksraad_events.40.desc: "[INS.GetLeader] telah menandatangani dan menyetujui petisi Volksraad untuk mengurangi pajak tinggi yang dibebankan pada perkebunan karet swasta. Pajak ini secara historis memungkinkan monopoli karet pemerintah yang sangat menguntungkan, namun proteksionisme internasional telah membuat sistem ini jauh kurang menguntungkan. [INS.GetLeader] menyatakan tidak lagi yakin bahwa pajak tersebut sepadan dengan dampak ekonomi yang ditimbulkannya."
  INS_volksraad_events.40.a: "[INS.GetLeader] ada benarnya."
  INS_volksraad_events.40.b: "Pajak tersebut harus tetap berlaku."
  INS_volksraad_events.41.t: "Pajak swasta atas Ekspor Karet telah dikurangi."
  INS_volksraad_events.41.desc: "Petisi tersebut telah ditandatangani oleh [HOL.GetLeader], dan kini secara resmi diwajibkan. Pelaksanaan petisi akan segera dimulai setelah rincian akhir diputuskan."
  INS_volksraad_events.60.t: "Mosi di Volksraad untuk mencabut batas pangkat tak tertulis bagi perwira Indonesia"
  INS_volksraad_events.60.desc: "[INS.GetLeader] telah menyetujui petisi Volksraad untuk mencabut aturan tak tertulis yang membatasi pangkat perwira KNIL non-Belanda, serta menaikkan pangkat perwira Indonesia yang dianggap berpangkat di bawah pencapaian mereka. Petisi telah dikirimkan kepada [HOL.GetLeader] untuk persetujuan akhir."
  INS_volksraad_events.61.t: "Batas tak kasat mata bagi Jenderal [INS.GetAdjective] dicabut."
  INS_volksraad_events.61.desc: "Petisi tersebut telah ditandatangani oleh [HOL.GetLeader], dan kini secara resmi diwajibkan. Pelaksanaan petisi akan segera dimulai setelah rincian akhir diputuskan."
  INS_volksraad_events.70.t: "Mosi di Volksraad untuk melegalkan pengibaran bendera dan simbol nasionalis di muka umum"
  INS_volksraad_events.70.desc: "[INS.GetLeader] telah menyetujui petisi Volksraad untuk mencabut pembatasan pengibaran bendera dan gambar nasionalis di ruang publik pada [INS.GetNameDef], sebagian besar untuk mengurangi radikalisasi banyak nasionalis muda. [INS.GetLeader] menegaskan bahwa kita harus mengambil sikap defensif terhadap masalah ini, bekerja sama dengan para pemimpin nasionalis yang damai sambil membasmi gerakan-gerakan revolusioner, namun keputusan pada akhirnya ada di tangan kita."
  INS_volksraad_events.71.t: "Bendera Merah Putih tidak lagi ilegal untuk dikibarkan!"
  INS_volksraad_events.71.desc: "Petisi tersebut telah ditandatangani oleh [HOL.GetLeader], dan kini secara resmi diwajibkan. Pelaksanaan petisi akan segera dimulai setelah rincian akhir diputuskan."
  INS_volksraad_events.100.t: "Mosi di Volksraad untuk mengizinkan subsidi pendidikan bagi penduduk non-Belanda"
  INS_volksraad_events.100.desc: "[INS.GetLeader] telah menyetujui petisi Volksraad untuk mengizinkan penduduk non-Belanda di [INS.GetNameDef] mengajukan subsidi pendidikan. Petisi telah dikirimkan kepada [HOL.GetLeader] untuk persetujuan akhir."
  INS_volksraad_events.101.t: "Masyarakat [INS.GetAdjective] kini dapat mengajukan Subsidi Pendidikan"
  INS_volksraad_events.101.desc: "Petisi tersebut telah ditandatangani oleh [HOL.GetLeader], dan kini secara resmi diwajibkan. Pelaksanaan petisi akan segera dimulai setelah rincian akhir diputuskan."
### INS - Dutch Interaction Events
  INS_dutch_events.1.t: "[INS.GetNameDefCap] Meminta Komando Angkatan Laut Kita"
  INS_dutch_events.1.desc: "Menyusul jatuhnya tanah air Belanda ke tangan musuh di Eropa, [INS.GetNameDef] telah mengajukan permohonan agar seluruh komando kapal perang dan armada laut di Hindia diserahkan kepada administrasi lokal demi pertahanan terpadu."
  INS_dutch_events.1.a: "Jika itu memperkuat pertahanan, kita harus mengalah."
  INS_dutch_events.1.b: "Kapal-kapal kita hanya tunduk pada perintah Den Haag."
  INS_dutch_events.2.t: "[HOL.GetNameDefCap] Menerima Usulan Komando Angkatan Laut"
  INS_dutch_events.2.desc: "[HOL.GetNameDefCap] telah menyetujui usulan kita untuk memegang komando atas armada laut di perairan Hindia."
  INS_dutch_events.2.a: "Keputusan yang sangat bijaksana."
  INS_dutch_events.3.t: "[HOL.GetNameDefCap] Menolak Usulan Kita"
  INS_dutch_events.3.desc: "[HOL.GetNameDefCap] dengan tegas menolak menyerahkan kendali armadanya, berkeras bahwa keputusan strategis laut harus tetap berada di tangan komando tinggi Den Haag."
  INS_dutch_events.3.a: "Sangat mengecewakan."
  INS_dutch_events.4.t: "[HOL.GetNameDefCap] Membentuk Program Angkatan Laut [HOL.GetName]-[INS.GetName]"
  INS_dutch_events.4.desc: "[HOL.GetNameDefCap] telah mengumumkan pembentukan Program Angkatan Laut [HOL.GetName]-[INS.GetName], sebuah prakarsa gabungan guna mereorganisasi dan memperluas armada maritim kita. Keahlian teknis [HOL.GetAdjective] dipadukan dengan kekuatan prajurit [INS.GetAdjective] akan bersama-sama menjadi tulang punggung jaringan pertahanan Pasifik yang baru."
  INS_dutch_events.4.a: "Langkah nyata menuju keselamatan bersama."
### INS - Netherlands–Indonesia Union Events
  INS_union_events.1.t: "[HOL.GetNameDefCap] Meminta Pemindahan Pemerintahan ke [1058.GetName]"
  INS_union_events.1.desc: "Dengan jatuhnya tanah air, [HOL.GetNameDef] telah memberitahukan kepada kita bahwa pemerintahan dan keluarga kerajaan mereka akan pindah ke [1058.GetName]. Mereka menulis tentang kebutuhan mendesak, kesinambungan, dan perlunya menjaga Kerajaan tetap hidup di mana bendera masih berkibar."
  INS_union_events.1.a: "Perang akan berlanjut dari [1058.GetName]."
  INS_union_events.1.b: "Berani-beraninya mereka! Ini hanyalah upaya menegakkan kembali dominasi kolonial!"
  INS_union_events.2.t: "[INS.GetNameDefCap] Menerima Usulan Relokasi"
  INS_union_events.2.desc: "[INS.GetNameDefCap] telah sepakat untuk menampung pemerintahan pengasingan kita di [1058.GetName]. Persiapan pemindahan tengah berjalan, dan kedua administrasi sedang mengoordinasikan penggabungan kantor dan personel. Bersama-sama, kita akan meneruskan perjuangan Kerajaan dari Timur."
  INS_union_events.2.a: "Front persatuan melawan musuh bersama kita."
  INS_union_events.3.t: "[INS.GetNameDefCap] Menolak Usulan Relokasi"
  INS_union_events.3.desc: "[INS.GetNameDefCap] telah menolak mentah-mentah permintaan kita untuk pindah ke [1058.GetName]. [INS.GetLeader] menyatakan bahwa kita tidak berhak menuntut bantuan sebesar ini ketika sumber daya mereka sendiri sudah sangat terbatas."
  INS_union_events.3.a: "Tampaknya mereka telah lupa panji siapa yang masih mengikat kita."
  INS_union_events.4.t: "[HOL.GetNameDefCap] Memindahkan Angkatan Bersenjata ke [1058.GetName]"
  INS_union_events.4.desc: "Kapal-kapal angkut pertama telah tiba dari tanah air. Kapal-kapal tersebut penuh sesak dengan perwira, prajurit, dan sisa-sisa persenjataan kita. Sebagaimana diperkirakan, beberapa konvoi gagal mencapai pelabuhan. Mereka yang selamat akan menjadi tulang punggung pasukan kita di [1058.GetName]."
  INS_union_events.4.a: "Cukup untuk menjaga sang bendera tetap berkibar."
  # INS proposed union
  INS_union_events.5.t: "[INS.GetNameDefCap] Mengusulkan Uni Belanda–Indonesia"
  INS_union_events.5.desc: "Jelas bagi dunia bahwa perang tidak menguntungkan kita. Negara kami telah jatuh dan basis operasi kami telah berpindah ke timur. Para menteri di [INS.GetName] telah mengirimkan proposal kepada kami untuk membentuk negara serikat gabungan yang dipimpin oleh Ratu Wilhelmina untuk menjamin kerja sama sebanyak mungkin. Meskipun nampaknya tidak ada orang yang senang dengan usulan ini, hal ini mungkin menjadi kunci kelangsungan hidup kita."
  INS_union_events.5.a: "Ini risiko yang harus kita ambil. Hidup sang Ratu!"
  INS_union_events.5.b: "Kita tidak dapat menyetujui ini."
  INS_union_events.6.t: "[HOL.GetNameDefCap] Menerima Usulan Uni"
  INS_union_events.6.desc: "Setelah perdebatan mendesak di dalam kabinet, [HOL.GetLeader] telah menyetujui usulan [INS.GetAdjective]. Dekret tersebut singkat dan tanpa upacara. Pemerintahan kita selanjutnya akan bertindak sebagai satu kesatuan di bawah Mahkota hingga perang berakhir."
  INS_union_events.6.a: "Kesepakatan bersejarah bagi kedua bangsa."
  INS_union_events.7.t: "[HOL.GetNameDefCap] Menolak Usulan Uni"
  INS_union_events.7.desc: "Dewan di [HOL.GetNameDef] telah menolak usulan pembentukan uni bersama. Pesan mereka tegas: kerja sama akan berlanjut, namun kedaulatan tidak akan dibagi."
  INS_union_events.7.a: "Lagi pula kecil kemungkinan hal ini akan berhasil."
  # HOL proposed union
  INS_union_events.8.t: "[HOL.GetNameDefCap] Mengusulkan Uni Belanda–Indonesia"
  INS_union_events.8.desc: "Jelas bagi dunia bahwa perang tidak menguntungkan kita. [HOL.GetNameDef] telah jatuh dan basis operasi mereka telah berpindah ke timur. Para pemimpin [HOL.GetAdjective] telah mengirimi kami proposal untuk membentuk negara serikat gabungan yang dipimpin oleh Ratu Wilhelmina untuk menjamin kerja sama sebanyak mungkin. Meskipun nampaknya tidak ada orang yang senang dengan usulan ini, hal ini mungkin menjadi kunci kelangsungan hidup kita."
  INS_union_events.8.a: "Ini harus dilakukan."
  INS_union_events.8.b: "Ini tak lain hanyalah upaya menegakkan kembali dominasi kolonial."
  INS_union_events.9.t: "[INS.GetNameDefCap] Menerima Usulan Uni"
  INS_union_events.9.desc: "[INS.GetNameDefCap] telah menyetujui usulan kita. Belum jelas bagaimana ini akan berjalan, namun kita harus memusatkan perhatian pada upaya perang."
  INS_union_events.9.a: "Jika kita ingin bertahan, kita harus bertahan bersama-sama."
  INS_union_events.10.t: "[INS.GetNameDefCap] Menolak Usulan Uni"
  INS_union_events.10.desc: "[INS.GetNameDefCap] telah menolak usulan serikat pekerja. Masyarakat dan pemimpin [INS.GetAdjective] tidak melihat hal ini akan berhasil dalam jangka panjang, dan menentang usulan penyerahan kekuasaan."
  INS_union_events.10.a: "Lagi pula kecil kemungkinan hal ini akan berhasil."
  # Flags
  INS_exile_accepted_flag: "Sedang menampung [HOL.GetNameDef] dalam pengasingan"
  INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§RIni akan mengakhiri permainan bagi Anda.§!"
  # Revolution events
  INS_revolution_events.1.t: "[HOL.GetNameDefCap] Bergerak untuk Menumpas Republik"
  INS_revolution_events.1.desc: "Sesuai dugaan, pemerintah Belanda bereaksi keras terhadap tuntutan kemerdekaan kita dengan mengirimkan serdadu ke [1058.GetName] dan menyebarkan propaganda anti-republik melalui media massa."
  INS_revolution_events.1.a: "Kita harus bertindak cepat."
  INS_revolution_events.2.t: "[HOL.GetNameDefCap] Meminta Bantuan Tambahan"
  INS_revolution_events.2.desc: "[HOL.GetLeader] telah mengadakan pertemuan darurat dengan para pemimpin kami, meminta agar kami memberikan bantuan lebih lanjut dalam penaklukan kembali Hindia, hingga secara langsung ikut serta dalam konflik. [HOL.GetLeader] menyatakan bahwa situasinya sangat buruk, dan pasukan Belanda tidak mampu memukul mundur milisi revolusioner. [HOL.GetLeader] berjanji jika kita membantu mereka, kita akan diberikan Kalimantan sebagai bayarannya."
  INS_revolution_events.2.a: "Kita lakukan demi mendapatkan Borneo."
  INS_revolution_events.2.b: "Kita tidak tertarik."
  INS_revolution_events.3.t: "[ENG.GetNameDefCap] Menyetujui Kesepakatan London-Batavia"
  INS_revolution_events.3.desc: "[ENG.GetNameDefCap] telah sepakat untuk terjun langsung ke dalam konflik, mengirimkan beberapa divisi untuk bertempur di Batavia. Meskipun kita harus melepaskan Borneo, hal ini menggeser peluang kemenangan berpihak besar kepada kita."
  INS_revolution_events.3.a: "Borneo akan menjadi pengorbanan yang tak terelakkan."
  INS_revolution_events.4.t: "[ENG.GetNameDefCap] Menolak Kesepakatan London-Batavia"
  INS_revolution_events.4.desc: "[ENG.GetNameDefCap] telah menolak bantuan militer lebih lanjut dalam konflik ini, kendati situasi genting dan imbalan telah ditawarkan. [ENG.GetLeader] menyatakan bahwa meski menjaga imperium kolonial kita sejalan dengan kepentingan mereka, risiko eskalasi global akibat keterlibatan langsung mereka terlampau tinggi, dan kita harus menyelesaikan masalah ini sendirian."
  INS_revolution_events.4.a: "Ini pertanda buruk bagi kita."
  INS_revolution_events.5.t: "[HOL.GetNameDefCap] Meminta Bantuan Kita"
  INS_revolution_events.5.desc: "Kaum revolusioner di Hindia Belanda telah memproklamasikan kemerdekaan dari [HOL.GetNameDef] dan menduduki kota-kota utama. [HOL.GetLeader] telah menghubungi kita dengan mendesak, meminta agar kita membantu mereka secara militer sementara mereka mempersiapkan invasi besar."
  INS_revolution_events.5.a: "Jika kaum revolusioner berhasil, rakyat di koloni kita mungkin akan terinspirasi melakukan hal yang sama."
  INS_revolution_events.5.b: "Kita tidak tertarik ikut campur."
  INS_revolution_events.6.t: "[ENG.GetNameDefCap] Sepakat Membantu Kita"
  INS_revolution_events.6.desc: "[ENG.GetNameDefCap] telah sepakat untuk mengirimkan pasukan sukarelawan dan perlengkapan militer ke [1058.GetName] guna membantu kita merebut kembali kendali atas Hindia."
  INS_revolution_events.6.a: "Ini akan menjadi urusan yang mudah."
  INS_revolution_events.7.t: "[ENG.GetNameDefCap] Menolak Membantu Kita"
  INS_revolution_events.7.desc: "[ENG.GetNameDefCap] telah menolak membantu kita menegakkan kembali kekuasaan atas Hindia, berkeras bahwa urusan Hindia bukanlah urusan mereka kendati wilayah mereka berdekatan dengan area konflik. Kita terpaksa mempersenjatai kembali KNIL dengan kekuatan kita sendiri."
  INS_revolution_events.7.a: "Ini sungguh tidak dapat diterima!"
  INS_revolution_events.8.t: "Milisi Revolusioner Merancang Perlawanan di Hindia"
  INS_revolution_events.8.desc: "Kepolisian Kolonial kita di Hindia Timur telah menangkap dan menginterogasi beberapa anggota gerakan revolusioner yang sedang bangkit di Indonesia. Tampaknya mereka tengah berupaya membangun kekuatan militer guna mempersiapkan kampanye kemerdekaan nasional. Kita belum dapat memastikan sepenuhnya, namun mereka mungkin tengah merancang revolusi bersenjata."
  INS_revolution_events.8.a: "Kita harus mengawasi mereka dengan sangat waspada."
  INS_revolution_events.9.t: "Proklamasi Kemerdekaan Indonesia"
  INS_revolution_events.9.desc: "Sebuah pidato dibacakan hari ini di Jawa oleh [INS.GetLeader], memproklamasikan kemerdekaan Republik Indonesia yang baru didirikan. Kendati kita tidak mengakui republik baru ini, laskar milisi mereka telah menduduki banyak wilayah dan kepolisian kita gagal menegakkan ketertiban di daerah-daerah tersebut. Jika kita tidak menyikapi situasi ini dengan serius, ini bisa meletus menjadi perang terbuka."
  INS_revolution_events.9.a: "Tidak bisa diterima!"
  INS_revolution_events.9.b: "Ini tidak sepadan dengan tenaga yang keluar, jika mereka begitu menginginkan kemerdekaan, biarlah begitu."
  #INS_revolution_events.10.t: ""
  #INS_revolution_events.10.desc: ""
  #INS_revolution_events.10.a: ""
  INS_revolution_events.11.t: "Pasukan Hindia Berhasil Menghentikan Serbuan Milisi"
  INS_revolution_events.11.desc: "Sebuah satuan laskar milisi Republik telah melancarkan operasi militer untuk menduduki [?event_target:INS_temp_occupied_state.GetName]. Prajurit kita yang tangguh di Hindia berhasil memukul mundur pasukan milisi, dan kita mempertahankan kendali penuh atas wilayah tersebut."
  INS_revolution_events.11.a: "Satu lagi kemenangan bagi [HOL.GetNameDef]."
  INS_revolution_events.12.t: "Laskar Milisi Berusaha Menduduki [?event_target:INS_temp_occupied_state.GetName]"
  INS_revolution_events.12.desc: "Sebuah satuan milisi Republik telah melancarkan operasi militer untuk menduduki [?event_target:INS_temp_occupied_state.GetName]. Polisi dan prajurit kita pada akhirnya berhasil mengendalikan keadaan, namun insiden ini memicu pembangkangan di dalam [?event_target:INS_temp_occupied_state.GetName], dengan banyak warga sipil mendukung milisi dan secara terang-terangan menentang pemerintah [HOL.GetAdjective]."
  INS_revolution_events.12.a: "Kita tidak boleh membiarkan ini bereskalasi."
  INS_revolution_events.14.t: "Milisi Berhasil Menduduki [?event_target:INS_temp_occupied_state.GetName]"
  INS_revolution_events.14.desc: "Kendati segenap upaya terbaik dikerahkan Polisi Kolonial dan Serdadu kita, laskar milisi Republik telah berhasil melancarkan operasi militer dan menduduki [?event_target:INS_temp_occupied_state.GetName]. Pasukan kita terpaksa mundur dan menyatakan kegagalan memerintah wilayah tersebut akibat perlawanan sengit milisi. Jika kita terus membiarkan milisi mendesak kita, kita berisiko kehilangan koloni agung kita untuk selama-lamanya."
  INS_revolution_events.14.a: "Ini sungguh keterlaluan!"
  INS_revolution_no_effect_tt: "Tidak ada pengaruh"
  INS_revolution_events.19.t: "Perundingan Damai di Hindia"
  INS_revolution_events.19.desc: "[HOL.GetLeader] telah dipanggil ke sebuah pertemuan bersama [INS.GetLeader] guna membahas kemungkinan persetujuan damai. [INS.GetLeader] menyatakan bahwa sudah terlampau banyak nyawa yang melayang, dan mengusulkan solusi dua negara di mana batas-batas wilayah dipertahankan seperti keadaan saat ini dengan sedikit penyesuaian, serta penghentian pertempuran secara permanen."
  INS_revolution_events.19.a: "Kita harus sepakat. Terlalu banyak darah telah tertumpah."
  INS_revolution_events.19.b: "Jika kalian begitu mendambakan damai, kalian yang harus menyerah!"
  INS_revolution_events.20.t: "[HOL.GetNameDefCap] Menyetujui Solusi Dua Negara!"
  INS_revolution_events.20.desc: "[INS.GetLeader] telah kembali dari pertemuannya dengan [HOL.GetLeader] membawa kabar baik. Solusi dua negara telah disepakati oleh kedua belah pihak, dan kita akan segera mengatur penarikan mundur pasukan sesuai batas-batas baru. Meskipun tiada yang gembira harus meninggalkan saudara-saudara sebangsa kita di belakang, keputusan mengakhiri pertumpahan darah pada akhirnya adalah yang terbaik."
  INS_revolution_events.20.a: "Pertumpahan darah akhirnya usai."
  INS_revolution_events.21.t: "[HOL.GetNameDefCap] Menolak Menghentikan Pertempuran"
  INS_revolution_events.21.desc: "Pertemuan [INS.GetLeader] dengan [HOL.GetLeader] tidak berjalan sesuai rencana, dengan kedua belah pihak tampak tersulut emosi dan menolak berkompromi, mengakibatkan pertemuan diputus di tengah jalan."
  INS_revolution_events.21.a: "Berapa banyak lagi nyawa yang harus dikorbankan?"
  INS_revolution_events.22.t: "[HOL.GetNameDefCap] Meminta Bantuan Kita"
  INS_revolution_events.22.desc: "[HOL.GetLeader] telah meminta pertemuan dengan [FRA.GetLeader] di Amsterdam guna membahas situasi terkini di Hindia. Dalam pertemuan itu, [HOL.GetLeader] memaparkan bagaimana kaum revolusioner mempersenjatai milisi dengan kecepatan yang tak mampu ditandingi tentara Belanda, dan bahwa [HOL.GetNameDef] berisiko kehilangan hegemoni kolonialnya. [HOL.GetLeader.GetHeShe] memohon agar kita secara resmi bergabung ke dalam konflik di pihak Belanda, dan mengirimkan divisi ke Batavia untuk membantu merebut kembali Hindia. Sebagai imbalannya, kita akan diberikan hak atas timur laut Sumatra begitu ketertiban dipulihkan."
  INS_revolution_events.22.a: "Meskipun membantu akan mahal, wilayah Sumatra mungkin membuatnya sepadan."
  INS_revolution_events.22.b: "Ini permintaan yang berlebihan bagi kita."
  INS_revolution_events.23.t: "[FRA.GetNameDefCap] Sepakat Membantu Kita!"
  INS_revolution_events.23.desc: "[FRA.GetNameDefCap] telah menyetujui seruan bantuan kita, dan telah mengirimkan banyak divisi Prancis ke Batavia untuk segera memperkuat posisi kita."
  INS_revolution_events.23.a: "Kini angin kemenangan berpihak pada kita."
  INS_revolution_events.24.t: "[FRA.GetNameDefCap] Menolak Membantu."
  INS_revolution_events.24.desc: "[FRA.GetNameDefCap] menolak membantu kita menghadapi revolusi, kendati situasi sangat mendesak. Kita harus segera mempersenjatai diri secara mandiri dan cepat, jika tidak kita akan segera kalah jumlah."
  INS_revolution_events.24.a: "Keadaan tampak kian mencemaskan."
  INS_revolution_events.25.t: "Berakhirnya Peperangan di Indonesia"
  INS_revolution_events.25.desc: "Pasukan [HOL.GetAdjective] telah menghancurkan basis utama milisi dan menggulingkan pemerintahan Republik. Elit dan komandan Partai Republik telah ditangkap, dan pemerintah Hindia Belanda memulai kembali operasi mereka di wilayah bekas republik. Sesuai janji atas kontribusi kami, wilayah yang disepakati telah diberikan kepada kami."
  INS_revolution_events.25.a: "Luar biasa!"
  INS_revolution_events.26.t: "Berakhirnya Peperangan di Indonesia"
  INS_revolution_events.26.desc: "Pasukan [HOL.GetAdjective] dan laskar milisi Republik telah bertempur jauh lebih lama daripada yang diperkirakan kedua pihak, dan [HOL.GetLeader] telah sepakat menandatangani perjanjian damai yang memberlakukan solusi dua negara. Namun, karena kita tetap memenuhi kesepakatan militer kita, [HOL.GetLeader] menegaskan bahwa kita tetap akan menerima wilayah yang telah dijanjikan."
  INS_revolution_events.26.a: "Perkembangan yang menarik."
  INS_revolution_events.27.t: "Berakhirnya Peperangan di Indonesia"
  INS_revolution_events.27.desc: "Pasukan [HOL.GetAdjective] dan milisi Republik bertempur jauh lebih sengit dari dugaan, dan kendati ada upaya besar dari [HOL.GetNameDef] serta bantuan militer kita, banyaknya jumlah laskar milisi dan taktik gerilya mereka membuat konflik menemui jalan buntu yang sangat menguntungkan pihak Republik. Maka, [HOL.GetLeader] mengumumkan hari ini bahwa [HOL.GetLeader.GetHeShe] telah menandatangani kesepakatan damai dengan Republik memberlakukan solusi dua negara yang menguntungkan Republik. Apa yang tersisa dari Hindia hanyalah puing-puing kejayaan masa lalunya. [HOL.GetLeader] menyatakan bahwa karena konflik berakhir dengan kekalahan, beliau tidak dapat menyerahkan wilayah yang dijanjikan atas kontribusi militer kita."
  INS_revolution_events.27.a: "Ini kegilaan yang tak masuk akal!"
  INS_revolution_events.28.t: "Runtuhnya Hindia Belanda"
  INS_revolution_events.28.desc: "Kendati anggaran militer besar-besaran telah dikucurkan oleh [HOL.GetNameDef], dan bantuan langsung kita kerahkan ke medan laga, banyaknya milisi di Hindia berhasil memukul mundur pasukan kita, dan telah menduduki seluruh kota utama, menumbangkan administrasi Belanda dan memaksakan penyerahan kekuasaan."
  INS_revolution_events.28.a: "Tapi kita sudah dijanjikan wilayah!"
  INS_revolution_events.29.t: "Runtuhnya Hindia Belanda"
  INS_revolution_events.29.desc: "Meskipun kita telah berupaya semaksimal mungkin, kaum revolusioner di Hindia telah menguasai kota-kota besar kita dan menghancurkan pemerintahan kolonial dari dalam. Jenderal kami telah ditangkap dan jalur komunikasi kami telah diputus. Kami tidak punya pilihan selain menerima kekalahan kami."
  INS_revolution_events.29.a: "Sebuah tragedi besar bagi bangsa kita."
  INS_revolution_events.30.t: "[INS.GetLeader] Mengusulkan Gencatan Senjata Lokal"
  INS_revolution_events.30.desc: "[INS.GetLeader] telah mengusulkan gencatan senjata lokal di [FROM.GetName], berjanji menarik pasukannya dari [FROM.GetName] jika kita setuju, memungkinkan pasukan kita menegakkan kembali ketertiban di wilayah tersebut. Namun, hal ini dengan syarat kita menunda operasi militer besar untuk sementara waktu, memberi kaum revolusioner waktu untuk menyusun siasat."
  INS_revolution_events.30.a: "Kita terima tawaran ini."
  INS_revolution_events.30.b: "Kita tolak, kita akan rebut kembali [FROM.GetName] dengan kekuatan senjata!"
  INS_revolution_events.31.t: "[HOL.GetNameDefCap] Menyetujui Gencatan Senjata di [FROM.GetName]"
  INS_revolution_events.31.desc: "Perundingan gencatan senjata berjalan lancar, dengan [HOL.GetLeader] menyetujui syarat-syarat kita. Kita telah memerintahkan komandan milisi di [FROM.GetName] untuk segera menarik pasukannya."
  INS_revolution_events.31.a: "Semoga mereka memegang teguh komitmen perjanjian ini."
  INS_revolution_events.32.t: "[HOL.GetNameDefCap] Menolak Gencatan Senjata"
  INS_revolution_events.32.desc: "Perundingan gencatan senjata tidak berjalan seperti yang diharapkan, dan [HOL.GetLeader] menolak menandatangani kesepakatan serta memutus perundingan sebelum kompromi dapat ditemukan."
  INS_revolution_events.32.a: "Ini tidak dapat diterima!"
  INS_revolution_events.33.t: "[INS.GetNameDefCap] Meminta Mediasi"
  INS_revolution_events.33.desc: "Partai Republik Indonesia secara resmi telah meminta bantuan kami untuk menengahi penyelesaian dengan Belanda. Para penasihat kami di kawasan melaporkan bahwa situasi memburuk dengan cepat, dan operasi militer Belanda yang terus berlanjut berisiko membuat kaum nasionalis jatuh ke tangan Soviet. Belanda adalah sekutu berharga di Eropa, namun kita tidak bisa mengabaikan realitas politik di Asia Tenggara. Jika Indonesia jatuh ke tangan komunisme karena kita bermalas-malasan, maka kitalah yang gagal."
  INS_revolution_events.33.a: "Mengirimkan mediator."
  INS_revolution_events.33.b: "Kita tidak boleh mempertaruhkan hubungan baik dengan Belanda."
  INS_revolution_events.34.t: "[FROM.GetNameDefCap] Sepakat Memediasi"
  INS_revolution_events.34.desc: "Washington telah sepakat untuk menjadi penengah antara pemerintah kita dan pihak Belanda. Utusan-utusan Amerika sedang dalam perjalanan, dan gencatan senjata formal akan diusulkan. Ini adalah peluang emas yang luar biasa. Dengan kekuatan terkemuka dunia mendukung perundingan, Belanda akan merasa jauh lebih sulit untuk mengulur waktu atau menggunakan kekerasan militer. Kita harus bersikap teguh di meja perundingan dan membiarkan Amerika melakukan keahlian diplomatik mereka."
  INS_revolution_events.34.a: "Semoga pihak Belanda dapat berpikir rasional."
  INS_revolution_events.35.t: "[USA.GetNameDefCap] Mengumumkan Mediasi"
  INS_revolution_events.35.desc: "Amerika telah melibatkan diri dalam permasalahan Indonesia. Washington mengaku bertindak sebagai mediator netral, namun implikasinya jelas. Jika kita tidak dapat menyelesaikan konflik ini demi kepuasan mereka, mereka akan menggunakan kekuatan mereka yang besar untuk melawan kita. Negosiator kita harus bertindak hati-hati. Niat baik Amerika bukanlah sesuatu yang bisa kita sia-siakan."
  INS_revolution_events.35.a: "Kita akan menyelesaikan masalah ini menurut ketentuan kita sendiri."
  INS_revolution_events.36.t: "[FROM.GetNameDefCap] Menolak Turun Tangan"
  INS_revolution_events.36.desc: "Pihak Amerika telah menolak permintaan mediasi kita. Washington memilih untuk berdiri bersama sekutu Eropa mereka alih-alih mendukung perjuangan penentuan nasib sendiri bangsa kita. Kita berjuang sendirian. Ini adalah pukulan pahit, namun revolusi ini tidak dimulai karena kita mengharapkan kekuatan asing menghadiahkan kemerdekaan kepada kita."
  INS_revolution_events.36.a: "Kita akan memenangkan peperangan ini tanpa bantuan mereka."
  INS_revolution_events.37.t: "[USA.GetNameDefCap] Mengeluarkan Ultimatum"
  INS_revolution_events.37.desc: "Amerika sudah kehilangan kesabaran. Washington telah menyampaikan ultimatum yang menuntut penghentian segera seluruh operasi militer di Indonesia dan pengakuan kedaulatan Indonesia. Ancamannya nyaris tidak terselubung. Posisi kita di komunitas internasional tidak akan bertahan jika terjadi perpecahan dengan Amerika, dan perekonomian kita tidak akan mampu menerima konsekuensinya. Para jenderal kita bersikeras bahwa kampanye ini masih bisa dimenangkan, tapi apa akibatnya?"
  INS_revolution_events.37.a: "Kita tidak punya pilihan selain mematuhinya."
  INS_revolution_events.37.b: "Indonesia adalah milik kita. Kita tidak akan tunduk."
  INS_revolution_events.38.t: "Pihak Belanda Mengalah"
  INS_revolution_events.38.desc: "Peperangan berakhir sudah. Pemerintah Belanda telah menerima ultimatum Amerika dan mengakui kedaulatan kita. Tiga ratus lima puluh tahun kekuasaan kolonial, berakhir bukan di medan tempur semata, melainkan di meja perundingan dengan bobot dukungan kekuatan terbesar di dunia di belakang perjuangan kita. Republik ini seutuhnya menjadi milik kita, akhirnya, merdeka sepenuhnya."
  INS_revolution_events.38.a: "Merdeka!"
  INS_revolution_events.39.t: "Pihak Belanda Menolak Ultimatum"
  INS_revolution_events.39.desc: "Di luar dugaan, Belanda menolak ultimatum Amerika. Para jenderal mereka harus yakin bahwa mereka dapat memenangkan perang ini sebelum Washington mengambil tindakan. Mereka salah. Dengan Amerika kini secara terbuka berkomitmen pada tujuan kita, keseimbangan kekuatan telah berubah secara signifikan. Biarkan mereka datang. Kami tidak lagi berjuang sendirian."
  INS_revolution_events.39.a: "Dunia berdiri tegak bersama kita."
  INS_revolution_events.40.t: "Pihak Belanda Menerima Syarat Kita"
  INS_revolution_events.40.desc: "Den Haag telah menerima ultimatum kita. Pasukan Belanda di Indonesia akan menghentikan tembakan, dan kedaulatan akan dialihkan kepada Republik Indonesia. Ini adalah penyelesaian yang memuaskan dari sebuah episode yang kelam. Kepentingan kita di kawasan kini jauh lebih terlayani oleh Indonesia yang merdeka dan stabil daripada menopang proyek kolonial yang tak lagi sanggup dipertahankan Belanda."
  INS_revolution_events.40.a: "Hasil akhir yang sangat masuk akal."
  INS_revolution_events.41.t: "Pihak Belanda Membangkang kepada Kita"
  INS_revolution_events.41.desc: "Den Haag telah menolak mentah-mentah ultimatum kita. Pasukan Belanda di Indonesia meneruskan operasi militer mereka secara terbuka menentang tuntutan Amerika. Ini adalah kekeliruan perhitungan yang luar biasa fatal. Belanda tidak dapat mengobarkan perang kolonial di Asia sembari terus bergantung pada bantuan ekonomi dan militer Amerika di Eropa. Mereka telah memaksa tangan kita bertindak."
  INS_revolution_events.41.a: "Biarlah demikian."
  INS_revolution_events.42.t: "Lemparan Dadu Terakhir"
  INS_revolution_events.42.desc: "Laporan dari badan intelijen kami di Batavia menggambarkan persiapan musuh yang belum pernah kami lihat dari Partai Republik. Tampaknya mereka sedang mempersiapkan operasi destabilisasi untuk menyerbu Pulau Jawa dan menghancurkan semua infrastruktur komunikasi kita, yang secara efektif menjamin kemenangan mereka. Namun, operasi ini sangat berisiko dan mengharuskan mereka mengerahkan hampir seluruh sumber daya mereka untuk melakukan hal tersebut. Jenderal kami memperkirakan mereka hanya mampu memegang posisi ini selama sekitar dua tahun, dan tidak dapat mundur dengan mudah. Jika kita menahan mereka cukup lama, kita akan mampu menghancurkan pemerintahan dan revolusi mereka seperti tomat yang terlalu matang."
  INS_revolution_events.42.a: "Maka pertempuran penentuan pun dimulai."
  INS_revolution_events.43.t: "Pangkalan Milisi di [FROM.GetName] Telah Didirikan"
  INS_revolution_events.43.desc: "Upaya kami di [FROM.GetName] telah berhasil, dan para pemimpin milisi lokal kami telah memastikan bahwa mereka siap bertindak ketika tiba waktunya."
  INS_revolution_events.43.a: "Kita harus terus melanjutkan ikhtiar kita."
  # Chaos Events
  INS_chaos_events.1.t: "Pertempuran di Surabaya"
  INS_chaos_events.1.desc: "Menyusul proklamasi kemerdekaan, kekuasaan di Surabaya bergejolak hebat. Insiden perobekan bendera Belanda di Hotel Yamato dan tewasnya perwira Sekutu telah menyulut amarah pasukan asing. Bung Tomo melalui radio membakar semangat pemuda dan arek-arek Suroboyo dengan takbir untuk melawan ultimatum penyerahan senjata."
  INS_chaos_events.1.a: "Lawan sampai titik darah penghabisan! Merdeka atau mati!"
  INS_chaos_events.1.b: "Perintahkan gencatan senjata, kita tidak boleh memicu eskalasi bencana."
  INS_chaos_events.2.t: "Partai-partai Sosialis Melebur"
  INS_chaos_events.2.desc: "Dua partai Sosialis terbesar di Indonesia, dipimpin oleh Amir Sjarifuddin dan Sutan Sjahrir hari ini mengumumkan merger, membentuk Partai Sosialis Indonesia yang bersatu. Hal ini secara signifikan meningkatkan pengaruh politik partai tersebut, dan berpotensi membahayakan pemerintahan kita."
  INS_chaos_events.2.a: "Persatuan adalah kekuatan."
  INS_chaos_events.2.b: "Tidak ada waktu untuk berpolitik, umumkan darurat militer!"
  INS_chaos_events.3.t: "Kerusuhan Massa di Batavia"
  INS_chaos_events.3.desc: "Ketegangan antara pemuda revolusioner dan aparat kolonial KNIL pecah di jalanan Batavia. Penjarahan gudang senjata dan bentrokan bersenjata membuat situasi kota nyaris lumpuh total."
  INS_chaos_events.3.a: "Kirim milisi untuk mengamankan ketertiban."
  INS_chaos_events.4.t: "Insiden Bendera"
  INS_chaos_events.4.desc: "Pengibaran bendera Belanda di pusat kota telah memicu amuk massa pemuda. Sekelompok pemuda nekat memanjat tiang, merobek bagian warna biru, dan mengibarkan kembali warna merah putih di tengah sorak gempita rakyat."
  INS_chaos_events.4.a: "Merah Putih berkibar megah!"
  INS_chaos_events.4.b: "Partai Sosialis akan mengambil alih kepemimpinan."
  INS_chaos_events.4.c: "Bubarkan Republik, Tan Malaka yang akan memimpin kita menuju kejayaan!"
  # Loyalist Events
  INS_loyalist_events.1.t: "[INS.GetLeader] Meminta Pemindahan Henri Winkelman"
  INS_loyalist_events.1.desc: "[INS.GetLeader] telah menghubungi kita terkait konflik yang kian meluas di seluruh dunia dan posisi berbahaya yang dihadapi [INS.GetNameDef]. [INS.GetLeader] mengusulkan agar Henri Winkelman, mantan Panglima KNIL, secara resmi dipindahkan kembali ke [INS.GetNameDef] guna menjamin pertahanan koloni."
  INS_loyalist_events.1.a: "Kita akan mengatur pemindahannya segera."
  INS_loyalist_events.1.b: "Henri Winkelman sangat dibutuhkan di tanah air."
  INS_loyalist_events.2.t: "[HOL.GetLeader] Sepakat Memindahkan Henri Winkelman."
  INS_loyalist_events.2.desc: "[INS.GetLeader] telah kembali dari [HOL.GetNameDef] di mana beliau bertemu dengan [HOL.GetLeader]. Pertemuan berlangsung lancar, dengan [HOL.GetLeader] memahami situasi genting dan menyetujui pemindahan segera Winkelman. Henri Winkelman kini dalam perjalanan menuju [1058.GetName] untuk menanti perintah kita."
  INS_loyalist_events.2.a: "Ini akan sangat membantu pertahanan kita."
  INS_loyalist_events.3.t: "[HOL.GetLeader] Menolak Memindahkan Henri Winkelman"
  INS_loyalist_events.3.desc: "[INS.GetLeader] telah kembali dari [HOL.GetNameDef] setelah bertemu dengan [HOL.GetLeader]. Sayangnya, Henri Winkelman tidak akan dikirim ke Hindia, dan kita harus mempertahankan wilayah kita tanpa kehadirannya."
  INS_loyalist_events.3.a: "Kita harus segera menyusun rencana baru secepatnya."
  INS_henri_winkelman_tt: "Pemindahan Henri Winkelman Ditolak"
  # MALAYA CHAIN - Independent Malaya
  INS_loyalist_events.4.t: "[FROM.GetNameDefCap] Mengusulkan Penyatuan"
  INS_loyalist_events.4.desc: "Delegasi [FROM.GetAdjective] telah tiba di [ROOT.Capital.GetCapitalVictoryPointName] dengan usulan unifikasi. Mereka menunjuk pada warisan Melayu yang dimiliki masyarakat kami dan mencatat bahwa batas-batas antar negara kami ditetapkan oleh para administrator kolonial Eropa, bukan oleh masyarakat yang mendiami tanah tersebut. Proposal tersebut akan membuat kedua pemerintahan dibubarkan dan direformasi menjadi satu negara."
  INS_loyalist_events.4.a: "Kita menerima usulan penyatuan."
  INS_loyalist_events.4.b: "Kita terpaksa menolaknya."
  INS_loyalist_events.5.t: "[FROM.GetNameDefCap] Menerima Penyatuan"
  INS_loyalist_events.5.desc: "Diplomat kami telah kembali dari [FROM.Capital.GetCapitalVictoryPointName] dengan membawa kabar baik. Pemerintah [FROM.GetAdjective] telah menerima usulan kami, dan pejabat mereka sudah membuat pengaturan untuk integrasi wilayah mereka ke dalam pemerintahan kami."
  INS_loyalist_events.5.a: "Bersama-sama, kita jauh lebih kuat!"
  INS_loyalist_events.6.t: "[FROM.GetNameDefCap] Menolak Penyatuan"
  INS_loyalist_events.6.desc: "Diplomat kami telah kembali dari [FROM.Capital.GetCapitalVictoryPointName] dengan tangan kosong. Pemerintah [FROM.GetAdjective] tidak bersedia menerima usulan tersebut. Hanya sedikit alasan yang diberikan, dan delegasi kami dipulangkan dengan hanya formalitas yang sopan."
  INS_loyalist_events.6.a: "Kerugian bagi mereka."
  # MALAYA CHAIN - Subject Malaya (Overlord receives)
  INS_loyalist_events.7.t: "[FROM.GetNameDefCap] Menuntut Referendum di [MAL.GetName]"
  INS_loyalist_events.7.desc: "[FROM.GetNameDefCap] telah meminta secara resmi agar kita mengizinkan digelarnya referendum di [MAL.GetName] mengenai persoalan penyatuan dengan negara mereka. Duta besar mereka berterus terang mengenai hasil yang kemungkinan besar terjadi, menyatakan bahwa bangsa Melayu di kedua sisi perbatasan menganggap diri mereka satu bangsa. Mengizinkan pemungutan suara ini hampir pasti berarti kehilangan [MAL.GetName]."
  INS_loyalist_events.7.a: "Biarkan rakyat menentukan nasibnya sendiri."
  INS_loyalist_events.7.b: "Kita tidak akan mengizinkannya."
  # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)
  INS_loyalist_events.8.t: "[FROM.GetNameDefCap] Menyetujui Referendum Penyatuan"
  INS_loyalist_events.8.desc: "Tuan kami telah memberikan izin kepada [FROM.FROM.GetNameDef] untuk mengadakan referendum di negara kami. [FROM.FROM.GetAdjective] juru kampanye telah tiba, dan pemungutan suara akan dimulai dalam bulan ini. Pertanyaan yang diajukan kepada masyarakat kami adalah pertanyaan yang sederhana. Apakah kita ingin bergabung dengan [FROM.FROM.GetNameDef], atau ingin tetap seperti sekarang?"
  INS_loyalist_events.8.a: "Kita akan bergabung dengan mereka."
  INS_loyalist_events.8.b: "Kita lebih memilih bertahan."
  # MALAYA CHAIN - Overlord informed of MAL's choice
  INS_loyalist_events.9.t: "[FROM.GetNameDefCap] Memilih Menentang Penyatuan"
  INS_loyalist_events.9.desc: "Referendum di [FROM.GetName] telah selesai. Rakyat [FROM.GetAdjective] telah memilih untuk tetap berada di bawah pemerintahan kami. Para juru kampanye [FROM.FROM.GetAdjective] telah berangkat."
  INS_loyalist_events.9.a: "Sesuai dugaan."
  INS_loyalist_events.10.t: "[FROM.GetNameDefCap] Memilih untuk Bersatu"
  INS_loyalist_events.10.desc: "Referendum di [FROM.GetName] telah diakhiri dengan pemungutan suara yang mendukung penyatuan dengan [FROM.FROM.GetNameDef]. Administrator kami di wilayah tersebut melaporkan bahwa hasilnya sudah diharapkan. Kita wajib menghormatinya."
  INS_loyalist_events.10.a: "Kita telah memberikan janji kita."
  # MALAYA CHAIN - INS receives result
  INS_loyalist_events.11.t: "Referendum Malaya Berhasil"
  INS_loyalist_events.11.desc: "Rakyat [MAL.GetName] telah memilih untuk bergabung dengan negara kita. [MAL.GetAdjective] pejabat bekerja sama dengan pemerintahan kami untuk memulai pengalihan wewenang. Akan ada satu perbatasan yang lebih sedikit di peta dunia Melayu."
  INS_loyalist_events.11.a: "Selamat datang kembali ke pangkuan ibu pertiwi."
  INS_loyalist_events.12.t: "Penyatuan Malaya Ditolak"
  INS_loyalist_events.12.desc: "Usulan kami untuk penyatuan dengan [MAL.GetName] telah ditolak. Pemerintah [MAL.GetAdjective], atau mereka yang berada di atasnya, telah memutuskan untuk tidak melakukannya. Kita harus meninjau kembali masalah ini pada waktu yang lebih tepat."
  INS_loyalist_events.12.a: "Kita tidak akan melupakan penolakan ini."
  INS_loyalist_events.13.t: "[FROM.GetNameDefCap] Mengusulkan Kompromi atas Singapura"
  INS_loyalist_events.13.desc: "Pemerintah [FROM.GetAdjective] telah mendekati kita membawa usulan kompromi mengenai Singapura. Mereka menuntut kedaulatan atas pulau tersebut, merujuk kedudukannya di jantung dunia Melayu. Sebagai imbalannya, mereka siap menjamin akses berkelanjutan kita ke pelabuhan, pangkalan militernya, serta seluruh hak konsesi sumber daya yang saat ini berlaku."
  INS_loyalist_events.13.a: "Sebuah kesepakatan yang adil."
  INS_loyalist_events.13.b: "Singapura tidak dijual."
  INS_loyalist_events.14.t: "Kompromi Singapura Diterima"
  INS_loyalist_events.14.desc: "Kesepakatan telah disetujui. Singapura akan diserahkan ke bawah kendali kita, sementara pihak penguasa terdahulu mempertahankan hak akses komersial dan militer ke pelabuhannya. Sang saka kita kini berkibar megah di atas salah satu pelabuhan terpenting di Asia."
  INS_loyalist_events.14.a: "Selat Malaka kini milik kita."
  INS_loyalist_events.15.t: "Kompromi Singapura Ditolak"
  INS_loyalist_events.15.desc: "Usulan kita telah ditolak. Pihak penguasa Singapura enggan melepaskan pulau tersebut dalam kondisi apa pun. Kita telah menawarkan segalanya selain kedaulatan penuh, dan itu pun belum cukup bagi mereka."
  INS_loyalist_events.15.a: "Biarlah demikian."
  INS_loyalist_events.16.t: "[FROM.GetNameDefCap] Meminta Penyerahan Ceylon"
  INS_loyalist_events.16.desc: "Pemerintah [FROM.GetAdjective] telah mengajukan permohonan resmi atas penyerahan Ceylon (Sri Lanka). Diplomat mereka menyinggung hubungan dagang dan pertautan etnis yang telah berlangsung berabad-abad antara pulau itu dan dunia Melayu. Klaim tersebut sejujurnya terbilang tipis, namun [FROM.GetNameDef] telah tumbuh sedemikian kuat sehingga permintaan tersebut harus dipertimbangkan secara serius."
  INS_loyalist_events.16.a: "Baiklah, biarkan mereka memilikinya."
  INS_loyalist_events.16.b: "Ceylon akan tetap berada di bawah kendali kita."
  INS_loyalist_events.17.t: "Ceylon Resmi Diserahkan"
  INS_loyalist_events.17.desc: "Proses penyerahan Ceylon telah tuntas. Administrasi kita telah mulai menempatkan pejabat di pulau tersebut, dan serah terima berlangsung aman tanpa insiden. Kita kini mengukuhkan kedudukan strategis di kedua sisi selat."
  INS_loyalist_events.17.a: "Sempurna."
  INS_loyalist_events.18.t: "Permintaan Ceylon Ditolak"
  INS_loyalist_events.18.desc: "Permintaan kami untuk pemindahan Ceylon telah ditolak. Pengendali saat ini tidak mempunyai niat untuk berpisah dengan pulau tersebut, dan diplomat kami melaporkan bahwa diskusi lebih lanjut mengenai masalah ini tidak akan membuahkan hasil."
  INS_loyalist_events.18.a: "Mungkin di lain kesempatan."
  INS_loyalist_events.19.t: "[FROM.GetNameDefCap] Menuntut Referendum di Papua"
  INS_loyalist_events.19.desc: "[FROM.GetNameDefCap] telah menuntut agar kita mengizinkan referendum di Papua timur. Di sisi perbatasan [FROM.GetAdjective], terdapat jalan-jalan baru yang membelah rimba, klinik-klinik yang diperkuat dokter pemerintah, serta sekolah-sekolah yang mengajarkan bahasa daerah. Sementara di sisi kita, gubernur terakhir hanya mengunjungi Port Moresby dua kali dalam tiga tahun. Duta besar [FROM.GetAdjective] tidak perlu banyak berucap lebih dari fakta itu."
  INS_loyalist_events.19.a: "Biarkan mereka menggelar pemungutan suara."
  INS_loyalist_events.19.b: "Kita tidak akan mengizinkan hal ini."
  INS_loyalist_events.20.t: "Referendum Papua Disetujui"
  INS_loyalist_events.20.desc: "Pihak Australia sepakat untuk menggelar referendum. Setiap distrik di Papua timur mengembalikan hasil yang serupa. Investasi nyata kita di belahan barat pulau tersebut berbicara jauh lebih lantang daripada poster kampanye mana pun."
  INS_loyalist_events.20.a: "Pulau itu akhirnya bersatu utuh."
  INS_loyalist_events.21.t: "Referendum Papua Ditolak"
  INS_loyalist_events.21.desc: "Pihak Australia menolak. Gubernur mereka di Port Moresby mengeluarkan pernyataan yang menyebut tuntutan tersebut sebagai penghinaan terhadap kedaulatan Australia. Rakyat Papua sendiri sama sekali tidak dimintai pendapat."
  INS_loyalist_events.21.a: "Kita akan mengingat penolakan ini."
  INS_loyalist_events.22.t: "[FROM.GetNameDefCap] Menuntut Penyerahan Timor Timur"
  INS_loyalist_events.22.desc: "Pemerintah [FROM.GetAdjective] telah melayangkan tuntutan resmi atas penyerahan Timor Timur. Duta besar mereka mencatat bahwa garnisun kita di sana hanya berkekuatan kurang dari dua ratus serdadu dan Lisboa nyaris tidak mengalokasikan anggaran apa pun ke wilayah itu selama bertahun-tahun. Beliau lantas bertanya, apa sebenarnya yang sedang kita pertahankan di sana."
  INS_loyalist_events.22.a: "Tidak sepadan berperang demi wilayah itu."
  INS_loyalist_events.22.b: "Timor adalah milik kita dan akan tetap demikian."
  INS_loyalist_events.23.t: "Timor Timur Diserahkan"
  INS_loyalist_events.23.desc: "Penguasa kolonial Timor Timur telah mulai menarik mundur garnisunnya dan mengemas administrasi mereka. Seluruh pulau sebentar lagi akan berada di bawah wewenang kedaulatan [INS.GetAdjective]."
  INS_loyalist_events.23.a: "Sebagaimana mestinya."
  INS_loyalist_events.24.t: "Tuntutan atas Timor Timur Ditolak"
  INS_loyalist_events.24.desc: "Gubernur kolonial di Dili secara pribadi menulis surat penolakan atas tuntutan kita, menegaskan bahwa Timor Timur tetaplah wilayah kedaulatan pemerintahnya. Staf umum militer kita telah menyusun rencana darurat seandainya kabinet hendak menindaklanjuti persoalan ini lebih jauh."
  INS_loyalist_events.24.a: "Mulai persiapan militer."
  INS_loyalist_events.25.t: "[FROM.GetNameDefCap] Mengusulkan Penyatuan"
  INS_loyalist_events.25.desc: "Sebuah delegasi [FROM.GetAdjective] telah tiba membawa usulan penyatuan dua republik kita. Mereka berpendapat bahwa rakyat kita berbagi akar rumpun Austronesia yang jauh lebih purba daripada batas-batas kolonial yang memisahkan kita, dan bahwa sebuah negara tunggal yang membentang di seantero kepulauan akan menjadi kekuatan terhebat di Asia Tenggara. Menerima usulan ini berarti membubarkan pemerintahan kita dan berintegrasi ke dalam negara mereka."
  INS_loyalist_events.25.a: "Kita menerima penyatuan ini."
  INS_loyalist_events.25.b: "Kita telah berjuang terlalu keras demi republik ini."
  INS_loyalist_events.26.t: "[FROM.GetNameDefCap] Menerima Penyatuan"
  INS_loyalist_events.26.desc: "Pemerintah [FROM.GetAdjective] telah menerima proposal kami. Pejabat mereka sudah berkoordinasi dengan kami untuk memulai proses integrasi. Dari Aceh hingga Luzon, dari Kalimantan hingga Mindanao, bangsa kita kini menjangkau seluruh kepulauan Melayu."
  INS_loyalist_events.26.a: "Sebuah era baru telah bermula."
  INS_loyalist_events.27.t: "[FROM.GetNameDefCap] Menolak Penyatuan"
  INS_loyalist_events.27.desc: "Pemerintah [FROM.GetAdjective] telah menolak. Perjuangan kemerdekaan mereka sendiri masih teramat baru, dan terlalu mahal, bagi mereka untuk menyerahkan kedaulatan kepada negara lain. Usulan ini pun disimpan ke dalam laci arsip."
  INS_loyalist_events.27.a: "Sungguh disayangkan."
  INS_loyalist_events.28.t: "[FROM.GetNameDefCap] Meminta Referendum di [PHI.GetName]"
  INS_loyalist_events.28.desc: "[FROM.GetNameDefCap] telah secara resmi meminta agar kami mengizinkan referendum di [PHI.GetName] mengenai masalah unifikasi. Para diplomat mereka menekankan kesamaan nenek moyang bangsa Austronesia dan sifat artifisial dari perbatasan kolonial yang memisahkan mereka. Jika pemungutan suara tetap dilaksanakan, kemungkinan besar hasilnya akan mendukung [FROM.GetNameDef]."
  INS_loyalist_events.28.a: "Rakyat berhak menyuarakan kehendak mereka."
  INS_loyalist_events.28.b: "Sama sekali tidak mungkin."
  INS_loyalist_events.29.t: "Referendum Penyatuan Disetujui"
  INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap] telah mengusulkan penyatuan dua bangsa kita berdasarkan warisan bersama rumpun Austronesia. Tuan kolonial kita telah memberi izin untuk menggelar referendum atas perkara ini, dan juru kampanye [FROM.FROM.GetAdjective] telah mulai berdatangan. Hasil pemungutan suara akan menentukan apakah republik kita akan bergabung dengan [FROM.FROM.GetNameDef] atau meneruskan tatanan yang ada saat ini."
  INS_loyalist_events.29.a: "Ini adalah usulan yang sangat menarik."
  INS_loyalist_events.29.b: "Sama sekali tidak."
  INS_loyalist_events.30.t: "[FROM.GetNameDefCap] Memilih Menentang Penyatuan"
  INS_loyalist_events.30.desc: "Kotak suara telah dihitung dan juru kampanye [FROM.FROM.GetAdjective] mengirimkan packingnya. Orang [FROM.GetAdjective] memilih untuk tetap tinggal. Kemandirian tampaknya masih memiliki arti di [FROM.Capital.GetCapitalVictoryPointName]."
  INS_loyalist_events.30.a: "Demikianlah akhirnya."
  INS_loyalist_events.31.t: "[FROM.GetNameDefCap] Memilih untuk Bersatu"
  INS_loyalist_events.31.desc: "Kotak suara sudah dihitung. Orang [FROM.GetAdjective] telah memilih [FROM.FROM.GetNameDef] daripada kami, dan selisihnya tidak terlalu dekat. Administrator kami sudah menerima instruksi untuk memulai serah terima."
  INS_loyalist_events.31.a: "Rakyat telah berbicara."
  INS_loyalist_events.32.t: "[PHI.GetNameDefCap] Memilih untuk Bersatu"
  INS_loyalist_events.32.desc: "Referendum [PHI.GetAdjective] telah berakhir memenangkan pihak kita. Pemerintah mereka telah menerima hasilnya dan membuka kontak dengan kementerian luar negeri kita guna mengatur pengalihan kekuasaan."
  INS_loyalist_events.32.a: "Akhirnya kita bersatu padu."
  INS_loyalist_events.33.t: "[PHI.GetNameDefCap] Menolak Penyatuan"
  INS_loyalist_events.33.desc: "Pemerintah [PHI.GetAdjective] telah menolak usulan penyatuan kita. Parlemen mereka menolaknya bahkan tanpa pembahasan tingkat kedua. Kita telah menawarkan mereka tempat terhormat di negara terhebat di Asia Tenggara, namun mereka menolaknya mentah-mentah."
  INS_loyalist_events.33.a: "Sebuah kemunduran kecil, tiada lebih dari itu."
  INS_communist_events.6.t: "Agen [FROM.GetAdjective] Melakukan Agitasi di [ROOT.GetName]"
  INS_communist_events.6.desc: "Dinas intelijen kita telah mengonfirmasi kecurigaan yang telah lama ada. [FROM.GetNameDefCap] telah melancarkan kampanye subversi berkesinambungan di dalam perbatasan kita, mendanai sel-sel radikal, menyebarkan pamflet hasutan, dan mengorganisasi pemogokan di kalangan buruh. Agen-agen mereka telah menyusup ke dalam serikat buruh dan koperasi tani, serta kini secara terbuka menyerukan penggulingan pemerintahan kita. Keadaan telah mencapai titik genting, dan kita harus bertindak tegas sebelum situasi lepas kendali."
  INS_communist_events.6.a: "Hal ini tidak boleh dibiarkan!"
  INS_communist_events.7.t: "Subversi Komunis di [FROM.GetName]"
  INS_communist_events.7.desc: "Laporan yang mencemaskan telah sampai kepada kita dari [FROM.FROM.GetName]. Agen-agen yang beroperasi atas nama [FROM.GetNameDef] telah mengobarkan sentimen revolusioner di kalangan penduduk setempat, memanfaatkan ketidakpuasan terhadap administrasi kita untuk menghimpun dukungan bagi perebutan kekuasaan komunis. Jika dibiarkan tanpa tindakan, [FROM.FROM.GetNameDef] dapat jatuh sepenuhnya ke tangan kaum radikal, dan pembusukan ini bisa merambat ke wilayah kekuasaan kita lainnya."
  INS_communist_events.7.a: "Kita harus memadamkan ini sebelum meluas!"
  INS_communist_events.8.t: "Propaganda [FROM.GetAdjective] Beredar di [ROOT.GetName]"
  INS_communist_events.8.desc: "Pamflet dan selebaran yang berasal dari [FROM.GetAdjective] kian marak bermunculan di pabrik-pabrik, pasar, dan universitas kita. Selebaran tersebut mendengungkan perang kelas dan menjanjikan pembebasan lewat revolusi, dan kepolisian melaporkan bahwa selebaran itu mendapat sambutan hangat dari kalangan yang kecewa. Materinya sederhana namun sangat memikat, dan penyebarannya tak menunjukkan tanda-tanda mereda."
  INS_communist_events.8.a: "Cari tahu siapa dalang penyebar materi busuk ini!"
  ## Call for Revolution - Main Event (sent to target) ##
  INS_communist_events.1.t: "Revolusi di [ROOT.GetName]"
  INS_communist_events.1.desc: "Situasi telah memburuk di luar kendali. Agitasi [FROM.GetAdjective] selama berbulan-bulan telah membuahkan hasil, dan gerakan komunis di [ROOT.GetName] tak dapat lagi dibendung dengan tindakan biasa. Pemogokan umum telah melumpuhkan kota-kota besar, partisan bersenjata menguasai seluruh provinsi, dan pemerintah [FROM.GetAdjective] telah mengerahkan segenap dukungannya di belakang kaum revolusioner. Pasukan keamanan kita kewalahan dan kesetiaan mereka tak lagi pasti. Kita harus memutuskan sekarang apakah akan berjuang demi kelangsungan negara atau menerima kenyataan sebelum darah tertumpah lebih banyak."
  INS_communist_events.1.a: "Kerahkan tentara. Kita tidak akan menyerah begitu saja."
  INS_communist_events.1.b: "Perlawanan lanjutan hanya akan membawa malapetaka bagi rakyat kita."
  INS_communist_events.1.c: "Mungkin jika kita memberi mereka tempat di pemerintahan, kita masih bisa mengendalikannya."
  ## Civil War Chosen - sent to Indonesia ##
  INS_communist_events.2.t: "[FROM.GetNameDefCap] Memilih Bertempur"
  INS_communist_events.2.desc: "Pemerintah di [FROM.GetName] menolak untuk tunduk, dan telah memerintahkan angkatan bersenjatanya untuk menumpas gerakan revolusioner dengan kekerasan. Kawan-kawan kita di sana telah bersiap di posisi masing-masing dan merebut kubu-kubu pertahanan kunci. Perjuangan ini tidak akan berlangsung singkat, namun rakyat [FROM.GetName] telah menjatuhkan pilihan mereka, dan kita akan memastikan mereka tidak berjuang sendirian."
  INS_communist_events.2.a: "Revolusi melangkah maju."
  ## Surrender - sent to Indonesia ##
  INS_communist_events.3.t: "[FROM.GetNameDefCap] Telah Tumbang"
  INS_communist_events.3.desc: "Pemerintahan lama di [FROM.GetName] telah bertekuk lutut. Menghadapi gelombang pasang gerakan revolusioner dan kepastian bahwa [ROOT.GetNameDef] berdiri tegak di belakangnya, mereka melihat tidak ada jalan lain selain menyerah. Kekuasaan telah diserahkan kepada partai komunis setempat, dan pemerintahan baru telah mulai menghubungi kita untuk meminta arahan. Satu lagi bangsa terbebas dari cengkeraman tatanan lama."
  INS_communist_events.3.a: "Kemenangan gemilang bagi rakyat pekerja sedunia."
  ## Civil War in Subject - sent to overlord ##
  INS_communist_events.4.t: "Perang Saudara Meletus di [FROM.GetName]"
  INS_communist_events.4.desc: "Kaum revolusioner komunis, bersenjata dan terorganisasi dengan dukungan dari [FROM.FROM.GetNameDef], telah melancarkan pemberontakan terbuka di [FROM.GetName]. Administrasi kolonial telah kehilangan kendali atas sebagian besar wilayah, dan sang gubernur melaporkan bahwa garnisun setempat tidak mampu memulihkan ketertiban tanpa bala bantuan."
  INS_communist_events.4.a: "Kirim pasukan tempur. [FROM.GetName] adalah milik kita!"
  ## Subject Surrendered - sent to overlord ##
  INS_communist_events.5.t: "[FROM.GetName] Jatuh ke Tangan Komunis"
  INS_communist_events.5.desc: "Pemerintahan di [FROM.GetName] telah menyerah kepada pemberontak komunis tanpa perlawanan. Gubernur dan stafnya telah ditahan, bendera kami diturunkan, dan sebuah pemerintahan revolusioner diproklamasikan sebagai gantinya. Semua ini diatur oleh [FROM.FROM.GetNameDef] dan agen mereka, yang telah berupaya melemahkan otoritas kami di sana selama berbulan-bulan. Ini bukan sekedar pencurian, dan tidak akan dibiarkan begitu saja."
  INS_communist_events.5.a: "Ini penghinaan yang keterlaluan!"
 # Cooperate with Revolutionaries (sent to target)
  INS_communist_events.9.t: "Perwira [FROM.GetAdjective] Terlihat Bertemu dengan Kaum Pembangkang"
  INS_communist_events.9.desc: "[FROM.GetAdjective] Para agen terlihat bersama para agitator dan pemimpin militan terkenal di seluruh negeri. Pengurus mahasiswa yang dulunya membagikan brosur di sudut jalan kini mengadakan pertemuan tertutup dengan laki-laki yang membawa surat diplomatik [FROM.GetAdjective]. Publikasi yang dilarang dicetak lebih cepat daripada waktu yang bisa disita oleh polisi, dan protes yang dulunya gagal pada sore hari kini menutup seluruh distrik selama berhari-hari. Orang-orang komunis ini belajar bagaimana berorganisasi dalam kelompok yang lebih besar setiap hari, jika kita tidak bertindak cepat kita mungkin kehilangan kendali atas mereka."
  INS_communist_events.9.a: "Tumpas agen-agen asing ini sekarang juga!"
  # Spread Anti-Colonialist Sentiment (sent to subject target)
  INS_communist_events.10.t: "Retorika [FROM.GetAdjective] Makin Mendapat Tempat"
  INS_communist_events.10.desc: "Pamflet-pamflet [FROM.GetAdjective] telah menyusup ke barak-barak militer dan kalangan pegawai negeri sipil, dan upaya penyitaan tak banyak membendung arusnya. Selebaran itu berkisah tentang bangsa-bangsa yang merdeka dari belenggu penindasan, tentang rakyat yang mencampakkan gubernur kolonial dan membangun kedaulatan mandiri. Seruan itu akan lebih mudah ditumpas seandainya kata-katanya tidak menggemakan kebenaran. Bahkan pejabat yang setia pun mulai bertanya-tanya secara bisik-bisik, apakah tatanan kita saat ini melayani rakyat kita sendiri atau sekadar memanjakan tuan penjajah kita."
  INS_communist_events.10.a: "Kita harus melangkah dengan sangat hati-hati."
