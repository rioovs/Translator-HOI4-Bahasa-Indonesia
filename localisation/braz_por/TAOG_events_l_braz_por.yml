### AST - Union Control Events ###
  AST_union_control_events.1.t: "Agen Asing di Serikat Pekerja Kami"
  AST_union_control_events.1.desc: "Badan intelijen telah menyampaikan laporan yang meresahkan kepada pemerintah. Para aktivis komunis di Australia telah melakukan kontak dengan para pemimpin serikat pekerja setempat, mendistribusikan literatur radikal dan mendorong para pekerja untuk berorganisasi sesuai dengan garis revolusioner. Pergerakan ini masih kecil untuk saat ini, namun para pejabat keamanan memperingatkan bahwa inilah awal terjadinya hal tersebut. Keputusan harus dibuat sebelum keputusan itu berakar."
  AST_union_control_events.1.a: "Tetap awasi mereka. Kami akan menonton dan menunggu."
  AST_union_control_events.4.t: "Penyusup Komunis Merebut Wilayah [MAL.GetAdjective]"
  AST_union_control_events.4.desc: "Sebuah laporan mengejutkan telah sampai ke pemerintah. Sebuah operasi terkoordinasi telah merebut salah satu negara bagian kita dan mendeklarasikannya sebagai bagian dari pemerintahan revolusioner. Kecepatan dan pengorganisasian serangan tersebut telah menimbulkan pertanyaan yang tidak menyenangkan – badan intelijen kami menduga para pemberontak tidak bertindak sendiri, dan bahwa pihak asing mungkin telah mengarahkan mereka ke wilayah kami. Mereka yang lolos dari pengambilalihan belum menyerah. Mereka telah berkumpul kembali dan mengangkat senjata, bertekad untuk merebut kembali apa yang telah dirampas dari mereka."
  AST_union_control_events.4.a: "Cari tahu siapa dalang di balik ini. Para pemberontak ini tidak akan bertahan lama."
  AST_union_control_events.4.a.tt: "Pasukan milisi anti-komunis telah berkumpul dan dibentuk untuk melawan pendudukan komunis."
  AST_union_control_events.5.t: "Bencana [MAL.GetAdjective]"
  AST_union_control_events.5.desc: "Operasi tersebut berakhir dengan bencana. Pasukan kami tidak pernah sampai ke darat. Mereka berhasil dihalau oleh patroli loyalis, tersesat di selat, atau ditangkap sebelum mereka dapat menentukan posisi. Detilnya tidak jelas, namun hasilnya tidak. Yang lebih buruk lagi, pers telah mengetahui kejadian tersebut. Pertanyaan kini diajukan di parlemen tentang apa sebenarnya yang dilakukan pasukan kita di perairan tersebut. Tanggapan publik sangat mengejutkan dan memalukan. Apapun hasil yang kita harapkan untuk diraih dalam revolusi, kita harus mencari cara lain."
  AST_union_control_events.5.a: "Sebuah kemunduran yang mengerikan. Kita harus beralih ke cara lain untuk mendukung kawan-kawan kita."
  AST_union_control_events.3.t: "Revolusi Pecah di [MAL.GetNonIdeologyName]"
  AST_union_control_events.3.desc: "Para pekerja [MAL.GetNonIdeologyName] telah bangkit. Sel-sel komunis yang dipupuk melalui kampanye panjang kami telah mengangkat senjata di seluruh negeri – namun gambaran di lapangan sangat meresahkan. Kekuatan revolusioner mendapati diri mereka terkonsentrasi di wilayah yang salah, terpisah dari jantung semenanjung oleh perairan dan hutan. Tanpa pijakan di Tiongkok daratan, pemerintah hanya akan menunggu mereka keluar dan membuat revolusi kelaparan sebelum revolusi dapat menyebar. Australia harus bertindak secara diam-diam dan cepat untuk mendaratkan pejuang di semenanjung tersebut dan memberikan landasan yang dibutuhkan bagi revolusi untuk bertahan hidup."
  AST_union_control_events.3.a: "Kita tidak bisa membiarkan revolusi mati begitu saja. Amankan mereka."
  AST_union_control_events.2.t: "[AST.GetAdjective] Mendukung Agitator di Jalanan Kita"
  AST_union_control_events.2.desc: "Agen pemerintah komunis Australia telah tiba di kota kami. Mereka tidak bersembunyi – pamflet didistribusikan di gerbang pabrik, pidato disampaikan di lapangan umum, dan jaringan solidaritas dibangun antara agen Australia dan kelompok radikal lokal. Jaringan pengaruh asing yang ada tampaknya telah bangkit kembali dalam sekejap. Ini adalah kampanye yang terkoordinasi, dan pemerintah harus memutuskan bagaimana menanggapinya sebelum ketidakpuasan masyarakat menjadi sesuatu yang lebih sulit untuk diatasi."
  AST_union_control_events.2.b: "Perkembangan yang meresahkan."
